name: Package (phone)

# Builds the phone app (apps/mobile) for the stores with nsgo build (go tool nsgo, the version apps/mobile/go.mod pins) and keeps the packages as the run's artifact kando-phone: the iOS app's IPA and the Android App Bundle, with a checksums-phone.txt of their SHA-256. It runs by hand only (Actions › Package (phone) › Run workflow). Every run signs the App Bundle with the app's Google Play upload key, so the artifact's App Bundle is the one to upload to Play Console by hand; Google re-signs it with the app's signing key for the store. A plain run publishes nothing and leaves the IPA unsigned, which checks that the phone app still packages for the stores. A run with testflight checked signs the IPA with the team's Apple Distribution certificate and the App Store provisioning profiles of the app and its widget extension, and uploads it to App Store Connect, where it reaches TestFlight's internal testers once Apple has processed it (#227).
#
# Every run numbers its packages with the workflow's run number (-build-number, CFBundleVersion and Android's versionCode), since App Store Connect and Google Play take each upload of a version only with a build number greater than the last one's, and the run number only grows.
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Sign the IPA for the App Store and upload it to TestFlight
        type: boolean
        default: false

jobs:
  build:
    name: Package (iOS, Android)
    # The IPA needs Xcode's iOS SDK and actool, which compiles the icon; Android's arm64 needs no NDK. The image and its Xcode are pinned, not macos-latest's default, so the SDK App Store Connect sees changes only when this file does.
    # From April 2027 App Store Connect takes only apps built with the iOS 27 SDK (Xcode 27). GitHub has Xcode 27 only on the xcode-27 image, a public preview whose keychains refuse their own password (https://github.com/actions/runner-images/issues/14837), which the signing step below needs, so the signed build stays on Xcode 26 until that is fixed or Xcode 27 reaches a released image; the ios-next job checks meanwhile that the app builds with it.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    # nsgo build runs NSGo's code and the tools it calls, so the job holds a read-only token and keeps no git credentials, as the Package workflow's do.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work
          cache: false
      # The Go cache of CI's iOS and Android check (the mobile job in ci.yml), which builds the same packages for the same targets.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-mobile-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-mobile-
      # A TestFlight run signs the IPA. The Apple Distribution certificate goes into a keychain of the job's own, which codesign finds on the user's keychain list and nsgo build picks from by the profile's certificate; its file is deleted at once. The profiles of the app (ai.yldm.kando.mobile) and of its widget extension (ai.yldm.kando.mobile.widgets) both grant the app group group.ai.yldm.kando.mobile, which the app shares with its widgets and nsgo build checks for. The step hands both profiles' paths to the build, which passes them to nsgo build as -profile and -widgets-profile.
      - name: Import the distribution certificate and the profiles
        id: signing
        if: inputs.testflight
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
          IOS_WIDGETS_APPSTORE_PROFILE: ${{ secrets.IOS_WIDGETS_APPSTORE_PROFILE }}
        run: |
          for name in IOS_DISTRIBUTION_P12 IOS_DISTRIBUTION_P12_PASSWORD IOS_APPSTORE_PROFILE IOS_WIDGETS_APPSTORE_PROFILE; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set, so the IPA cannot be signed for the App Store."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one argument per keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF '"Apple Distribution: YLDM Co., Ltd. (LXCL4Z68GU)"'; then
            echo "::error::IOS_DISTRIBUTION_P12 does not hold the team's Apple Distribution identity."
            exit 1
          fi
          profiles="$RUNNER_TEMP/profiles"
          mkdir "$profiles"
          printf '%s' "$IOS_APPSTORE_PROFILE" | base64 --decode > "$profiles/AppStore.mobileprovision"
          printf '%s' "$IOS_WIDGETS_APPSTORE_PROFILE" | base64 --decode > "$profiles/Widgets.mobileprovision"
          echo "profile=$profiles/AppStore.mobileprovision" >> "$GITHUB_OUTPUT"
          echo "widgets-profile=$profiles/Widgets.mobileprovision" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
      # The upload key (alias upload, RSA 4096, valid until 2054) is a PKCS#12 whose store and key password are the same, kept in Vault at secret/yldm/production/kando-android-upload-key and here as the repository's ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD. Its file is written for the Android build alone and removed after it, whatever the build did.
      - name: Write the upload key
        id: upload-key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The upload key's $name is not set, so the App Bundle cannot be signed for Google Play."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/upload.p12"
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore")
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
      # Each target is built into a folder of its own. The App Bundle is Google Play's package, which the store channel makes in place of an APK. The IPA is the App Store's whatever the channel, so its build takes none: on the store channel the app would also ask the App Store for a newer version, which it does not do today.
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE: ${{ steps.upload-key.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          PROFILE: ${{ steps.signing.outputs.profile }}
          WIDGETS_PROFILE: ${{ steps.signing.outputs.widgets-profile }}
        run: |
          sign=()
          if [ -n "$PROFILE" ]; then
            sign=(-profile "$PROFILE" -widgets-profile "$WIDGETS_PROFILE")
          fi
          go tool nsgo build -target ios "${sign[@]}" -build-number "$BUILD_NUMBER" -output "$RUNNER_TEMP/ios" apps/mobile
          NSGO_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" NSGO_KEY_PASSWORD="$KEYSTORE_PASSWORD" go tool nsgo build -target android_arm64 -channel store -build-number "$BUILD_NUMBER" -keystore "$KEYSTORE" -key-alias upload -output "$RUNNER_TEMP/android" apps/mobile
      - name: Remove the upload key
        if: always() && steps.upload-key.outputs.keystore != ''
        env:
          KEYSTORE: ${{ steps.upload-key.outputs.keystore }}
        run: rm -f "$KEYSTORE"
      # One IPA and one App Bundle, the IPA carrying the app's ID, the run's build number, its icon, the local network usage description iOS asks with and the export compliance answer TestFlight needs, the App Bundle signed by the upload key alone, by its certificate's SHA-256 fingerprint. A signed IPA's app and widget extension must also carry valid signatures, each with its App Store profile embedded.
      - name: Collect the packages
        id: collect
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNED: ${{ inputs.testflight }}
          UPLOAD_KEY_SHA256: C3:37:93:08:4F:1B:33:EA:75:75:C0:3B:50:30:D1:DF:56:E8:69:D5:16:D8:40:CA:A3:89:37:2F:FD:57:71:A1
        run: |
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/ios/releases/*-ios.ipa)
          aabs=("$RUNNER_TEMP"/android/releases/*-android-arm64.aab)
          if [ "${#ipas[@]}" -ne 1 ] || [ "${#aabs[@]}" -ne 1 ]; then
            echo "::error::nsgo build made ${#ipas[@]} IPAs and ${#aabs[@]} App Bundles, not one each"
            exit 1
          fi
          unzip -q "${ipas[0]}" -d "$RUNNER_TEMP/ipa"
          plist=$(echo "$RUNNER_TEMP"/ipa/Payload/*.app/Info.plist)
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = ai.yldm.kando.mobile
          plutil -extract NSLocalNetworkUsageDescription raw "$plist" >/dev/null
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$plist")" = false
          plutil -extract CFBundleIcons xml1 -o /dev/null "$plist"
          test "$(plutil -extract CFBundleVersion raw "$plist")" = "$BUILD_NUMBER"
          signers=$(keytool -printcert -jarfile "${aabs[0]}" | awk '/SHA256:/{print $2}' | sort -u)
          if [ "$signers" != "$UPLOAD_KEY_SHA256" ]; then
            echo "::error::The App Bundle is signed by $signers, not the upload key $UPLOAD_KEY_SHA256"
            exit 1
          fi
          if [ "$SIGNED" = true ]; then
            app=$(dirname "$plist")
            codesign --verify --deep --strict --verbose=2 "$app"
            for bundle in "$app" "$app"/PlugIns/*.appex; do
              test -f "$bundle/embedded.mobileprovision"
              codesign -dvv "$bundle" 2>&1 | grep -F "Authority=Apple Distribution: YLDM Co., Ltd. (LXCL4Z68GU)"
            done
          fi
          echo "ipa=${ipas[0]}" >> "$GITHUB_OUTPUT"
          out=$RUNNER_TEMP/out
          mkdir "$out"
          cp -- "${ipas[0]}" "${aabs[0]}" "$out/"
          cd "$out"
          shasum -a 256 -- * > "$RUNNER_TEMP/checksums-phone.txt"
          mv "$RUNNER_TEMP/checksums-phone.txt" .
          cat checksums-phone.txt
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kando-phone
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
      # The upload goes through asc, the App Store Connect CLI, pinned to a release whose checksum is checked before it runs, with the team's App Store Connect API key, the one the Package workflow notarizes with. --app takes the bundle ID, which names the app record. The upload commits the IPA and watches a couple of minutes for Apple refusing it at once; processing takes longer, after which the build shows in TestFlight for the internal testers.
      - name: Upload to TestFlight
        if: inputs.testflight
        env:
          ASC_VERSION: 5.3.4
          ASC_SHA256: d4a3004973d601119801b30959c52d5fc289910ce294429c01aa63c2982570ba
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.APPSTORE_API_KEY_P8 }}
          ASC_BYPASS_KEYCHAIN: "1"
          IPA: ${{ steps.collect.outputs.ipa }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64; do
            if [ -z "${!name}" ]; then
              echo "::error::The App Store Connect API key's $name is not set, so the IPA cannot be uploaded."
              exit 1
            fi
          done
          asc="$RUNNER_TEMP/asc"
          curl -fsSL -o "$asc" "https://github.com/rudrankriyam/App-Store-Connect-CLI/releases/download/$ASC_VERSION/asc_${ASC_VERSION}_macOS_arm64"
          echo "$ASC_SHA256  $asc" | shasum -a 256 -c -
          chmod +x "$asc"
          "$asc" builds upload --app ai.yldm.kando.mobile --ipa "$IPA" --verify-timeout 2m --output table
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

  # The IPA built with Xcode 27 and the iOS 27 SDK, unsigned, so a problem with them (in nsgo build or the app) shows before the App Store requires them in April 2027. It signs and uploads nothing and does not hold back the packages above.
  ios-next:
    name: Package (iOS, Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work
          cache: false
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go tool nsgo build -target ios -build-number "$BUILD_NUMBER" -output "$RUNNER_TEMP/ios" apps/mobile
          ls "$RUNNER_TEMP"/ios/releases/*-ios.ipa
