name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repository root is a Go workspace (go.work), not a module, so ./... matches nothing there: the jobs list the five modules. The landing page, apps/site, is a Vite+ project with a job of its own (Site), so that a pull request that breaks its build, such as one that renames a screenshot or a featured site's logo, fails here rather than in the Site workflow after it is merged.
env:
  PKGS: ./apps/kando/... ./apps/mobile/... ./packages/core/... ./packages/media/... ./packages/study/... ./packages/sync/...

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ffmpeg: the rows that install ffmpeg set KANDO_REQUIRE_FFMPEG, which fails the tests that need it rather than letting them skip.
          - { name: Linux, os: ubuntu-latest, ffmpeg: "1" }
          - { name: macOS, os: macos-latest, ffmpeg: "1" }
          # Windows runs all five modules, as Release publishes the Windows installers.
          - { name: Windows, os: windows-latest, ffmpeg: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      # Each job that builds keeps a Go cache of its own. setup-go's cache has one key for every job, so the first job to finish (Lint, which builds next to nothing) saved it, and every other job rebuilt from scratch on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ matrix.name }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ matrix.name }}-
      # NSGo's tester (nsgotest) runs the app headless, with no window or display and an approximate text engine, so the tests need none of the system's GTK, Pango or fonts. ffmpeg runs in packages/media's tests of frames and posters, which fail without it where the row sets KANDO_REQUIRE_FFMPEG.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg
      # Chocolatey puts ffmpeg's shim in its bin folder, which the runner's PATH already holds.
      - name: Install ffmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # -timeout stops a test that hangs with the stacks of every goroutine, well before the job's own limit would cancel it without them.
      - name: Test
        shell: bash
        env:
          KANDO_REQUIRE_FFMPEG: ${{ matrix.ffmpeg }}
          TEST_PKGS: ${{ matrix.pkgs || env.PKGS }}
        run: go test -timeout 5m $TEST_PKGS
      # The screenshot scenes, headless: each plays its steps and checks what it shows, with no pictures drawn, so a change that breaks a scene fails here (the Screenshots job draws them). They are skipped without KANDO_SCREENSHOTS, the folder they would write to.
      - name: Screenshot scenes
        if: runner.os == 'Linux'
        shell: bash
        run: KANDO_SCREENSHOTS="$RUNNER_TEMP/screenshots" go test -count=1 -timeout 5m -run TestScreenshot ./apps/kando/ ./apps/kando/films/ ./apps/mobile/

  # The tests that make real encrypted images with hdiutil (apps/kando/vault, and the app's TestLockEncryptsTheLibraryOnDisk), which run only where KANDO_VAULT_TESTS is set: on GitHub's macOS runners an image takes a minute or more to make, attach and detach, too long for the Test job's five minutes a package, so they run here alone with time to spare.
  vault:
    name: Vault (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - name: Test
        env:
          KANDO_VAULT_TESTS: "1"
        run: go test -count=1 -timeout 35m -run 'TestALibraryLocksIntoItsImageAndOpensAgain|TestOpenTakesInWhatWasLeftBesideTheImage|TestLockEncryptsTheLibraryOnDisk' ./apps/kando/vault/ ./apps/kando/

  # The tests under the race detector. The app's root package takes about 15 minutes with it on a 10-core Mac, so it runs on pushes to main only; a pull request runs every other package with it, a few minutes.
  race:
    name: Race
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - name: Test with the race detector
        env:
          EVENT: ${{ github.event_name }}
        run: |
          pkgs=$(go list $PKGS)
          if [ "$EVENT" != push ]; then
            pkgs=$(grep -vx kando/apps/kando <<< "$pkgs")
          fi
          # shellcheck disable=SC2086 # one package a word
          go test -race -timeout 45m $pkgs

  # The screenshot scenes drawn in real windows on macOS (README's Screenshots), kept as the run's artifact screenshots-macos, so a pull request that changes what a screen looks like can be compared with main's pictures. Each test runs in a process of its own, within nsgo test's limit per test.
  screenshots:
    name: Screenshots
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      # The app's scenes save their pictures in apps/kando/.nsgo/test/screenshots/macos, and the drop zone's, drawn by the films package's own test, in apps/kando/films' folder of the same name. Both run, and the pictures are kept, though one of them fails.
      - name: Draw the scenes
        run: go tool nsgo test -target macos -timeout 10m -run TestScreenshots -env KANDO_SCREENSHOTS=1 apps/kando
      - name: Draw the drop zone
        if: ${{ !cancelled() }}
        run: go tool nsgo test -target macos -run TestScreenshotDropZone -env KANDO_SCREENSHOTS=1 apps/kando/films
      - name: Keep the pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-macos
          path: |
            apps/kando/.nsgo/test/screenshots/macos/
            apps/kando/films/.nsgo/test/screenshots/macos/
          retention-days: 14
          if-no-files-found: error
          # The pictures are under .nsgo, a hidden folder, which upload-artifact leaves out unless told.
          include-hidden-files: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Go cache: this job builds little, and the cache storage is left to the jobs that build (see the Test job).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          for module in apps/kando apps/mobile packages/core packages/media packages/study packages/sync; do
            (cd "$module" && go mod tidy)
          done
          git diff --exit-code -- '*go.mod' '*go.sum'
      # A merge or rebase resolved by hand can leave its markers behind in a file that still builds, such as a Markdown or JSON file.
      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)|^\|\|\|\|\|\|\| '; then
            echo "::error::Conflict markers are left in the files above."
            exit 1
          fi
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
      # The browser extension, apps/kando/resources/browser-extension, which Release zips for each browser family: its manifest names files that are there, its strings are in the five languages, and its scripts parse (browser-extension-check.mjs, with the runner's Node.js). Whether its generated files are current, the Go tests check (apps/kando/browse).
      - name: Browser extension
        run: .github/scripts/browser-extension.sh "$RUNNER_TEMP"
      # changelog.sh writes the release notes only when Release runs, where a mistake would stop a release, so its test runs on every change.
      - name: changelog.sh
        run: .github/scripts/changelog-test.sh
      # mygo-bridge.go makes the update of Kando's MyGo builds only when Release runs, where a mistake would stop a release or strand those builds, so its test runs on every change.
      - name: mygo-bridge.go
        run: .github/scripts/mygo-bridge-test.sh

  cross:
    name: Build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ matrix.goos }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ matrix.goos }}-
      # go vet compiles the tests too, such as the Unix-only desktop/system_unix_test.go and the Windows-only desktop/trash_windows_test.go. The app is built again with nodra_nomygo, the tag of the Package workflow's builds, which leave nodra's MyGo helpers out (apps/kando/nsgo.yaml).
      - name: Build and vet
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build $PKGS
            GOARCH=$arch go build -tags=nodra_nomygo ./apps/kando/...
            GOARCH=$arch go vet $PKGS
          done

  # The phone app (apps/mobile) vetted for iOS and Android, behind their build tags, which the Test and Build jobs never compile. Vetting for iOS compiles its cgo against the iOS SDK, so it runs on macOS, whose image has Xcode; Android's arm64 needs no SDK. package-phone.yml packages it for the stores, by hand.
  mobile:
    name: Check (iOS, Android)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - name: nsgo check
        working-directory: apps/mobile
        run: go tool nsgo check -target ios,android_arm64

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Go cache: this job builds little, and the cache storage is left to the jobs that build (see the Test job).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # govulncheck needs a module, so it runs in each one; the workspace still resolves the modules' replaced packages.
      - run: |
          for module in apps/kando apps/mobile packages/core packages/media packages/study packages/sync; do
            echo "::group::$module"
            govulncheck -C "$module" ./...
            echo "::endgroup::"
          done

  # The landing page, apps/site: format, lint and type checks, the build with its prerender, and the tests against the built pages. It reads the app's catalogs, screenshots, icon and source, so it runs on every pull request rather than on changes to apps/site only.
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+ installs the Node.js of .node-version, the pnpm of package.json and the locked dependencies (vp install), and caches the dependencies by the lockfile.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: apps/site
          version-file: package.json
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
      - run: vp check
      - run: vp build
      - run: vp test run
        env:
          KANDO_SITE_DIST: dist
      # The router's route tree is generated by the build and committed; a route added without it fails here.
      - name: Route tree is current
        run: git diff --exit-code -- src/routeTree.gen.ts

  # Whether a pull request changes how the packages are made: the workflows and scripts, the Go workspace, the app's nsgo.yaml, module, changelog, icon or resources. A pull request that changes none of them has its packages built on main after it merges, and again by Release, rather than waiting on three package builds, the macOS one the slowest job of CI, for a change they cannot catch.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.diff.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(\.github/(workflows/(ci|package|release)\.yml|scripts/)|go\.work|apps/kando/(nsgo\.yaml|go\.(mod|sum)|CHANGELOG\.md|brand/|resources/))'; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi

  # The packages Release builds, from the same workflow: on every push to main, and on a pull request that changes how they are made (changes), so that such a change that breaks one shows on its pull request.
  package:
    name: Package
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.package == 'true') }}
    uses: ./.github/workflows/package.yml
