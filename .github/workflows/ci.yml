name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repository root is a Go workspace (go.work), not a module, so ./... matches nothing there: the jobs list the three modules. The landing page, apps/site, is a Vite+ project with a job of its own (Site), so that a pull request that breaks its build, such as one that renames a screenshot or a featured site's logo, fails here rather than in the Site workflow after it is merged.
env:
  PKGS: ./apps/kando/... ./packages/core/... ./packages/media/...

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ffmpeg: the rows that install ffmpeg set KANDO_REQUIRE_FFMPEG, which fails the tests that need it rather than letting them skip.
          - { name: Linux, os: ubuntu-latest, ffmpeg: "1" }
          - { name: macOS, os: macos-latest, ffmpeg: "1" }
          # Windows runs all three modules, as Release publishes the Windows installers.
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      # Each job that builds keeps a Go cache of its own. setup-go's cache has one key for every job, so the first job to finish (Lint, which builds next to nothing) saved it, and every other job rebuilt from scratch on every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ matrix.name }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ matrix.name }}-
      # NSGo's tester (nsgotest) runs the app headless, with no window or display and an approximate text engine, so the tests need none of the system's GTK, Pango or fonts. ffmpeg runs in packages/media's tests of frames and posters, which fail without it where the row sets KANDO_REQUIRE_FFMPEG.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg
      - name: Test
        shell: bash
        env:
          KANDO_REQUIRE_FFMPEG: ${{ matrix.ffmpeg }}
          TEST_PKGS: ${{ matrix.pkgs || env.PKGS }}
        run: go test $TEST_PKGS

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Go cache: this job builds little, and the cache storage is left to the jobs that build (see the Test job).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          for module in apps/kando packages/core packages/media; do
            (cd "$module" && go mod tidy)
          done
          git diff --exit-code -- '*go.mod' '*go.sum'
      # A merge or rebase resolved by hand can leave its markers behind in a file that still builds, such as a Markdown or JSON file.
      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)|^\|\|\|\|\|\|\| '; then
            echo "::error::Conflict markers are left in the files above."
            exit 1
          fi
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh
      # changelog.sh writes the release notes only when Release runs, where a mistake would stop a release, so its test runs on every change.
      - name: changelog.sh
        run: .github/scripts/changelog-test.sh

  cross:
    name: Build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ matrix.goos }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-${{ matrix.goos }}-
      # go vet compiles the tests too, such as the Unix-only desktop/system_unix_test.go and the Windows-only desktop/trash_windows_test.go. The app is built again with nodra_nomygo, the tag of the Package workflow's builds, which leave nodra's MyGo helpers out (apps/kando/nsgo.yaml).
      - name: Build and vet
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build $PKGS
            GOARCH=$arch go build -tags=nodra_nomygo ./apps/kando/...
            GOARCH=$arch go vet $PKGS
          done

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Go cache: this job builds little, and the cache storage is left to the jobs that build (see the Test job).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # govulncheck needs a module, so it runs in each one; the workspace still resolves the modules' replaced packages.
      - run: |
          for module in apps/kando packages/core packages/media; do
            echo "::group::$module"
            govulncheck -C "$module" ./...
            echo "::endgroup::"
          done

  # The landing page, apps/site: format, lint and type checks, the build with its prerender, and the tests against the built pages. It reads the app's catalogs, screenshots, icon and source, so it runs on every pull request rather than on changes to apps/site only.
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+ installs the Node.js of .node-version, the pnpm of package.json and the locked dependencies (vp install), and caches the dependencies by the lockfile.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: apps/site
          version-file: package.json
          node-version-file: .node-version
          cache: true
          cache-dependency-path: pnpm-lock.yaml
      - run: vp check
      - run: vp build
      - run: vp test run
        env:
          KANDO_SITE_DIST: dist
      # The router's route tree is generated by the build and committed; a route added without it fails here.
      - name: Route tree is current
        run: git diff --exit-code -- src/routeTree.gen.ts

  # Whether a pull request changes how the packages are made: the workflows and scripts, the Go workspace, the app's nsgo.yaml, module, changelog, icon or resources. A pull request that changes none of them has its packages built on main after it merges, and again by Release, rather than waiting on three package builds, the macOS one the slowest job of CI, for a change they cannot catch.
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.diff.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(\.github/(workflows/(ci|package|release)\.yml|scripts/)|go\.work|apps/kando/(nsgo\.yaml|go\.(mod|sum)|CHANGELOG\.md|brand/|resources/))'; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi

  # The packages Release builds, from the same workflow: on every push to main, and on a pull request that changes how they are made (changes), so that such a change that breaks one shows on its pull request.
  package:
    name: Package
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.package == 'true') }}
    uses: ./.github/workflows/package.yml
