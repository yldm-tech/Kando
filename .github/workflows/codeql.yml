name: CodeQL

# GitHub's code scanning of the three Go modules and of the workflows themselves.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: apps/kando/go.sum
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # The repository root is a Go workspace, not a module, so ./... matches nothing: the modules are listed.
      - if: matrix.build-mode == 'manual'
        run: go build ./apps/kando/... ./packages/core/... ./packages/media/...
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
