name: Diagnose the plugin pages hang

# Temporary: runs the source plugins' pages tests under the race detector on GitHub's runner, many times and alongside the rest of the race tests for load, to catch the intermittent hang with sourcetest's stacks. Removed before the pull request merges.
on:
  push:
    branches: [fix/plugin-pages-hang]

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work
          cache: false
      - name: Stress
        run: |
          go test -race -c -o "$RUNNER_TEMP/emby.test" ./apps/kando/plugins/official/emby/
          go test -race -c -o "$RUNNER_TEMP/jf.test" ./apps/kando/plugins/official/jellyfin/
          (cd apps/kando/plugins/official/emby && "$RUNNER_TEMP/emby.test" -test.run Pages -test.count 300 -test.timeout 40m -test.v > "$RUNNER_TEMP/emby.log" 2>&1; echo "emby exit=$?") &
          (cd apps/kando/plugins/official/jellyfin && "$RUNNER_TEMP/jf.test" -test.run Pages -test.count 300 -test.timeout 40m -test.v > "$RUNNER_TEMP/jf.log" 2>&1; echo "jellyfin exit=$?") &
          go test -race ./packages/... > /dev/null 2>&1 || true
          wait
          grep -c -- '--- PASS' "$RUNNER_TEMP/emby.log" "$RUNNER_TEMP/jf.log" || true
          if grep -l -- '--- FAIL' "$RUNNER_TEMP/emby.log" "$RUNNER_TEMP/jf.log"; then
            grep -h -B2 -A400 'timed out; the plugin had sent' "$RUNNER_TEMP/emby.log" "$RUNNER_TEMP/jf.log" | head -2000
            exit 1
          fi
