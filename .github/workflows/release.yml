name: Release

# Releases main once CI has passed on it, with the version the Conventional Commits since the last tag call for (.github/scripts/next-version.sh): it writes the version into apps/kando/nsgo.yaml (.github/scripts/set-version.sh) and the version's release notes, from the same commits, into apps/kando/CHANGELOG.md (.github/scripts/changelog.sh), commits both to main as chore(release), tags the commit, and creates a draft GitHub release with those notes. The Package workflow then builds the app for macOS, Windows and Linux from the tag, and the last job checks the packages of every platform against the checksums Package took, attests their provenance, uploads them with checksums.txt to the draft and publishes it. Run it by hand from main to force a bump; it releases only a commit main's CI has passed on.
#
# The jobs run in one workflow, one after another, because a tag pushed with the workflow's GITHUB_TOKEN starts no other workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump to make, whatever the commits call for
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    # A run by hand must start from main: from another branch it would push that branch's commits to main.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.commit.outputs.sha != '' && steps.version.outputs.version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Next version
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(.github/scripts/next-version.sh "$SHA" "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing $version from $SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release at $SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      # A run that CI started follows CI's success on the commit; a run by hand checks that main's CI passed on it.
      - name: Check CI
        if: steps.version.outputs.version != '' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq .total_count)
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $SHA, main's head; release it once it has."
            exit 1
          fi
      # nsgo.yaml's id is the app's identity on every platform, which the updates follow, so a release would hand users an app under a placeholder, which they would keep after it is renamed.
      - name: Check the identifier
        if: steps.version.outputs.version != ''
        run: |
          identifier=$(sed -nE 's/^id: *"?([^" ]+)"? *$/\1/p' apps/kando/nsgo.yaml)
          if [ -z "$identifier" ] || [[ $identifier == com.example.* || $identifier == dev.example.* ]]; then
            echo "::error::apps/kando/nsgo.yaml's id is ${identifier:-missing}; set the app's real one before releasing."
            exit 1
          fi
      # The version goes to main in a commit of its own, which the tag points at, so that the app built from the tagged tree carries it, together with its section of CHANGELOG.md, which TestChangelogHasTheVersion requires. A section written by hand before the release is kept. The push only fast-forwards main from the commit CI tested: if main has moved since, its own CI run releases these commits with it.
      - name: Commit the version
        id: commit
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/set-version.sh "$VERSION"
          .github/scripts/changelog.sh add "$VERSION"
          # Named, as the changelog is a new file until the first release writes it, and git commit -a leaves new files out.
          git add -- apps/kando/nsgo.yaml apps/kando/resources/browser-extension/manifest.json apps/kando/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $VERSION"
          fi
          if git push origin HEAD:refs/heads/main; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            # A push that a branch rule refuses fails here too, so the message names both causes.
            message="Could not fast-forward main. Either main moved on, and its next release takes these commits, or a rule on main refused github-actions[bot], which then needs a bypass of the rule."
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      # GitHub sometimes refuses a push for a fault of its own ("Unable to create temporary file", "missing necessary objects"), which here left v0.13.1's version commit on main without its tag, so the push is tried again before the run gives up. Should it still fail, main keeps the version commit untagged, and the run of the next push to main releases it: next-version.sh gives the same version, set-version.sh and changelog.sh change nothing, and the tag goes on that push's commit.
      - name: Tag
        if: steps.commit.outputs.sha != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git tag -a "$VERSION" -m "$VERSION" "$SHA"
          for attempt in 1 2 3 4 5; do
            if git push origin "refs/tags/$VERSION"; then
              exit 0
            fi
            echo "::warning::Pushing $VERSION failed (attempt $attempt of 5)."
            sleep $((attempt * 15))
          done
          echo "::error::Could not push the tag $VERSION."
          exit 1
      # The release's notes start with a table of the downloads for each system, whose names are the ones package.yml and browser-extension.sh give the files, then the version's section of CHANGELOG.md. The macOS packages are signed and notarized and the Windows ones signed (see package.yml), which the notes say.
      - name: Draft the release
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          v=${VERSION#v}
          d="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Download

          | System | Download |
          |---|---|
          | macOS (Apple silicon) | [kando-$v-macos-arm64.dmg]($d/kando-$v-macos-arm64.dmg) |
          | macOS (Intel) | [kando-$v-macos-x64.dmg]($d/kando-$v-macos-x64.dmg) |
          | Windows (x64) | [Installer]($d/kando-$v-windows-x64-setup.exe) · [Portable .tar.gz]($d/kando-$v-windows-amd64.tar.gz) |
          | Windows (ARM64) | [Installer]($d/kando-$v-windows-arm64-setup.exe) · [Portable .tar.gz]($d/kando-$v-windows-arm64.tar.gz) |
          | Linux (x64) | [AppImage]($d/kando-$v-linux-x64.AppImage) · [Debian/Ubuntu .deb]($d/kando-$v-linux-x64.deb) · [Arch .pkg.tar.gz]($d/kando-$v-linux-x64.pkg.tar.gz) |
          | Linux (ARM64) | [AppImage]($d/kando-$v-linux-arm64.AppImage) · [Debian/Ubuntu .deb]($d/kando-$v-linux-arm64.deb) · [Arch .pkg.tar.gz]($d/kando-$v-linux-arm64.pkg.tar.gz) |
          | Browser extension | [Chrome, Edge, Brave]($d/kando-browser-extension-chromium-$v.zip) · [Firefox]($d/kando-browser-extension-firefox-$v.zip) |

          EOF
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'
          > [!NOTE]
          > The macOS disk images are signed with a Developer ID and notarized by Apple. The Windows installers and the app are signed with a Certum code signing certificate; while the certificate is new to SmartScreen, it may still warn before the first run: choose More info, then Run anyway. On Windows, Kando does not download yt-dlp, ffmpeg and whisper-cli yet; install them with a package manager and put them on your PATH. `checksums.txt` lists the SHA-256 of every file, and `gh attestation verify <file> --repo ${{ github.repository }}` checks that a file was built by this repository's Release workflow.
          EOF
          {
            echo
            .github/scripts/changelog.sh notes "$VERSION"
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  package:
    name: Package
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
      CERTUM_OTP: ${{ secrets.CERTUM_OTP }}

  publish:
    name: Publish
    needs: [version, package]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # One artifact per platform, kando-macOS, kando-Windows and kando-Linux, merged into one folder, as a release holds its files side by side.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kando-*
          merge-multiple: true
          path: dist
      # A platform whose artifact went missing would publish a release without it, so each one's checksums must be there.
      - name: Check every platform is there
        working-directory: dist
        run: |
          for name in macOS Windows Linux; do
            if [ ! -f "checksums-$name.txt" ]; then
              echo "::error::The kando-$name artifact is missing."
              exit 1
            fi
          done
      # The Package jobs took the checksums from the files nsgo build made, so this catches a package changed on its way here.
      - name: Check the checksums
        working-directory: dist
        run: |
          cat checksums-*.txt > checksums.txt
          rm checksums-*.txt
          sha256sum --check --strict checksums.txt
      # The browser extension of the tag, zipped for the browsers built on Chromium and for Firefox (.github/scripts/browser-extension.sh), released and attested beside the packages.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          path: source
          persist-credentials: false
      - name: Browser extension
        working-directory: source
        run: |
          .github/scripts/browser-extension.sh ../dist
          cd ../dist
          sha256sum kando-browser-extension-*.zip >>checksums.txt
      # The script plugins' revocation list, which Kando fetches once a day from the latest release (script.RevocationsURL in apps/kando/plugins/script): the owner signs it offline with the plugin root (.github/scripts/plugin-revocations.sh) and commits it, as the root's key never reaches CI, and each release attaches the committed file, with its checksum, beside the packages. A list that does not verify against Kando's root, has expired, or is older than the one the latest release published stops the release, as Kando would refuse it or pause plugins over it. With no list committed yet the release goes without one, which Kando reads as no list, its address answering 404.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: source/go.work
          cache: false
      - name: Plugin revocation list
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list=apps/kando/plugins/revocations/kando-plugin-revocations.json
          if [ ! -f "$list" ]; then
            echo "::notice::No plugin revocation list is committed ($list), so this release publishes none, which Kando reads as no list."
            exit 0
          fi
          # The latest release published, which this one, still a draft, is not yet.
          if ! assets=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            echo "::error::Could not list the latest release's files to compare the revocation list with."
            exit 1
          fi
          previous=()
          if grep -qx kando-plugin-revocations.json <<<"$assets"; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern kando-plugin-revocations.json --dir "$RUNNER_TEMP/previous"
            previous=(-previous "$RUNNER_TEMP/previous/kando-plugin-revocations.json")
          fi
          go run ./apps/kando/plugins/official/cmd/official revocations -list "$list" ${previous[@]+"${previous[@]}"}
          cp "$list" ../dist/kando-plugin-revocations.json
          cd ../dist
          sha256sum kando-plugin-revocations.json >>checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
