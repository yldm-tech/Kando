name: Package

# Builds the app's packages for macOS, Windows and Linux with mygo build (go tool mygo, the version apps/kando/go.mod pins), each platform on a runner of its own, and keeps each platform's packages, with a checksums-<platform>.txt of their SHA-256, as the run's artifact kando-<platform>. A release build also signs the app's update for each target with the MYGO_UPDATER_PRIVATE_KEY secret and keeps the update files with the packages: the archive of the app as installed, the deltas from earlier versions and the manifest update-<target>.json, from which installed apps update themselves (updates in apps/kando/mygo.json, MyGo's docs/updates.md). CI calls it to check that every package builds; Release calls it with the tag it made, and its Publish job checks the checksums and uploads the packages to that tag's draft release. MyGo needs no cgo, so Ubuntu makes the Windows installers (with NSIS) as well as the Linux packages; the macOS disk images need a macOS runner.
#
# A release build signs the macOS app and its disk images with YLDM's Developer ID certificate (the MACOS_CERTIFICATE secret, a base64 PKCS#12, and MACOS_CERTIFICATE_PASSWORD) and notarizes the disk images with an App Store Connect API key (APPSTORE_API_KEY_P8, base64, APPSTORE_API_KEY_ID and APPSTORE_API_ISSUER_ID), so Gatekeeper opens them without a warning. The identity and the notary profile go into the build's copy of mygo.json only, so builds on other machines and CI's builds stay signed ad hoc and need no secrets. Run it by hand (Actions › Package › Run workflow) to sign and notarize a branch without releasing: the packages become the run's artifacts. The Windows installers carry no signature yet, for which SmartScreen warns; that needs a code signing certificate (see MyGo's docs/github-actions.md).
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS packages, as a release does
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: The release tag to build the packages of, which must match the version in mygo.json; empty builds the checked-out commit
        type: string
        default: ""
    secrets:
      MYGO_UPDATER_PRIVATE_KEY:
        description: The secret key that signs the app's updates (mygo keygen); a release build fails without it, as installed apps could not update to the release
        required: false
      MACOS_CERTIFICATE:
        description: The Developer ID Application certificate and its private key, as a base64 PKCS#12; a release build fails without it
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        description: The password of MACOS_CERTIFICATE
        required: false
      APPSTORE_API_KEY_P8:
        description: The App Store Connect API key that notarizes the disk images, as a base64 .p8
        required: false
      APPSTORE_API_KEY_ID:
        description: The ID of APPSTORE_API_KEY_P8
        required: false
      APPSTORE_API_ISSUER_ID:
        description: The issuer ID of the App Store Connect team of APPSTORE_API_KEY_P8
        required: false

env:
  # The identity in MACOS_CERTIFICATE, by the name codesign finds it by.
  MACOS_SIGNING_IDENTITY: "Developer ID Application: YLDM Co., Ltd. (LXCL4Z68GU)"

jobs:
  build:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Notarizing the two disk images can take Apple's service a while.
    timeout-minutes: ${{ matrix.name == 'macOS' && 60 || 30 }}
    # mygo build runs MyGo's code and the tools it calls, so the job holds a read-only token and keeps no git credentials; Release uploads the packages from a job of its own.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # packages: what each target must make, so that a package mygo build leaves out (as it does the Windows installer without NSIS) fails the row rather than going missing from the release. script: the install script of the Linux archives, the same for both architectures, so uploaded once.
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64", packages: "*.dmg" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64", packages: "*-setup-*.exe" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64", packages: "*.deb *.tar.gz", script: linux-amd64/install.sh }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # A tag that does not match the version in mygo.json would upload packages named for another version.
      - name: Check the version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: test "$TAG" = "v$(jq -r .version apps/kando/mygo.json)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false
      # A Go cache of each platform's own, as CI's jobs keep (see ci.yml).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-package-${{ matrix.name }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-package-${{ matrix.name }}-
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      # A release build, or a run by hand that asks for it, signs and notarizes on macOS. The certificate goes into a keychain of the job's own, with the notary credentials, which notarytool checks with Apple as it stores them; the files written from the secrets are deleted at once.
      - name: Import the signing certificate and the notary key
        id: signing
        if: matrix.name == 'macOS' && (inputs.tag != '' || inputs.sign)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPSTORE_API_KEY_P8 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set, so the macOS packages cannot be signed and notarized."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one argument per keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$MACOS_SIGNING_IDENTITY\""; then
            echo "::error::MACOS_CERTIFICATE does not hold $MACOS_SIGNING_IDENTITY."
            exit 1
          fi
          printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool store-credentials kando-notary --keychain "$keychain" --key "$RUNNER_TEMP/notary-key.p8" --key-id "$APPSTORE_API_KEY_ID" --issuer "$APPSTORE_API_ISSUER_ID" >/dev/null
          rm "$RUNNER_TEMP/notary-key.p8"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
      # Only a release build gets the key: CI's builds make no updates, which would only be thrown away. A signed build names the identity and the notary profile in the job's copy of mygo.json, which is never committed.
      - name: Build
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ inputs.tag }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ inputs.tag != '' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          if [ -n "$TAG" ] && [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::The MYGO_UPDATER_PRIVATE_KEY secret is not set, so the release would carry no update that installed apps could install."
            exit 1
          fi
          if [ -n "$KEYCHAIN" ]; then
            jq --arg identity "$MACOS_SIGNING_IDENTITY" --arg keychain "$KEYCHAIN" '.macos.signingIdentity = $identity | .macos.notarize = {keychainProfile: "kando-notary", keychain: $keychain}' apps/kando/mygo.json > "$RUNNER_TEMP/mygo.json"
            mv "$RUNNER_TEMP/mygo.json" apps/kando/mygo.json
          fi
          go tool mygo build -platform "$PLATFORM" -o "$RUNNER_TEMP/packages" apps/kando
      # Gatekeeper's own check of what users download: the app is signed with the Developer ID and the hardened runtime, and each disk image carries its notarization ticket.
      - name: Check the signatures
        if: steps.signing.outcome == 'success'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          for target in ${PLATFORM//,/ }; do
            dir="$RUNNER_TEMP/packages/${target/\//-}"
            codesign --verify --deep --strict --verbose=2 "$dir/Kando.app"
            codesign -dvv "$dir/Kando.app" 2>&1 | grep -F "Authority=$MACOS_SIGNING_IDENTITY"
            for dmg in "$dir"/*.dmg; do
              xcrun stapler validate "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            done
          done
      # The packages users download: per target, the disk image, the installer, or the Debian package and the archive; and on Linux the script that installs the archive, which is the same for both architectures. A release build adds each target's update files: exactly one manifest, the archive it names (on Linux the archive above) and the deltas, of which there are none when no earlier release has a manifest. They are copied into one folder, as a release holds its files side by side, with their SHA-256 taken here from the files mygo build made.
      - name: Collect the packages
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ matrix.name }}
          PLATFORM: ${{ matrix.platform }}
          PACKAGES: ${{ matrix.packages }}
          SCRIPT: ${{ matrix.script }}
        run: |
          cd "$RUNNER_TEMP/packages"
          shopt -s nullglob
          read -ra patterns <<<"$PACKAGES"
          files=()
          for target in ${PLATFORM//,/ }; do
            dir=${target/\//-}
            for pattern in "${patterns[@]}"; do
              found=("$dir"/$pattern)
              if [ "${#found[@]}" -ne 1 ]; then
                echo "::error::mygo build made ${#found[@]} files matching $dir/$pattern, not one"
                exit 1
              fi
              files+=("${found[0]}")
            done
            if [ -n "$TAG" ]; then
              found=("$dir"/update-*.json)
              if [ "${#found[@]}" -ne 1 ]; then
                echo "::error::mygo build made ${#found[@]} update manifests in $dir, not one"
                exit 1
              fi
              files+=("${found[0]}")
              for update in "$dir"/*.tar.gz "$dir"/*.delta; do
                if [[ " ${files[*]} " != *" $update "* ]]; then
                  files+=("$update")
                fi
              done
            fi
          done
          if [ -n "$SCRIPT" ]; then
            if [ ! -f "$SCRIPT" ]; then
              echo "::error::mygo build made no $SCRIPT"
              exit 1
            fi
            files+=("$SCRIPT")
          fi
          out=$RUNNER_TEMP/out
          mkdir "$out"
          for file in "${files[@]}"; do
            if [ -e "$out/${file##*/}" ]; then
              echo "::error::mygo build made two packages named ${file##*/}"
              exit 1
            fi
            cp "$file" "$out/"
          done
          cd "$out"
          shasum -a 256 -- * > "$RUNNER_TEMP/checksums-$NAME.txt"
          mv "$RUNNER_TEMP/checksums-$NAME.txt" .
          cat "checksums-$NAME.txt"
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kando-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"
