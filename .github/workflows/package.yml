name: Package

# Builds the app's packages for macOS, Windows and Linux with nsgo build (go tool nsgo, the version apps/kando/go.mod pins), each platform on a runner of its own, and keeps each platform's files from nsgo build's releases folder, with a checksums-<platform>.txt of their SHA-256, as the run's artifact kando-<platform>: per target the installer (disk image, NSIS installer, or the Debian and Arch packages and the AppImage) with the .sha256 beside it that the install scripts check, and from the Linux row the install.sh and install.ps1 that install the latest release. A release build also signs the installers for the app's updates with the updates key and keeps each target's appcast-<target>.xml, the feed installed apps read from the latest release (updates in apps/kando/nsgo.yaml, NSGo's docs/public/en/building.md), which carries the version's section of apps/kando/CHANGELOG.md as the release notes the update dialogs show. On macOS and Windows it also makes the update that copies of Kando's MyGo builds install, update-<target>.json with the archive it names, so they move to the NSGo build (.github/scripts/mygo-bridge.go). CI calls it to check that every package builds; Release calls it with the tag it made, and its Publish job checks the checksums and uploads the files to that tag's draft release. NSGo's desktop builds need no cgo, so Ubuntu makes the Windows installers (with NSIS) as well as the Linux packages; the macOS disk images need a macOS runner.
#
# The packages are built with the nodra_nomygo tag (build.tags in apps/kando/nsgo.yaml), which leaves nodra's MyGo helpers, and MyGo with them, out of the app.
#
# A release build signs the macOS app and its disk images with YLDM's Developer ID certificate (the MACOS_CERTIFICATE secret, a base64 PKCS#12, and MACOS_CERTIFICATE_PASSWORD) and notarizes the disk images with an App Store Connect API key (APPSTORE_API_KEY_P8, base64, APPSTORE_API_KEY_ID and APPSTORE_API_ISSUER_ID, which the build gets as NSGO_NOTARY_KEY, NSGO_NOTARY_KEY_ID and NSGO_NOTARY_ISSUER), so Gatekeeper opens them without a warning. The identity goes to nsgo build's -sign flag only, so builds on other machines and CI's builds stay signed ad hoc and need no secrets. Run it by hand (Actions › Package › Run workflow) to sign and notarize a branch without releasing: the packages become the run's artifacts. The same builds sign the Windows executables, their libraries, the installers and the uninstallers inside them with YLDM's Certum SimplySign code signing certificate in Certum's cloud: nsgo build runs ssign (github.com/Le-Syl21/ssign, built here from a pinned commit) for each file through -sign-command, which logs in with CERTUM_EMAIL and the authenticator's TOTP URI in CERTUM_OTP and timestamps with Certum's server. Certum takes each one-time code once, so the signing runs one file at a time under a lock, and ssign keeps its session for the next file.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS packages and sign the Windows ones, as a release does
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: The release tag to build the packages of, which must match the version in nsgo.yaml; empty builds the checked-out commit
        type: string
        default: ""
    secrets:
      NSGO_UPDATES_KEY:
        description: The secret key that signs the app's updates, as nsgo keygen prints it, of apps/kando/nsgo.yaml's updates.key; without it the build takes it from MYGO_UPDATER_PRIVATE_KEY
        required: false
      MYGO_UPDATER_PRIVATE_KEY:
        description: The secret key that signed the MyGo builds' updates (mygo keygen), whose seed is NSGO_UPDATES_KEY; a release build fails without one of the two, as installed apps could not update to the release
        required: false
      MACOS_CERTIFICATE:
        description: The Developer ID Application certificate and its private key, as a base64 PKCS#12; a release build fails without it
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        description: The password of MACOS_CERTIFICATE
        required: false
      APPSTORE_API_KEY_P8:
        description: The App Store Connect API key that notarizes the disk images, as a base64 .p8
        required: false
      APPSTORE_API_KEY_ID:
        description: The ID of APPSTORE_API_KEY_P8
        required: false
      APPSTORE_API_ISSUER_ID:
        description: The issuer ID of the App Store Connect team of APPSTORE_API_KEY_P8
        required: false
      CERTUM_EMAIL:
        description: The e-mail of the Certum SimplySign account that holds the Windows code signing certificate; a release build fails without it
        required: false
      CERTUM_OTP:
        description: The otpauth URI of the SimplySign account's authenticator, from which ssign makes each login's one-time code
        required: false

env:
  # The identity in MACOS_CERTIFICATE, by the name codesign finds it by.
  MACOS_SIGNING_IDENTITY: "Developer ID Application: YLDM Co., Ltd. (LXCL4Z68GU)"
  # The ssign commit the Windows packages are signed with, reviewed before it was pinned: it talks only to Certum's cloudsign.webnotarius.pl and time.certum.pl.
  SSIGN_REV: 367bf7d3da14d5041d5e47f855ae2397b8028e33
  # The subject of the SimplySign certificate the Windows files must be signed by; ssign signs with the account's first card.
  WINDOWS_SIGNING_SUBJECT: "CN=Open Source Developer PENG HU,O=Open Source Developer,L=Yokohama,ST=Kanagawa,C=JP"

jobs:
  build:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Notarizing the two disk images can take Apple's service a while.
    timeout-minutes: ${{ matrix.name == 'macOS' && 60 || 30 }}
    # nsgo build runs NSGo's code and the tools it calls, so the job holds a read-only token and keeps no git credentials; Release uploads the packages from a job of its own.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # targets: the nsgo build targets of the row. installers: what each target must make, after kando-<version>-<target>, so that a package nsgo build leaves out (as it does the Windows installer without NSIS) fails the row rather than going missing from the release. scripts: install.sh and install.ps1, which every row writes alike, so kept from one. bridge: a release build of the row also makes the updates that Kando's MyGo builds install (.github/scripts/mygo-bridge.go).
          - { name: macOS, os: macos-latest, targets: "macos_arm64,macos_x64", installers: ".dmg", bridge: true }
          - { name: Windows, os: ubuntu-latest, targets: "windows_x64,windows_arm64", installers: "-setup.exe", bridge: true }
          - { name: Linux, os: ubuntu-latest, targets: "linux_x64,linux_arm64", installers: ".deb .pkg.tar.gz .AppImage", scripts: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # A tag that does not match the version in nsgo.yaml would upload packages named for another version.
      - name: Check the version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" = "v$(sed -nE 's/^version: *"?([0-9.]+)"? *$/\1/p' apps/kando/nsgo.yaml)"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.work
          cache: false
      # A Go cache of each platform's own, as CI's jobs keep (see ci.yml).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-package-${{ matrix.name }}-${{ hashFiles('go.work.sum', '**/go.sum') }}
          restore-keys: go-${{ runner.os }}-package-${{ matrix.name }}-
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis osslsigncode
      # ssign, built from the commit SSIGN_REV names with its own lock file, signs with the SimplySign certificate; a binary of the same commit comes from the cache.
      - name: Cache ssign
        id: ssign-cache
        if: matrix.name == 'Windows' && (inputs.tag != '' || inputs.sign)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/ssign
          key: ssign-${{ runner.os }}-${{ env.SSIGN_REV }}
      - name: Build ssign
        if: matrix.name == 'Windows' && (inputs.tag != '' || inputs.sign) && steps.ssign-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.local/ssign --git https://github.com/Le-Syl21/ssign --rev "$SSIGN_REV" ssign
      # A release build, or a run by hand that asks for it, signs and notarizes on macOS. The certificate goes into a keychain of the job's own, which codesign finds on the user's keychain list; the notary key is written to a file the build reads (NSGO_NOTARY_KEY), deleted with the keychain at the end of the job, and the certificate's file is deleted at once.
      - name: Import the signing certificate and the notary key
        id: signing
        if: matrix.name == 'macOS' && (inputs.tag != '' || inputs.sign)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPSTORE_API_KEY_P8 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set, so the macOS packages cannot be signed and notarized."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one argument per keychain path
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | xargs)
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$MACOS_SIGNING_IDENTITY\""; then
            echo "::error::MACOS_CERTIFICATE does not hold $MACOS_SIGNING_IDENTITY."
            exit 1
          fi
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "notary-key=$key" >> "$GITHUB_OUTPUT"
      # The version's section of apps/kando/CHANGELOG.md (.github/scripts/changelog.sh), which nsgo build -release-notes renders into each appcast as the release notes that Sparkle's and WinSparkle's update dialogs show above Install Update (and NSGo's prompt on Linux shows as text), and which the MyGo builds' update window shows from the manifests mygo-bridge.go signs. Every build writes it, CI's too, whose Linux appcasts nsgo build makes in every build: nsgo.yaml's version always has a section, as the Release workflow writes it in the commit that bumps the version and the app's tests (TestChangelogHasTheVersion) fail without one, so a section that the script cannot read fails CI rather than the release.
      - name: Write the release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=${TAG#v}
          if [ -z "$version" ]; then
            version=$(sed -nE 's/^version: *"?([0-9.]+)"? *$/\1/p' apps/kando/nsgo.yaml)
          fi
          .github/scripts/changelog.sh notes "v$version" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      # Only a release build gets the updates key: CI's builds make no appcasts for macOS and Windows, which would only be thrown away. The key is NSGO_UPDATES_KEY, else the seed of MYGO_UPDATER_PRIVATE_KEY, the 64-byte key the MyGo builds signed with, whose public key nsgo.yaml's updates.key is; nsgo build refuses a key of another public key. Every build passes the release notes the step before wrote to -release-notes, which goes into the appcasts only. A signed build passes the Developer ID identity to -sign and the notary key in NSGO_NOTARY_KEY*, so nsgo build signs with the hardened runtime, notarizes the disk images and staples their tickets; on Windows it passes ssign to -sign-command, which nsgo build runs for the executable, every unsigned library and program among its resources, the uninstaller and the installer.
      - name: Build
        env:
          WINDOWS_SIGN: ${{ matrix.name == 'Windows' && (inputs.tag != '' || inputs.sign) && 'true' || '' }}
          CERTUM_EMAIL: ${{ matrix.name == 'Windows' && (inputs.tag != '' || inputs.sign) && secrets.CERTUM_EMAIL || '' }}
          CERTUM_OTP: ${{ matrix.name == 'Windows' && (inputs.tag != '' || inputs.sign) && secrets.CERTUM_OTP || '' }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary-key }}
          NOTARY_KEY_ID: ${{ steps.signing.outputs.notary-key != '' && secrets.APPSTORE_API_KEY_ID || '' }}
          NOTARY_ISSUER: ${{ steps.signing.outputs.notary-key != '' && secrets.APPSTORE_API_ISSUER_ID || '' }}
          TARGETS: ${{ matrix.targets }}
          TAG: ${{ inputs.tag }}
          UPDATES_KEY: ${{ inputs.tag != '' && secrets.NSGO_UPDATES_KEY || '' }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ inputs.tag != '' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: |
          if [ -n "$TAG" ]; then
            if [ -z "$UPDATES_KEY" ] && [ -n "$MYGO_UPDATER_PRIVATE_KEY" ]; then
              UPDATES_KEY=$(printf '%s' "$MYGO_UPDATER_PRIVATE_KEY" | tr -d '[:space:]' | base64 --decode | head -c 32 | base64 | tr -d '[:space:]')
            fi
            if [ -z "$UPDATES_KEY" ]; then
              echo "::error::Neither the NSGO_UPDATES_KEY secret nor MYGO_UPDATER_PRIVATE_KEY is set, so the release would carry no update that installed apps could install."
              exit 1
            fi
            echo "::add-mask::$UPDATES_KEY"
            export NSGO_UPDATES_KEY=$UPDATES_KEY
          fi
          sign=()
          if [ -n "$WINDOWS_SIGN" ]; then
            if [ -z "$CERTUM_EMAIL" ] || [ -z "$CERTUM_OTP" ]; then
              echo "::error::The CERTUM_EMAIL or CERTUM_OTP secret is not set, so the Windows packages cannot be signed."
              exit 1
            fi
            export CERTUM_EMAIL CERTUM_OTP
            sign=(-sign-command "flock '$RUNNER_TEMP/ssign.lock' '$HOME/.local/ssign/bin/ssign' -n Kando -u https://github.com/$GITHUB_REPOSITORY %1")
          fi
          if [ -n "$KEYCHAIN" ]; then
            sign=(-sign "$MACOS_SIGNING_IDENTITY")
            export NSGO_NOTARY_KEY=$NOTARY_KEY NSGO_NOTARY_KEY_ID=$NOTARY_KEY_ID NSGO_NOTARY_ISSUER=$NOTARY_ISSUER
          fi
          go tool nsgo build -target "$TARGETS" -output "$RUNNER_TEMP/packages" -release-notes "$RUNNER_TEMP/notes.md" "${sign[@]}" apps/kando
      # Gatekeeper's own check of what users download: the app is signed with the Developer ID and the hardened runtime, and each disk image carries its notarization ticket.
      - name: Check the signatures
        if: steps.signing.outcome == 'success'
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          shopt -s nullglob
          for target in ${TARGETS//,/ }; do
            apps=("$RUNNER_TEMP"/packages/Kando-*-"$target"/Kando.app)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "::error::nsgo build made ${#apps[@]} Kando.app for $target, not one"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "${apps[0]}"
            codesign -dvv "${apps[0]}" 2>&1 | grep -F "Authority=$MACOS_SIGNING_IDENTITY"
            for dmg in "$RUNNER_TEMP"/packages/releases/*-"${target/_/-}".dmg; do
              xcrun stapler validate "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            done
          done
      # What Windows checks of what users download: every executable and library of the app and each installer carries a valid Authenticode signature, from the SimplySign certificate, with a timestamp, which keeps it valid after the certificate expires.
      - name: Check the Windows signatures
        if: matrix.name == 'Windows' && (inputs.tag != '' || inputs.sign)
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          shopt -s nullglob globstar
          subjects=()
          for target in ${TARGETS//,/ }; do
            dirs=("$RUNNER_TEMP"/packages/Kando-*-"$target")
            installers=("$RUNNER_TEMP"/packages/releases/*-"${target/_/-}"-setup.exe)
            if [ "${#dirs[@]}" -ne 1 ] || [ "${#installers[@]}" -ne 1 ]; then
              echo "::error::nsgo build made ${#dirs[@]} app folders and ${#installers[@]} installers for $target, not one each"
              exit 1
            fi
            for file in "${dirs[0]}"/**/*.exe "${dirs[0]}"/**/*.dll "${installers[0]}"; do
              out=$(osslsigncode verify -in "$file" -CAfile /etc/ssl/certs/ca-certificates.crt -TSA-CAfile /etc/ssl/certs/ca-certificates.crt 2>&1) || {
                printf '%s\n' "$out"
                echo "::error::${file#"$RUNNER_TEMP"/packages/} carries no valid signature"
                exit 1
              }
              if ! grep -q "Timestamp time:" <<<"$out"; then
                echo "::error::${file#"$RUNNER_TEMP"/packages/} carries no timestamp"
                exit 1
              fi
              subjects+=("$(sed -nE '/^Signer.s certificate:/,/^$/{s/^[[:space:]]*Subject: *//p}' <<<"$out" | head -1)")
              echo "signed: ${file#"$RUNNER_TEMP"/packages/}"
            done
          done
          for subject in "${subjects[@]}"; do
            if [ "$subject" != "$WINDOWS_SIGNING_SUBJECT" ]; then
              echo "::error::A Windows file is signed by $subject, not $WINDOWS_SIGNING_SUBJECT"
              exit 1
            fi
          done
      # Kando's MyGo builds (0.12.0 and older) update from update-<target>.json in the latest release, which nsgo build does not make, so a release build makes it for them (.github/scripts/mygo-bridge.go): the NSGo app as MyGo's updater unpacks it, with a manifest signed by MYGO_UPDATER_PRIVATE_KEY that carries the same release notes as the appcasts. An installed MyGo build then updates to this release once, and the NSGo build updates itself from its appcast after that. Every release makes it, so a copy left on 0.12.0 for a while still finds the latest release; a signed run by hand makes it too, as the run's artifacts, to check it before a release. On macOS each app gets its notarization ticket stapled first, as nsgo build staples only the disk images, so the updated app opens offline too. Linux has none: see mygo-bridge.go.
      - name: Make the updates of the MyGo builds
        if: matrix.bridge && (inputs.tag != '' || inputs.sign)
        env:
          TAG: ${{ inputs.tag }}
          TARGETS: ${{ matrix.targets }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GOWORK: "off"
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::The MYGO_UPDATER_PRIVATE_KEY secret is not set, so Kando's MyGo builds could not update to this release."
            exit 1
          fi
          version=${TAG#v}
          if [ -z "$version" ]; then
            version=$(sed -nE 's/^version: *"?([0-9.]+)"? *$/\1/p' apps/kando/nsgo.yaml)
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            for target in ${TARGETS//,/ }; do
              app=$RUNNER_TEMP/packages/Kando-$version-$target/Kando.app
              for attempt in 1 2 3 4 5; do
                if xcrun stapler staple "$app"; then
                  break
                fi
                if [ "$attempt" = 5 ]; then
                  echo "::warning::No notarization ticket stapled to the $target app; the MyGo builds' update to it opens once Gatekeeper reaches Apple."
                fi
                sleep 30
              done
            done
          fi
          public=$(sed -nE 's/^ *key: *([A-Za-z0-9+\/=]+) *$/\1/p' apps/kando/nsgo.yaml)
          go run .github/scripts/mygo-bridge.go make -version "$version" -repo "$GITHUB_REPOSITORY" -packages "$RUNNER_TEMP/packages" -targets "$TARGETS" -notes "$RUNNER_TEMP/notes.md" -public "$public"
          go run .github/scripts/mygo-bridge.go verify -dir "$RUNNER_TEMP/packages/releases" -public "$public"
      # The files of nsgo build's releases folder, which a release holds side by side: each target's installers with their .sha256, its appcast in a release build (on Linux in every build), and on the Linux row the install scripts. Every installer the row's targets should make must be there, once, as must a release build's appcasts. Their SHA-256 is taken here from the files nsgo build made.
      - name: Collect the packages
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ matrix.name }}
          TARGETS: ${{ matrix.targets }}
          INSTALLERS: ${{ matrix.installers }}
          SCRIPTS: ${{ matrix.scripts && 'true' || '' }}
          BRIDGE: ${{ matrix.bridge && 'true' || '' }}
          SIGN: ${{ inputs.sign && 'true' || '' }}
        run: |
          cd "$RUNNER_TEMP/packages/releases"
          shopt -s nullglob
          read -ra suffixes <<<"$INSTALLERS"
          for target in ${TARGETS//,/ }; do
            for suffix in "${suffixes[@]}"; do
              found=(*-"${target/_/-}$suffix")
              if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}.sha256" ]; then
                echo "::error::nsgo build made ${#found[@]} files matching *-${target/_/-}$suffix, not one with its .sha256"
                exit 1
              fi
            done
            if [ -n "$TAG" ] && [ ! -f "appcast-$target.xml" ]; then
              echo "::error::nsgo build made no appcast-$target.xml"
              exit 1
            fi
          done
          if [ -n "$TAG$SIGN" ] && [ -n "$BRIDGE" ]; then
            manifests=(update-*.json)
            archives=(kando-*-darwin-*.tar.gz kando-*-windows-*.tar.gz)
            read -ra targets <<<"${TARGETS//,/ }"
            if [ "${#manifests[@]}" -ne "${#targets[@]}" ] || [ "${#archives[@]}" -ne "${#targets[@]}" ]; then
              echo "::error::The row made ${#manifests[@]} manifests and ${#archives[@]} archives for the MyGo builds, not one each per target"
              exit 1
            fi
          fi
          files=()
          for file in *; do
            # nsgo build also writes winget/, the manifest to submit to winget-pkgs, which is no file of a release.
            [ -f "$file" ] || continue
            case $file in
              install.sh | install.ps1) [ -n "$SCRIPTS" ] || continue ;;
            esac
            files+=("$file")
          done
          if [ -n "$SCRIPTS" ] && { [ ! -f install.sh ] || [ ! -f install.ps1 ]; }; then
            echo "::error::nsgo build made no install.sh or install.ps1"
            exit 1
          fi
          out=$RUNNER_TEMP/out
          mkdir "$out"
          cp -- "${files[@]}" "$out/"
          cd "$out"
          shasum -a 256 -- * > "$RUNNER_TEMP/checksums-$NAME.txt"
          mv "$RUNNER_TEMP/checksums-$NAME.txt" .
          cat "checksums-$NAME.txt"
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kando-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error
      - name: Remove the signing keychain and the notary key
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_KEY: ${{ steps.signing.outputs.notary-key }}
        run: |
          rm -f "$NOTARY_KEY"
          security delete-keychain "$KEYCHAIN"
