# Weekly updates of the three Go modules and the workflows' actions, minor and patch updates of each grouped in one pull request. Dependabot titles them as Conventional Commits (chore(deps): ...), which the Labels workflow requires. A MyGo update that tools/mygo-dev/dev.go.patch no longer applies to fails the "mygo-dev patch" job of CI.
version: 2
updates:
  - package-ecosystem: gomod
    directories: [/apps/kando, /packages/core, /packages/media]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
