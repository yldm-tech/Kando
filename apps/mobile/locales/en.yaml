  message: "Upright, the lines show in the card under the picture."
  description: "Under the Subtitles on the Picture switch."
playerPanel:
  message: "Player Content"
  description: "Spoken name of the tabs under the player's card."
playerPart:
  message: "Part {index} · {from}–{to}"
  description: "A part of the film in the player's Parts tab, with when it starts and ends."
