    query: { type: "String", example: "tide" }
filmsNoSource:
  message: "No films from this source yet"
  description: "The Library's list when the chosen source has no film."
filmsOptions:
  message: "{title} Options"
  description: "Spoken name of the … button beside a film in the Library."
  placeholders:
    title: { type: "String", example: "Morning Talk" }
filmsPair:
  message: "Connect a Computer"
  description: "Button on the Library's card that opens pairing with a computer."
filmsPlayFromStart:
  message: "Watch from start"
  description: "In a film's options: plays it from its start rather than where it was left."
filmsResults:
  message: "Search results"
  description: "Heading of the Library's list while a search is typed."
filmsSaveOffline:
  message: "Save for offline"
  description: "Film options sheet: downloads the film to the phone to watch offline; its size is shown at the row end."
filmsSearch:
  message: "Search films and lines"
  description: "Placeholder and spoken name of the Library's search field, which finds titles and the lines of the films on the phone."
filmsSource:
  message: "Source"
  description: "Spoken name of the Library's chips, which narrow the list to where the films come from."
filmsSourceAll:
  message: "All"
  description: "Library chip: films from every source."
filmsSourceBilibili:
  message: "Bilibili"
  description: "Library chip and a film's source: films from Bilibili."
filmsSourceLocal:
  message: "Local files"
  description: "Library chip and a film's source: films added from files on the computer."
filmsSourceWeb:
  message: "Other sites"
  description: "Library chip and a film's source: films from sites other than YouTube and Bilibili."
filmsSourceYoutube:
  message: "YouTube"
  description: "Library chip and a film's source: films from YouTube."
filmsStatDays:
  message: "{count, plural, one {# day} other {# days}}"
  description: "Library stats tile: the streak, days in a row with study."
  placeholders:
    count: { type: "int", example: "5" }
filmsStatStreak:
  message: "Streak"
  description: "Library stats tile: label under the days in a row."
filmsStatToday:
  message: "watched today"
  description: "Library stats tile: label under the minutes of films played today, read on from the number and its unit (\"12 min watched today\"), so lower case in English."
filmsStatUnitDays:
  message: "{count, plural, one {day} other {days}}"
  description: "Library stats tile: the unit drawn small after the streak number."
  placeholders:
    count: { type: "int", example: "5" }
filmsStatUnitMinutes:
  message: "{count, plural, one {min} other {min}}"
  description: "Library stats tile: the unit drawn small after the minutes watched today."
  placeholders:
    count: { type: "int", example: "12" }
filmsStatUnitWords:
  message: "{count, plural, one {word} other {words}}"
  description: "Library stats tile: the unit drawn small after the count of new words."
  placeholders:
    count: { type: "int", example: "6" }
filmsStatVocabulary:
  message: "New words"
  description: "Library stats tile: label under the count of words saved to the vocabulary."
filmsStatWords:
  message: "{count, plural, one {# word} other {# words}}"
  description: "Library stats tile: how many words the vocabulary holds."
  placeholders:
    count: { type: "int", example: "38" }
filmsStorageFullBody:
  message: "New films the computer processes can’t upload. Make room in your storage, or delete old films on the computer."
  description: "Library warning banner while the user's storage is full: what that means and what to do."
filmsStorageFullTitle:
  message: "Your storage is full"
  description: "Library warning banner title: the user's storage takes nothing more."
filmsStorageKeysBody:
  message: "Re-enter the key on the computer in Settings › Account & Upload. Films already saved on this device still play."
  description: "Library warning banner while the storage refuses the computer's key: what to do. Account & Upload is the computer's settings section of that name."
filmsStorageKeysTitle:
  message: "Can’t read your storage: the access key is invalid"
  description: "Library warning banner title: the user's storage refuses the computer's key."
filmsSubscriptionAuto:
  message: "Auto-download new videos"
  description: "Subscription sheet: switch that has the computer queue the new videos by themselves rather than wait for the user."
filmsSubscriptionChannel:
  message: "Channel"
  description: "Subscription sheet: what a subscription follows, a channel."
filmsSubscriptionCollection:
  message: "Collection"
  description: "Subscription sheet: what a subscription follows, a Bilibili collection."
filmsSubscriptionDone:
  message: "Done"
  description: "Subscription sheet: button that closes it."
filmsSubscriptionFailed:
  message: "The last check failed: {error}"
  description: "Subscription sheet: why the computer's last check of the list failed, in the computer's words."
  placeholders:
    error: { type: "String", example: "yt-dlp could not reach the site" }
filmsSubscriptionGone:
  message: "{site} no longer has this list. {computer} still looks for it once a day."
  description: "Subscription sheet: the site deleted the list."
  placeholders:
    site: { type: "String", example: "YouTube" }
    computer: { type: "String", example: "Studio" }
filmsSubscriptionGoneLabel:
  message: "{name}, deleted by its site"
  description: "Library subscriptions row, for assistive technology: a subscription whose list is gone."
  placeholders:
    name: { type: "String", example: "Earth Science" }
filmsSubscriptionLabel:
  message: "{name}, {count, plural, =0 {no new videos} one {# new video} other {# new videos}}"
  description: "Library subscriptions row, for assistive technology: a subscription and how many new videos wait on it."
  placeholders:
    name: { type: "String", example: "Earth Science" }
    count: { type: "int", example: "2" }
filmsSubscriptionMeta:
  message: "{site} · {kind} · {computer}"
  description: "Subscription sheet: under its name, the site, what it follows and the computer that checks it."
  placeholders:
    site: { type: "String", example: "YouTube" }
    kind: { type: "String", example: "Channel" }
    computer: { type: "String", example: "Studio" }
filmsSubscriptionNew:
  message: "{count}"
  description: "Library subscriptions row: the badge with how many new videos wait on a subscription."
  placeholders:
    count: { type: "int", example: "2" }
filmsSubscriptionNone:
  message: "No new videos. New ones wait here for you."
  description: "Subscription sheet: no new video waits, for a subscription that asks first."
filmsSubscriptionNoneAuto:
  message: "No new videos. New ones are added to Jobs automatically."
  description: "Subscription sheet: no new video waits, for a subscription that adds them by itself."
filmsSubscriptionPaused:
  message: "Paused on {computer}."
  description: "Subscription sheet: the computer does not check the list now."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmsSubscriptionPausedLabel:
  message: "{name}, paused"
  description: "Library subscriptions row, for assistive technology: a paused subscription."
  placeholders:
    name: { type: "String", example: "Earth Science" }
filmsSubscriptionPlaylist:
  message: "Playlist"
  description: "Subscription sheet: what a subscription follows, a playlist."
filmsSubscriptionReadOnly:
  message: "{computer} lets this phone look at its subscriptions but not change them."
  description: "Subscription sheet: the computer made this phone read-only, so the sheet offers no action."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmsSubscriptionSpace:
  message: "Uploader"
  description: "Subscription sheet: what a subscription follows, a Bilibili uploader's space."
filmsSubscriptionTake:
  message: "Add all to Jobs"
  description: "Subscription sheet: button that sends every new video waiting on it to the computer's queue."
filmsSubscriptionWaiting:
  message: "{count, plural, =0 {New videos} one {# new video} other {# new videos}}"
  description: "Subscription sheet: heading of the new videos waiting for the user."
  placeholders:
    count: { type: "int", example: "2" }
filmsSubscriptions:
  message: "Subscriptions"
  description: "Library: heading of the computers' subscriptions."
filmsSubscriptionsAdd:
  message: "Add"
  description: "Library: beside the subscriptions' heading, opens the Add sheet, which takes a channel or playlist link."
filmsSubscriptionsAddLabel:
  message: "Add a subscription"
  description: "Library: what assistive technology reads for the subscriptions' Add button."
filmsTitle:
  message: "Library"
  description: "Tab and title of the Library: the films on the phone and the computers' libraries."
filmsUnpairedBody:
  message: "Downloading, transcription and translation all happen in Kando on your computer. Once connected, its library shows up here, and links you send from your phone go to it."
  description: "Body of the Library's card while no computer is paired."
filmsUnpairedTitle:
  message: "Not connected to a computer yet"
  description: "Title of the Library's card while no computer is paired."
filmsUnsubscribe:
  message: "Unsubscribe"
  description: "Subscription sheet: the row that removes the subscription, and its confirmation's button."
filmsUnsubscribeMessage:
  message: "The videos it added stay in the library on {computer}."
  description: "Confirmation before unsubscribing: what stays."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmsUnsubscribeTitle:
  message: "Unsubscribe from “{title}”?"
  description: "Confirmation before unsubscribing."
  placeholders:
    title: { type: "String", example: "Earth Science" }
filmStudyLines:
  message: "Study Lines"
  description: "Button and option that open the player of a film kept on the phone by its lines alone, as its computer keeps no video of it."
filmSaveLines:
  message: "Save Lines to Phone"
  description: "Button and option that keep the lines of a film whose computer keeps no video of it on the phone, to study them."
filmLinesSaved:
  message: "Lines saved"
  description: "Where a film stands: its lines are on the phone, without its video, which its computer does not keep."
filmSubtitlesOnly:
  message: "Subtitles only"
  description: "A film whose computer kept its subtitles but not its video; heading where its video would play, and a tag in its row."
filmNoVideo:
  message: "{computer} keeps no video of this film, only its lines."
  description: "Under “Subtitles only” where a film’s video would play."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmMaking:
  message: "Being made"
  description: "Tag in the row of a film whose computer is still making its subtitles; it can be played meanwhile."
filmMakingNote:
  message: "{computer} is still making this film’s subtitles. Play it now: the lines come in as they are made, starting where you watch."
  description: "On the page of a film whose computer is still making its subtitles, above its Play button."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerMakingWait:
  message: "{computer} is getting this film ready. It plays as soon as its sound or video is in."
  description: "Where the picture would show, for a film being made whose sound and video are not on the computer yet, as a link that has not started downloading."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmVideoComing:
  message: "{computer} is downloading the video."
  description: "Under “Subtitles only” while the computer downloads the film’s video."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmVideoAtHome:
  message: "The video is on {computer}. On the same network as it, you can download it to this phone."
  description: "Under “Subtitles only” where the video of a film streamed from the user's storage would play, and on its page: the storage holds only its lines, the computer has its video."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmVideoReady:
  message: "The video is on {computer} now."
  description: "Under “Subtitles only” once the computer has the film’s video, which the phone can download."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmDownloadVideo:
  message: "Download Video"
  description: "Button that downloads to the phone the video of a film it kept by its lines, once its computer has it."
filmVideoOnComputer:
  message: "Download Video on {computer}"
  description: "Button and option that have the computer download the video of a film it kept only the subtitles of."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmVideoAsked:
  message: "{computer} is downloading the video of “{title}”"
  description: "Toast once the computer took the phone’s asking to download a film’s video."
  placeholders:
    title: { type: "String", example: "Rust Talk" }
    computer: { type: "String", example: "Studio" }
filmsExportSubtitles:
  message: "Export subtitles"
  description: "In a film’s options: takes its subtitles from the computer as a file and shares it."
filmsRetranslate:
  message: "Translate again"
  description: "In a film’s options: has the computer translate every line of the film again."
filmsRetranslating:
  message: "Translating “{title}” again on {computer}"
  description: "Toast once the computer took the phone’s asking to translate a film again."
  placeholders:
    title: { type: "String", example: "Rust Talk" }
    computer: { type: "String", example: "Studio" }
filmsDeleteFromLibrary:
  message: "Delete from library"
  description: "In a film’s options: deletes it from the computer’s library."
filmsDeleteFromLibraryTitle:
  message: "Delete “{title}” from the library?"
  description: "Title of the alert that confirms deleting a film from the computer’s library."
  placeholders:
    title: { type: "String", example: "Rust Talk" }
filmsDeleteFromLibraryMessage:
  message: "Its files go to the Trash on {computer}."
  description: "Message of the alert that confirms deleting a film from the computer’s library."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmsDeletedFromLibrary:
  message: "Deleted “{title}” from {computer}"
  description: "Toast once the computer deleted a film from its library as the phone asked."
  placeholders:
    title: { type: "String", example: "Rust Talk" }
    computer: { type: "String", example: "Studio" }
jobsEmpty:
  message: "No jobs. Tap + to send a video's link."
  description: "Jobs page, under a computer's card when it has no jobs and no links wait for it."
jobsReadOnly:
  message: "{name} made this phone read-only: it shows the jobs but can't send links or change them. Turn off Read-only for this phone in the computer's Settings › Phone Sync."
  description: "Jobs page and Add sheet: the computer's user made this phone read-only; also why a link was refused."
  placeholders:
    name: { type: "String", example: "Studio" }
learnDueIn:
  message: "{count, plural, one {Next in # day} other {Next in # days}}"
  description: "Under a word or a line: when it is next due for review."
  placeholders:
    count: { type: "int", example: "3" }
learnDueNow:
  message: "Due"
  description: "Badge of a word or a line that is due for review now."
filmsUsed:
  message: "Films on this phone use {size}"
  description: "Under the Library's list: the space the films downloaded to the phone take."
  placeholders:
    size: { type: "String", example: "1.2 GB" }
filmsWatchedTo:
  message: "Watched to {time}"
  description: "Under a film: where it was left."
  placeholders:
    time: { type: "String", example: "1:40" }
filmsWorkEpisodes:
  message: "{count, plural, one {# episode} other {# episodes}}"
  description: "Under a work's name in the Library's list (a show, a course or a playlist its computer shows as one), after where it comes from: how many of its episodes the row holds."
  placeholders:
    count: { type: "int", example: "12" }
filmsWorkVideos:
  message: "{count, plural, one {# video} other {# videos}}"
  description: "Under a playlist's name in the Library's list, after the site: how many of its videos the row holds."
  placeholders:
    count: { type: "int", example: "12" }
filmsWorkLabel:
  message: "{name}, {count, plural, one {# episode} other {# episodes}}"
  description: "Spoken name of a work's row in the Library's list: the work's name and how many of its episodes the row holds."
  placeholders:
    name: { type: "String", example: "River Walk" }
    count: { type: "int", example: "12" }
filmsWorkUnwatched:
  message: "{count, plural, one {# episode not watched} other {# episodes not watched}}"
  description: "Spoken name of the number at the end of a work's row in the Library's list: how many of its episodes were not watched to their end."
  placeholders:
    count: { type: "int", example: "9" }
filmsWorkAllWatched:
  message: "All watched"
  description: "Spoken name of the check at the end of a work's row in the Library's list: every episode of it was watched to its end."
filmsWorkWatched:
  message: "{count, plural, one {# episode} other {# episodes}} · {watched} watched"
  description: "Under a work's name on its page: how many episodes it has on the phone's list and how many were watched to their end."
  placeholders:
    count: { type: "int", example: "12" }
    watched: { type: "int", example: "3" }
filmsWorkContinue:
  message: "Continue Episode {number}"
  description: "Button on a work's page: plays the episode the work goes on with, by its place in the work."
  placeholders:
    number: { type: "int", example: "4" }
filmsWorkStart:
  message: "Play Episode {number}"
  description: "Button on a work's page when none of its episodes was played yet: plays the first the phone lists, by its place in the work (mostly 1)."
  placeholders:
    number: { type: "int", example: "1" }
filmsWorkAgain:
  message: "Watch Again from Episode {number}"
  description: "Button on a work's page when every episode was watched: plays the first from its start, by its place in the work (mostly 1)."
