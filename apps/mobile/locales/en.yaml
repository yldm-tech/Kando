    name: { type: "String", example: "Studio" }
jobsRemedySignIn:
  message: "Sign in to {site} again in the browser on {name}, then come back and retry."
  description: "What to do about a sign-in to the named site that expired on the computer."
  placeholders:
    site: { type: "String", example: "Bilibili" }
    name: { type: "String", example: "Studio" }
jobsSignedInRetry:
  message: "Signed in again on computer — retry"
  description: "Button of a job that failed for a sign-in on the computer, once the user signed in again there."
jobsStepRunning:
  message: "{step}…"
  description: "A job's step while it runs, as Translate… (in Chinese 翻译中)."
  placeholders:
    step: { type: "String", example: "Translate" }
jobsThumbWaiting:
  message: "Waiting for computer"
  description: "Over a job's picture while its computer cannot be reached."
jobsViaStorage:
  message: "Via storage"
  description: "Jobs page, a computer's card: it answers through the user's storage, away from its network."
jobsStorageLapsed:
  message: "The links to your storage have expired. Connect to {name}'s network once to renew them."
  description: "Jobs page, a computer's card away from its network: the user's storage refused the phone's links because they are past their expiry; the computer hands new ones on its network."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsStorageKeys:
  message: "Your storage no longer accepts {name}'s key. Check Account & Upload on {name}, then connect to its network once."
  description: "Jobs page, a computer's card away from its network: the user's storage refused the links signed with the computer's storage key, which was changed or deleted. Account & Upload is the computer's settings section of that name."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsStorageDenied:
  message: "{name}'s key can't reach the bucket. Check Account & Upload on {name}, then connect to its network once."
  description: "Jobs page, a computer's card away from its network: the user's storage refused the computer's key access to the bucket. Account & Upload is the computer's settings section of that name."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsStorageNoBucket:
  message: "The bucket in your storage is gone. Check Account & Upload on {name}, then connect to its network once."
  description: "Jobs page, a computer's card away from its network: the bucket the computer set up for phones no longer exists. Account & Upload is the computer's settings section of that name."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsStorageFull:
  message: "Your storage is full. Free up space in it so links can reach {name}."
  description: "Jobs page, a computer's card away from its network: the user's storage takes nothing more."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsStorageUnreachable:
  message: "Couldn't connect to your storage. Check the network."
  description: "Jobs page, a computer's card away from its network: the phone could not connect to the user's storage, as with no network."
jobsStorageFailed:
  message: "Your storage didn't answer properly. The phone tries again shortly."
  description: "Jobs page, a computer's card away from its network: the user's storage answered with another error, as a server error."
jobsOlder:
  message: "Kando on this computer is too old to take links. Update it."
  description: "Jobs page: the computer speaks an older protocol."
jobsOnline:
  message: "Online"
  description: "Jobs page, a computer's card: it answers."
jobsOpen:
  message: "Open"
  description: "Button of a done job, and of the banner: opens the film's page."
jobsPause:
  message: "Pause"
  description: "Spoken name of a job's pause button."
jobsPaused:
  message: "Paused"
  description: "Where a job stands: paused."
jobsPercent:
  message: "{percent}%"
  description: "A step's progress."
  placeholders:
    percent: { type: "int", example: "42" }
jobsRemove:
  message: "Remove"
  description: "Button of a job that failed or was canceled, which takes it off the computer's queue as the × of its card there does; the download stays on the computer."
jobsRefused:
  message: "{name} didn't take it: {message}"
  description: "Why a link was refused, in the computer's own words."
  placeholders:
    name: { type: "String", example: "Studio" }
    message: { type: "String", example: "No job options" }
jobsRemedyDesktop:
  message: "Fix it in Kando on {name}, then try again."
  description: "What to do about a failure fixed on the computer."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsRemedyRetry:
  message: "This may pass by itself. Try again in a moment."
  description: "What to do about a failure that may go away."
jobsRemedySetup:
  message: "In Kando on {name}: {message}. Then try again."
  description: "What to do about a failure that needs a setting on the computer, in the computer's own words."
  placeholders:
    name: { type: "String", example: "Studio" }
    message: { type: "String", example: "Choose a speech model" }
jobsRemedyUpdate:
  message: "Let {name} update its downloader, then it retries automatically."
  description: "What to do about a downloader too old for the site."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsResume:
  message: "Resume"
  description: "Spoken name of a paused job's resume button."
jobsRunning:
  message: "Processing"
  description: "Where a job stands: running, before a step says how far."
jobsSent:
  message: "Sent to {name}; processing started"
  description: "Toast: the computer queued the link."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsSentExisting:
  message: "{name} has this video in its queue already"
  description: "Toast: the computer had a job for the link already."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsSentPending:
  message: "Sent. Start it in Kando on {name}."
  description: "Toast: the computer asks its user before it starts links from phones."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsStepDone:
  message: "Done"
  description: "A step's state: done."
jobsStepDownload:
  message: "Download"
  description: "Name of a job's first step."
jobsStepPercent:
  message: "{step} {percent}%"
  description: "Where a running job stands: its step and how far it has gone."
  placeholders:
    step: { type: "String", example: "Download" }
    percent: { type: "int", example: "42" }
jobsStepSkipped:
  message: "Skipped"
  description: "A step's state: the job does not need it."
jobsStepTranscribe:
  message: "Transcribe"
  description: "Name of a job's second step: speech recognition."
jobsStepTranslate:
  message: "Translate"
  description: "Name of a job's third step."
jobsTitle:
  message: "Jobs"
  description: "Title of the Jobs page, the computers' queues; the Library's button and the tablet's section that open it."
jobsUnpaired:
  message: "Pair a computer to send it links"
  description: "Jobs page while no computer is paired."
jobsUpdateRetry:
  message: "Update on computer and retry"
  description: "Button of a job that failed for a downloader too old for the site."
jobsWaiting:
  message: "Waiting"
  description: "Where a job or a step stands: waiting for its turn."
jobsWaitingFor:
  message: "Waiting for {name}"
  description: "Where a link or a job stands while its computer cannot be reached."
  placeholders:
    name: { type: "String", example: "Studio" }
jobsWaitingSuffix:
  message: "waiting for {name}"
  description: "Jobs page, the line under an unfinished job's title while its computer cannot be reached, after the site and a separator, as in \"YouTube · waiting for Studio\"."
  placeholders:
    name: { type: "String", example: "Studio" }
learnBackToFilm:
  message: "Back to film"
  description: "Button of a word's sheet, from the word list, that plays the film where the word was looked up."
learnConnect:
  message: "Connect"
  description: "Button of Learn's review card while no computer is paired and nothing is saved, which opens pairing."
learnDaysUnit:
  message: "{count, plural, one {day} other {days}}"
  description: "Learn's week: the unit after the streak's number."
  placeholders:
    count: { type: "int", example: 5 }
learnEmpty:
  message: "Tap a word in the subtitles while watching to add it here."
  description: "Learn's word list while it has no word."
learnExport:
  message: "Export and share"
  description: "Button of the export sheet that writes the file and opens the share sheet."
learnExportFailed:
  message: "Couldn't export the vocabulary"
  description: "Alert when the export could not be written."
learnExportShort:
  message: "Export"
  description: "Button beside the word list's heading that opens the export of the words and the saved lines."
learnFri:
  message: "Fri"
  description: "Short name of Friday under its bar in the week's chart."
learnGoalLeft:
  message: "Watch {count} more min to reach your goal"
  description: "Under the day's goal: how many minutes of films are left to reach it."
  placeholders:
    count: { type: "int", example: "8" }
learnGoalMet:
  message: "Today's goal is done"
  description: "Under the day's goal once it is reached."
learnGoalOf:
  message: "Goal of {count} minutes"
  description: "Spoken name of the day's goal's progress bar."
  placeholders:
    count: { type: "int", example: "20" }
learnGoalOfShort:
