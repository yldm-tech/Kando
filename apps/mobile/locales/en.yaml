    title: { type: "String", example: "Morning Talk" }
    name: { type: "String", example: "Studio" }
jobsCanceled:
  message: "Canceled"
  description: "Where a job stands: it was canceled."
jobsCanceledTitle:
  message: "Canceled on {name}"
  description: "A canceled job's box, over the button that starts it again."
