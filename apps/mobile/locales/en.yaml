  description: "Pill over the picture while a timed sleep timer runs."
  placeholders:
    time: { type: "String", example: "12:00" }
playerSleepPillLine:
  message: "Stops after this line"
  description: "Pill over the picture while the sleep timer is set to the end of the line."
playerSpeed:
  message: "Speed"
  description: "Spoken name of the player's menu of playback speeds."
playerStudyFailed:
  message: "The AI service on {computer} didn't answer. Try again."
