  description: "Review mode: the line is played and the learner types what they hear."
learnReviewDue:
  message: "{count, plural, one {Review # item} other {Review # items}}"
  description: "Title of Learn's review card: how many words and lines are due."
  placeholders:
    count: { type: "int", example: "6" }
learnReviewDueDetail:
  message: "Review with the original lines, about {count} min"
  description: "Under the review card's title: how long the review takes."
  placeholders:
    count: { type: "int", example: "3" }
learnReviewDueWords:
  message: "{count, plural, one {Review # word} other {Review # words}}"
  description: "Title of Learn's review card when only words are due."
  placeholders:
    count: { type: "int", example: 4 }
learnReviewMode:
  message: "Review mode"
  description: "Label beside Learn's choice of how the review goes: cards or dictation."
learnReviewNone:
  message: "No words due today"
  description: "Title of Learn's review card while nothing is due."
learnReviewNoneDetail:
  message: "Tap words in the subtitles while watching to add them to your word list"
  description: "Under the review card's title while nothing is due."
learnReviewStart:
  message: "Start"
  description: "Button of the review card that starts the review."
learnSat:
  message: "Sat"
  description: "Short name of Saturday under its bar in the week's chart."
learnSavedLines:
  message: "Saved lines"
  description: "Heading of Learn's saved lines, and the title of its page."
learnShowAll:
  message: "Show all {count}"
  description: "Row at the end of the word list or the saved lines that opens the whole list."
