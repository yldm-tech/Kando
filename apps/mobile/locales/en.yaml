  description: "Jobs page, a computer's card: how many jobs run or wait, and how many failed."
  placeholders:
    active: { type: "int", example: "2" }
    failed: { type: "int", example: "1" }
jobsAgoDays:
  message: "{count, plural, one {# day ago} other {# days ago}}"
  description: "Jobs page, a computer's card while it is offline: how long ago it last answered, in days."
