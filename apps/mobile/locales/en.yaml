appName:
  message: "Kando"
  description: "The app's name in this language, which the home screen and the system show."
commonCancel:
  message: "Cancel"
  description: "Button that closes a dialog or a step without doing anything."
commonRetry:
  message: "Try Again"
  description: "Row or button that asks the computer again after it could not be reached."
computersCertificate:
  message: "{name} answered with another certificate. Pair with it again."
  description: "In a computer's section: it answered with another certificate."
  placeholders:
    name: { type: "String", example: "Studio" }
computersOptions:
  message: "{name} Options"
  description: "Spoken name of the … button beside a computer's name, which offers to unpair it."
  placeholders:
    name: { type: "String", example: "Studio" }
computersPairAgain:
  message: "Pair Again"
  description: "Row under a computer that no longer takes this phone: opens pairing."
computersUnpair:
  message: "Unpair"
  description: "Action sheet button that confirms unpairing a computer."
computersUnpairMessage:
  message: "The films downloaded from it stay on this phone."
  description: "Message of the action sheet that confirms unpairing."
computersUnpairTitle:
  message: "Unpair {name}?"
  description: "Title of the alert that confirms unpairing a computer, by its name."
  placeholders:
    name: { type: "String", example: "Studio" }
computersUnpaired:
  message: "{name} no longer knows this phone"
  description: "In a computer's section and on a library's page: it revoked this phone."
  placeholders:
    name: { type: "String", example: "Studio" }
computersUnreachable:
  message: "Can't reach {name}"
  description: "In a computer's section and on a library's page: it does not answer."
  placeholders:
    name: { type: "String", example: "Studio" }
filmCancel:
  message: "Cancel Download"
  description: "Button on a film's page that stops its download and deletes what was downloaded."
filmDelete:
  message: "Delete Download"
  description: "Spoken name of the trash button in a downloaded film's header, which deletes it from the phone."
filmDeleteConfirm:
  message: "Delete"
  description: "The alert's button that confirms deleting a downloaded film."
filmDeleteTitle:
  message: "Delete “{title}” from this phone?"
  description: "Title of the alert that confirms deleting a downloaded film."
  placeholders:
    title: { type: "String", example: "Talk at the café" }
filmDownload:
  message: "Download"
  description: "Button on a film's page that downloads it to the phone, and the name of its progress bar."
filmDownloaded:
  message: "Downloaded"
  description: "Where a film stands: it is on the phone and plays offline."
filmDownloading:
  message: "Downloading {percent}%"
  description: "Where a film stands while it downloads, with how much of its video is done."
  placeholders:
    percent: { type: "int", example: "42" }
filmGone:
  message: "This film is no longer on the computer."
  description: "Why a download stopped: the computer no longer serves the film."
filmNoSpace:
  message: "There isn't enough space on this phone."
  description: "Why a download stopped: the phone's storage is full."
filmPause:
  message: "Pause"
  description: "Button on a film's page that pauses its download."
filmPaused:
  message: "Paused at {percent}%"
  description: "Where a film stands while its download is paused, with how much of its video is done."
  placeholders:
    percent: { type: "int", example: "42" }
filmPlay:
  message: "Play"
  description: "Button on a downloaded film's page that plays it."
filmResume:
  message: "Resume"
  description: "Button on a film's page that goes on with a paused or stopped download."
filmStopped:
  message: "The download stopped. Resume it when the computer can be reached."
  description: "Why a download stopped: the computer could not be reached."
filmUnpaired:
  message: "Pair with the computer again to download."
  description: "Why a download stopped: the computer no longer takes this phone, or answers with another certificate."
filmsAll:
  message: "All Films"
  description: "Heading of the Library's list of every film, from every computer and the phone."
filmsAllLibraries:
  message: "All Libraries"
  description: "In the Library's switcher: the films of every library of every computer."
filmsContinue:
  message: "Continue Watching"
  description: "Heading of the Library's row of films left partway, on this phone or another device."
filmsCount:
  message: "{count, plural, one {# film} other {# films}}"
  description: "Beside the Library's list heading: how many films it shows."
  placeholders:
    count: { type: "int", example: "12" }
filmsDetails:
  message: "Details"
  description: "In a film's options: opens the film's page."
filmsDownloadSize:
  message: "Download ({size})"
  description: "In a film's options: downloads it to the phone, with the size of its video."
  placeholders:
    size: { type: "String", example: "320.5 MB" }
filmsEmpty:
  message: "No films ready yet"
  description: "The Library's list when the computers have no film done processing."
filmsHit:
  message: "{time} · {line}"
  description: "Under a film a search found by its lines: where the line is in the film, and the line."
  placeholders:
    time: { type: "String", example: "1:40" }
    line: { type: "String", example: "The tide comes in twice a day." }
filmsLeft:
  message: "{time} left"
  description: "Under a film to go on with, left on this phone: how long it still plays."
  placeholders:
    time: { type: "String", example: "8:20" }
filmsLeftHere:
  message: "Left off on {device}"
  description: "Badge on the poster of a film to go on with, left on another device, by the device's name."
  placeholders:
    device: { type: "String", example: "MacBook Pro" }
filmsLeftOn:
  message: "Watched to {time} on {device}"
  description: "Under a film to go on with, left on another device: where, and on which device."
  placeholders:
    device: { type: "String", example: "MacBook Pro" }
    time: { type: "String", example: "1:40" }
filmsLibraries:
  message: "Show Library"
  description: "Title of the Library's switcher, which picks the library the list shows."
filmsLibrary:
  message: "Library: {name}"
  description: "Spoken name of the Library's switcher, with the library it shows."
  placeholders:
    name: { type: "String", example: "Japanese Class" }
filmsLibraryOn:
  message: "{library} on {computer}"
  description: "In the Library's switcher: a library, by its name and its computer's."
  placeholders:
    library: { type: "String", example: "Japanese Class" }
    computer: { type: "String", example: "Studio" }
filmsNoDesktop:
  message: "No Desktop App Yet?"
  description: "Button on the Library's card that opens the page where the desktop app is downloaded."
filmsNoResults:
  message: "Nothing found for “{query}”"
  description: "The Library's list when a search finds nothing."
  placeholders:
    query: { type: "String", example: "tide" }
filmsNoSource:
  message: "No films from this source yet"
  description: "The Library's list when the chosen source has no film."
filmsOptions:
  message: "{title} Options"
  description: "Spoken name of the … button beside a film in the Library."
  placeholders:
    title: { type: "String", example: "Morning Talk" }
filmsPair:
  message: "Connect a Computer"
  description: "Button on the Library's card that opens pairing with a computer."
filmsPlayFromStart:
  message: "Play from the Beginning"
  description: "In a film's options: plays it from its start rather than where it was left."
filmsResults:
  message: "Search Results"
  description: "Heading of the Library's list while a search is typed."
filmsSearch:
  message: "Search films and lines"
  description: "Placeholder and spoken name of the Library's search field, which finds titles and the lines of the films on the phone."
filmsSource:
  message: "Source"
  description: "Spoken name of the Library's chips, which narrow the list to where the films come from."
filmsSourceAll:
  message: "All"
  description: "Library chip: films from every source."
filmsSourceBilibili:
  message: "Bilibili"
  description: "Library chip and a film's source: films from Bilibili."
filmsSourceLocal:
  message: "Local Files"
  description: "Library chip and a film's source: films added from files on the computer."
filmsSourceWeb:
  message: "Other Sites"
  description: "Library chip and a film's source: films from sites other than YouTube and Bilibili."
filmsSourceYoutube:
  message: "YouTube"
  description: "Library chip and a film's source: films from YouTube."
filmsTitle:
  message: "Library"
  description: "Tab and title of the Library: the films on the phone and the computers' libraries."
filmsUnpairedBody:
  message: "Downloading, transcription and translation all happen in Kando on your computer. Once connected, its libraries show up here."
  description: "Body of the Library's card while no computer is paired."
filmsUnpairedTitle:
  message: "Not connected to a computer yet"
  description: "Title of the Library's card while no computer is paired."
filmsUsed:
  message: "Films on this phone use {size}"
  description: "Under the Library's list: the space the films downloaded to the phone take."
  placeholders:
    size: { type: "String", example: "1.2 GB" }
filmsWatchedTo:
  message: "Watched to {time}"
  description: "Under a film: where it was left."
  placeholders:
    time: { type: "String", example: "1:40" }
learnEmpty:
  message: "Words and lines you save will show here"
  description: "Learn tab while nothing is saved."
learnTitle:
  message: "Learn"
  description: "Tab and title of Learn: the saved words and lines and their review."
onboardingContinue:
  message: "Continue"
  description: "Button that goes to the introduction's next step."
onboardingIntroBody:
  message: "Paste a link and Kando on your computer downloads the video, recognizes the speech and translates it line by line. Your phone plays the films with both lines, and replays any line you didn't catch."
  description: "Body of the introduction's first step."
onboardingIntroTitle:
  message: "Watch the original, with subtitles in your language."
  description: "Title of the introduction's first step."
onboardingLanguagesBody:
  message: "Languages you don't pick are still recognized."
  description: "Under the title of the introduction's languages step."
onboardingLanguagesTitle:
  message: "Which languages do you watch?"
  description: "Title of the introduction's step that asks for the languages the user watches."
onboardingNoDesktop:
  message: "No desktop app yet? Download it from github.com/yldm-tech/Kando for macOS, Linux and Windows."
  description: "Link under the pairing form of the introduction, which opens the desktop app's page."
onboardingPairBody:
  message: "Kando on your computer does the downloading, recognition and translation; your phone is for watching and learning."
  description: "Body of the introduction's pairing step."
onboardingPairTitle:
  message: "Connect your computer"
  description: "Title of the introduction's pairing step."
onboardingPaired:
  message: "Connected to {name}"
  description: "On the introduction's last step once pairing worked, by the computer's name."
  placeholders:
    name: { type: "String", example: "Studio" }
onboardingSkip:
  message: "Skip"
  description: "Button at the top of the introduction that leaves it."
onboardingSkipPairing:
  message: "Skip for Now"
  description: "Button on the introduction's last step that leaves it without pairing."
onboardingStart:
  message: "Get Started"
  description: "Button that leaves the introduction once a computer is paired."
onboardingStep:
  message: "Step {step} of {count}"
  description: "Spoken name of the introduction's step dots."
  placeholders:
    step: { type: "int", example: "1" }
    count: { type: "int", example: "3" }
onboardingTarget:
  message: "Translate subtitles into"
  description: "Heading of the languages subtitles can be translated into, on the introduction's languages step."
pairAddress:
  message: "Address"
  description: "Label of the field for the computer's address (IP and port), as its Phone Sync settings show it."
pairAddressExample:
  message: "192.168.1.20:47123"
  description: "Example in the empty address field: an IP address and a port. Keep the digits."
pairCode:
  message: "Code"
  description: "Label of the field for the 6-digit pairing code the computer shows."
pairCompareTitle:
  message: "Does your computer show these letters?"
  description: "Heading over the computer certificate's fingerprint in short, which the user compares with the computer's."
pairConfirm:
  message: "Pair"
  description: "Button that pairs once the user has compared the fingerprint."
pairConnecting:
  message: "Connecting…"
  description: "Spoken name of the pairing page's button while the phone reaches the computer, which shows a spinner meanwhile."
pairContinue:
  message: "Continue"
  description: "Button under the address and code that reaches the computer."
pairErrAddress:
  message: "Enter the address as your computer shows it, such as 192.168.1.20:47123."
  description: "Error on the pairing page: the address is not an IP address with a port."
pairErrCodeExpired:
  message: "That code has expired. Show a new one on your computer."
  description: "Error on the pairing page: the code is past its 5 minutes or was tried wrongly too often."
pairErrCodeUsed:
  message: "That code was used already. Show a new one on your computer."
  description: "Error on the pairing page: a phone paired with this code already."
pairErrFailed:
  message: "Pairing didn't finish. Try again."
  description: "Error on the pairing page for any other failure."
pairErrFingerprint:
  message: "This computer's certificate isn't the one in the pairing link."
  description: "Error on the pairing page: a pasted kando://pair link names another certificate than the computer's."
pairErrNoCode:
  message: "Open Settings › Phone Sync on your computer: it takes a code only while that page is open."
  description: "Error on the pairing page: the computer offers no code because its Phone Sync settings are not open."
pairErrTooMany:
  message: "Too many tries. Wait a minute, then try again."
  description: "Error on the pairing page: the computer refuses pairings for a while after many."
pairErrUnreachable:
  message: "Can't reach a computer at {address}. Check that both are on the same network and Phone Sync is on."
  description: "Error on the pairing page: nothing answered at the address."
  placeholders:
    address: { type: "String", example: "192.168.1.20:47123" }
pairErrWrongCode:
  message: "That isn't the code your computer shows."
  description: "Error on the pairing page: the code is not the one on offer."
pairHint:
  message: "On your computer, open Kando's Settings › Phone Sync, then enter the address and code it shows."
  description: "At the top of the pairing page."
pairTitle:
  message: "Pair with a Computer"
  description: "Title of the pairing page."
playerBack:
  message: "Back"
  description: "Spoken name of the player's button that leaves it."
playerCantPlay:
  message: "This video can't play on this phone."
  description: "Over the player when the system's player cannot open the video, as one in a format the phone does not play."
playerKeepAwake:
  message: "Playing a film"
  description: "Why the app keeps the screen on while a film plays, where the system lists it."
playerLines:
  message: "Lines"
  description: "Spoken name of the player's list of the film's lines."
playerLoopLine:
  message: "Loop"
  description: "Spoken name of the player's button that plays the line playing over and over."
playerModeBilingual:
  message: "Bilingual"
  description: "Subtitle mode: the translation and the original."
playerModeOriginal:
  message: "Original Only"
  description: "Subtitle mode: the original line alone."
playerModeTranslation:
  message: "Translation Only"
  description: "Subtitle mode: the translation alone, the original where a line is not translated."
playerNextLine:
  message: "Next Line"
  description: "Spoken name of the player's button that plays from the next line."
playerNoLines:
  message: "This film has no subtitles."
  description: "In place of the line list for a film without subtitles."
playerPause:
  message: "Pause"
  description: "Spoken name of the player's button while the film plays."
playerPlay:
  message: "Play"
  description: "Spoken name of the player's button while the film is held."
playerPosition:
  message: "Position"
  description: "Spoken name of the player's slider of where the film is."
playerPrevLine:
  message: "Previous Line"
  description: "Spoken name of the player's button that plays from the line before."
playerSpeed:
  message: "Speed"
  description: "Spoken name of the player's menu of playback speeds."
playerSubtitles:
  message: "Subtitles"
  description: "Spoken name of the player's menu of subtitle modes."
sessionDownloading:
  message: "Downloading films"
  description: "Why the app keeps the screen on while films download, where the system lists it."
settingsAbout:
  message: "About"
  description: "Heading of Settings' section about the app."
settingsComputers:
  message: "Computers"
  description: "Heading of Settings' section of the paired computers."
settingsIntroduction:
  message: "Show the Introduction Again"
  description: "Row in Settings that shows the introduction again."
settingsNoComputer:
  message: "Not connected"
  description: "At the foot of a tablet's sidebar while no computer is paired."
settingsPair:
  message: "Connect a Computer"
  description: "Row in Settings that opens pairing, while no computer is paired."
settingsPairAnother:
  message: "Connect Another Computer"
  description: "Row in Settings that opens pairing with one more computer."
settingsSource:
  message: "Source Code"
  description: "Row in Settings that opens Kando's source code on GitHub."
settingsSubtitles:
  message: "Subtitles"
  description: "Heading of Settings' section of the subtitles."
settingsTarget:
  message: "Translate Into"
  description: "Row in Settings, and the title of its page, that picks the language subtitles are translated into."
settingsTargetNote:
  message: "Subtitles are translated into this language. For now the choice is kept on this phone; Kando on your computer still translates into the language set there."
  description: "Under the languages subtitles can be translated into."
settingsTitle:
  message: "Settings"
  description: "Tab and title of Settings."
