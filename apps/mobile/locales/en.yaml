learnLinePlay:
  message: "Play this line in the film"
  description: "Spoken name of the play button on a saved line's card."
learnMastered:
  message: "Mastered"
  description: "Under a word or a line known well enough."
learnMasteredCount:
  message: "Mastered {count}"
  description: "Under the week's bar of the words by how well they are known: the words mastered."
  placeholders:
    count: { type: "int", example: 2 }
learnMinutes:
  message: "{count} min"
  description: "Minutes of films played, today's or this week's."
  placeholders:
    count: { type: "int", example: "12" }
learnMinutesUnit:
  message: "min"
  description: "Learn's week: the unit after the study time when it is in minutes."
learnMon:
  message: "Mon"
  description: "Short name of Monday under its bar in the week's chart."
learnNewCount:
  message: "New {count}"
  description: "Under the week's bar of the words by how well they are known: the words not yet known once."
