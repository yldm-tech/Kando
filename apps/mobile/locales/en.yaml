    index: { type: "int", example: "1" }
    from: { type: "String", example: "0:00" }
    to: { type: "String", example: "0:45" }
playerPartsHint:
  message: "The film in equal parts. Tap one to play from it."
  description: "At the top of the player's Parts tab."
playerPause:
  message: "Pause"
  description: "Spoken name of the player's button while the film plays."
playerPlay:
  message: "Play"
  description: "Spoken name of the player's button while the film is held."
playerPosition:
  message: "Position"
  description: "Spoken name of the player's slider of where the film is."
playerPrevLine:
  message: "Previous Line"
  description: "Spoken name of the player's button that plays from the line before."
playerReplay:
  message: "Replay"
  description: "Action under the player's card: plays the line again from its start."
playerReplayLine:
  message: "Replay Line"
  description: "Button of the word card: plays the line the word was tapped in again."
playerSave:
  message: "Save"
  description: "Action under the player's card: saves the line to study."
playerSaved:
  message: "Saved"
  description: "The Save action once the line is saved; a tap takes it back."
playerSavedToast:
  message: "Line saved"
  description: "Toast once a line is saved."
playerSettings:
  message: "Playback Settings"
  description: "Title of the player's settings sheet, and spoken name of the … button that opens it."
playerSleep:
  message: "Sleep Timer"
  description: "Heading of the sleep timer's choices in the playback settings."
playerSleepFilm:
  message: "End of Film"
  description: "Sleep timer choice: holds the film at its end."
playerSleepLine:
  message: "End of Line"
  description: "Sleep timer choice: holds the film once the line playing ends."
playerSleepLineDone:
  message: "Sleep timer: paused after the line"
  description: "Toast once the sleep timer held the film at the end of a line."
playerSleepMinutes:
  message: "{minutes} min"
  description: "Sleep timer choice: holds the film after so many minutes."
  placeholders:
    minutes: { type: "int", example: "15" }
playerSleepOff:
  message: "Off"
  description: "Sleep timer choice: no timer."
playerSleepPaused:
  message: "Sleep timer: paused"
  description: "Toast once the sleep timer held the film after its minutes."
playerSleepPillFilm:
  message: "Stops after this film"
