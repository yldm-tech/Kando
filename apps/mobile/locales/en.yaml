learnThu:
  message: "Thu"
  description: "Short name of Thursday under its bar in the week's chart."
learnTitle:
  message: "Learn"
  description: "Tab and title of Learn: the saved words and lines and their review."
learnToday:
  message: "Today"
  description: "Over the minutes of films played today."
learnTodayShort:
  message: "Today"
  description: "Under today's bar in the week's chart, in place of its weekday."
learnTue:
  message: "Tue"
  description: "Short name of Tuesday under its bar in the week's chart."
learnVocabulary:
  message: "Word list"
  description: "Heading of Learn's list of the words saved, and the title of its page."
learnWed:
  message: "Wed"
  description: "Short name of Wednesday under its bar in the week's chart."
learnWeek:
  message: "This week"
  description: "Heading of the card of the last seven days on every device: the streak, the minutes and the new words, and the chart of each day's minutes."
learnWeekAll:
  message: "All devices"
  description: "Beside This Week on Learn: the week's figures add up every device's."
learnWeekBars:
  message: "{count} minutes of films in the last 7 days"
  description: "Spoken name of the week's chart."
  placeholders:
    count: { type: "int", example: "84" }
learnWordSay:
  message: "Say the word"
  description: "Spoken name of the speaker button on a word's sheet, which says the word aloud."
learnWordsDue:
  message: "{total} · {due} due"
  description: "Beside the word list's heading: how many words, and how many are due for review."
  placeholders:
    total: { type: "int", example: 6 }
    due: { type: "int", example: 4 }
learnWordsUnit:
  message: "{count, plural, one {word} other {words}}"
  description: "Learn's week: the unit after the number of new words."
  placeholders:
    count: { type: "int", example: 6 }
linesEmpty:
  message: "Lines you save while you watch show here"
  description: "Saved Lines while none is saved."
linesRemoveMessage:
  message: "It leaves your saved lines on every device."
  description: "Message of the alert that removes a saved line."
linesRemoveTitle:
  message: "Remove this line?"
  description: "Title of the alert that removes a saved line."
NSCameraUsageDescription:
  message: "Kando uses the camera to read the QR code your computer shows, to pair with it."
  description: "iOS: the reason the system shows as it asks to let the app use the camera (the Info.plist's NSCameraUsageDescription, which nsgo.yaml's apple.info gives in English); the pairing page takes a photo of the computer's pairing QR code."
NSLocalNetworkUsageDescription:
  message: "Kando connects to Kando on your computer, and to the NAS and servers you add, over your local network to list and download your films."
  description: "iOS: the reason the system shows as it asks to let the app reach devices on the local network (the Info.plist's NSLocalNetworkUsageDescription, which nsgo.yaml's apple.info gives in English); the app reaches the computers it is paired with that way, and the NAS shares and servers added in Settings › NAS & Servers."
onboardingAddBody:
  message: "Kando only reads from it, and keeps its password in your phone's secure store."
  description: "Body of the introduction's step that adds a NAS or cloud drive, above its form."
onboardingAddTitle:
  message: "Add your NAS or cloud drive"
  description: "Title of the introduction's step that adds a NAS or cloud drive."
onboardingAdded:
  message: "Added {name}"
  description: "On the introduction's step that adds a NAS or cloud drive once it was saved, by the name the user gave it."
  placeholders:
    name: { type: "String", example: "Home NAS" }
onboardingBack:
  message: "Back"
  description: "Spoken name of the round button at the top of the introduction that goes to the step before."
onboardingContinue:
  message: "Continue"
  description: "Button that goes to the introduction's next step."
onboardingCue1:
  message: "每条河都始于高山上的一股细流。"
  description: "Sample subtitle over the introduction's picture: the translation of the English line 'Every river begins as a trickle high in the mountains.', which shows under it. Translate it into this language; English keeps the Simplified Chinese, as the introduction shows English as the original."
onboardingCue2:
  message: "水往低处流，沿途裹挟起泥沙和石块。"
  description: "Sample subtitle over the introduction's picture: the translation of 'As water flows downhill, it picks up sand and stones.' English keeps the Simplified Chinese (see onboardingCue1)."
onboardingCue3:
  message: "这些颗粒就像砂纸一样打磨着河床。"
  description: "Sample subtitle over the introduction's picture: the translation of 'Those particles act like sandpaper on the riverbed.' English keeps the Simplified Chinese (see onboardingCue1)."
onboardingCue4:
  message: "数千年间，河道被切割得越来越深。"
  description: "Sample subtitle over the introduction's picture: the translation of 'Over thousands of years, the channel cuts deeper.' English keeps the Simplified Chinese (see onboardingCue1)."
onboardingCue5:
  message: "陡峭的 V 形谷就是这样形成的。"
  description: "Sample subtitle over the introduction's picture: the translation of 'That is how steep V-shaped valleys are formed.' English keeps the Simplified Chinese (see onboardingCue1)."
onboardingCue6:
  message: "到了下游，地势变缓，河流也慢了下来。"
  description: "Sample subtitle over the introduction's picture: the translation of 'Lower down, the land flattens and the river slows.' English keeps the Simplified Chinese (see onboardingCue1)."
onboardingCue7:
  message: "它不再向下切割，而是开始左右摆动。"
  description: "Sample subtitle over the introduction's picture: the translation of 'Instead of cutting down, it starts to swing sideways.' English keeps the Simplified Chinese (see onboardingCue1)."
onboardingCue8:
  message: "这些大幅度的弯道被称为河曲。"
  description: "Sample subtitle over the introduction's picture: the translation of 'These sweeping curves are called meanders.' English keeps the Simplified Chinese (see onboardingCue1)."
onboardingIntroBody:
  message: "Paste a link and Kando downloads the video, recognizes the speech and translates it line by line. Tap any word in the subtitles to look it up, and replay any line you didn’t catch."
  description: "Body of the introduction's first step."
onboardingIntroTitle:
  message: "Watch the original, with subtitles in your language."
  description: "Title of the introduction's first step."
onboardingLanguageDe:
  message: "German"
  description: "Name of the language under its own name (Deutsch), on the introduction's languages step."
onboardingLanguageEn:
  message: "English"
  description: "Name of the language under its own name (English), on the introduction's languages step."
onboardingLanguageEs:
  message: "Spanish"
  description: "Name of the language under its own name (Español), on the introduction's languages step."
onboardingLanguageFr:
  message: "French"
  description: "Name of the language under its own name (Français), on the introduction's languages step."
onboardingLanguageJa:
  message: "Japanese"
  description: "Name of the language under its own name (日本語), on the introduction's languages step."
onboardingLanguageKo:
  message: "Korean"
  description: "Name of the language under its own name (한국어), on the introduction's languages step."
