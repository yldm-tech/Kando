  placeholders:
    computer: { type: "String", example: "MacBook Pro" }
filmsUnlockPassword:
  message: "Password"
  description: "Label and placeholder of the password field in the library unlock sheet."
filmsUnlockCancel:
  message: "Cancel"
  description: "Cancel button in the library unlock sheet."
filmsUnlockConfirm:
  message: "Unlock"
  description: "Confirm button in the library unlock sheet."
filmsUnlockWrong:
  message: "Wrong password. Try again."
  description: "Error shown in the library unlock sheet when the password is wrong."
filmsUnlockTooMany:
  message: "Too many wrong passwords. Try again in a minute."
