  placeholders:
    computer: { type: "String", example: "Studio" }
playerStudyNoAI:
  message: "Set up an AI service in Kando's settings on {computer} to look words up and explain lines."
  description: "In the word card or the explanation when the computer has no AI service."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerStudyUnpaired:
  message: "This film's computer is no longer paired with this phone."
  description: "In the word card or the explanation when the film's computer is not paired any more."
playerStudyUnreachable:
  message: "Can't reach {computer}. Words are looked up on it, so be on the same network."
  description: "In the word card or the explanation when the computer cannot be reached."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerSubtitles:
  message: "Subtitles"
  description: "Spoken name of the player's menu of subtitle modes."
playerTabInfo:
  message: "Info"
  description: "Tab of the player's panel: what the film is."
playerTabLines:
  message: "Lines"
  description: "Tab of the player's panel: the film's lines."
playerTabNotes:
  message: "Notes"
  description: "Tab of the player's panel: the lines saved and their notes, while none is saved."
playerTabNotesCount:
  message: "Notes {count}"
  description: "Tab of the player's panel with how many of the film's lines are saved."
  placeholders:
    count: { type: "int", example: "3" }
playerTabParts:
  message: "Parts"
  description: "Tab of the player's panel: the film in equal parts."
playerUnsavedToast:
  message: "Line removed from saved"
  description: "Toast once a saved line is taken back."
playerWordInLine:
  message: "In this line"
  description: "Heading over the line a word was tapped in, in the word card."
sessionDownloading:
  message: "Downloading films"
  description: "Why the app keeps the screen on while films download, where the system lists it."
settingsAbout:
  message: "About"
  description: "Heading of Settings' section about the app."
settingsComputers:
  message: "Computers"
  description: "Heading of Settings' section of the paired computers."
settingsIntroduction:
  message: "Show the Introduction Again"
  description: "Row in Settings that shows the introduction again."
settingsNoComputer:
  message: "Not connected"
  description: "At the foot of a tablet's sidebar while no computer is paired."
settingsPair:
  message: "Connect a Computer"
  description: "Row in Settings that opens pairing, while no computer is paired."
settingsPairAnother:
  message: "Connect Another Computer"
  description: "Row in Settings that opens pairing with one more computer."
settingsSource:
  message: "Source Code"
  description: "Row in Settings that opens Kando's source code on GitHub."
settingsSubtitles:
  message: "Subtitles"
  description: "Heading of Settings' section of the subtitles."
settingsTarget:
  message: "Translate Into"
  description: "Row in Settings, and the title of its page, that picks the language subtitles are translated into."
settingsTargetNote:
  message: "Subtitles are translated into this language. For now the choice is kept on this phone; Kando on your computer still translates into the language set there."
  description: "Under the languages subtitles can be translated into."
settingsTitle:
  message: "Settings"
  description: "Tab and title of Settings."
