addAsComputer:
  message: "As on {name}"
  description: "Add sheet: the choice that leaves the quality, or where the original subtitles come from, to the computer's own setting."
  placeholders:
    name: { type: "String", example: "Studio" }
addChannel:
  message: "Channel"
  description: "Add sheet: the chip in the link field for a link to a channel or a playlist, which becomes a subscription."
addComputer:
  message: "Send To"
  description: "Add sheet: label over the computers to send the link to, when several are paired."
addLinkLabel:
  message: "Link to a video, channel or playlist"
  description: "Add sheet: label of the field for the video's link."
addLinkPlaceholder:
  message: "Paste a YouTube, Bilibili or other link"
  description: "Add sheet: placeholder of the link field."
addNoLinks:
  message: "{name} doesn't take links."
  description: "Add sheet: under the form when the chosen computer answers but does not take links from phones."
  placeholders:
    name: { type: "String", example: "Studio" }
addNotALink:
  message: "This isn't a link to a video on the web."
  description: "Add sheet: what is in the field is not a web link."
addNote:
  message: "The link goes to {name}, which downloads, transcribes and translates it, then syncs it back to your phone. Channel or playlist links become subscriptions."
  description: "Add sheet: under the form, what the computer does with the link."
  placeholders:
    name: { type: "String", example: "Studio" }
addNoteOffline:
  message: "{name} is offline. The link waits on this phone and goes once it's back."
  description: "Add sheet: under the form while the computer cannot be reached."
  placeholders:
    name: { type: "String", example: "Studio" }
addNoteOfflineRelay:
  message: "{name} is offline. The link waits in your storage and starts once it's back."
  description: "Add sheet: under the form while the computer is reached through the user's storage away from its network, but has not written there lately."
  placeholders:
    name: { type: "String", example: "Studio" }
addNoteRelay:
  message: "Away from its network, the link goes through your storage. {name} takes it within a minute or two."
  description: "Add sheet: under the form while the computer is reached through the user's storage away from its network."
  placeholders:
    name: { type: "String", example: "Studio" }
addPaste:
  message: "Paste"
  description: "Add sheet: button that puts the clipboard's link in the field."
addSharedFile:
  message: "Kando takes links to videos. Share the video's link instead."
  description: "Toast when another app shares only a file, such as a picture or a video file, to the app, which takes links alone."
addQuality:
  message: "Save"
  description: "Add sheet: label over the choices of the picture the computer downloads."
addQuality720:
  message: "720P"
  description: "Add sheet: the computer downloads the best picture no taller than 720 lines."
addQualityBest:
  message: "Best quality"
  description: "Add sheet: the computer downloads the best picture the site has."
addSend:
  message: "Send"
  description: "Add sheet: button that sends the link to the computer."
addSubscribeNote:
  message: "{name} follows this list and adds its new videos as they come."
  description: "Add sheet: under the form, for a channel or playlist link, what the computer does with it."
  placeholders:
    name: { type: "String", example: "Studio" }
addSubscribeOffline:
  message: "{name} is offline. Subscribe once it's back."
  description: "Add sheet: for a channel or playlist link while the computer cannot be reached; subscribing needs it to answer."
  placeholders:
    name: { type: "String", example: "Studio" }
addSubscribeReadOnly:
  message: "{name} lets this phone look but not subscribe."
  description: "Add sheet: for a channel or playlist link, when the computer made this phone read-only."
  placeholders:
    name: { type: "String", example: "Studio" }
addSubscribed:
  message: "{name} subscribed to “{title}”"
  description: "Toast: the computer subscribed to the channel or playlist the phone sent."
  placeholders:
    title: { type: "String", example: "Earth Science" }
    name: { type: "String", example: "Studio" }
addSubscribedExisting:
  message: "{name} already follows “{title}”"
  description: "Toast: the computer was subscribed to the list the phone sent already."
  placeholders:
    title: { type: "String", example: "Earth Science" }
    name: { type: "String", example: "Studio" }
addSubtitles:
  message: "Original Subtitles"
  description: "Add sheet: label over the choices of where the video's original lines come from."
addSubtitlesPlatform:
  message: "Use the uploader's subtitles"
  description: "Add sheet: the original lines are the subtitles the uploader put on the site, where they match the speech."
addSubtitlesPlatformNote:
  message: "Most accurate when human-made; translated directly"
  description: "Add sheet: under The Uploader's Subtitles."
addSubtitlesRecognize:
  message: "Recognize on computer"
  description: "Add sheet: the original lines are what the computer's speech recognition hears."
addSubtitlesRecognizeNote:
  message: "Whisper on {name} transcribes the audio"
  description: "Add sheet: under Recognized on the Computer."
  placeholders:
    name: { type: "String", example: "Studio" }
addTitle:
  message: "Add Video"
  description: "Title of the Add sheet, and the spoken name of the + button that opens it."
appName:
  message: "Kando"
  description: "The app's name in this language, which the home screen and the system show."
commonCancel:
  message: "Cancel"
  description: "Button that closes a dialog or a step without doing anything."
commonOK:
  message: "OK"
  description: "Button that closes an alert."
commonRetry:
  message: "Try Again"
  description: "Row or button that asks the computer again after it could not be reached."
computerConnection:
  message: "Connection"
  description: "Row on the Processing Computer page saying how the phone reaches the computer."
computerConnectionDirect:
  message: "Same Wi-Fi · direct, live progress"
  description: "Value of the Connection row while the phone reaches the computer on its network."
computerConnectionNote:
  message: "On the same network the phone talks to the computer directly; when apart, links and progress go through your own storage and sync every few seconds to minutes."
  description: "Under the Connection row on the Processing Computer page."
computerConnectionOffline:
  message: "Offline · links wait on this device"
  description: "Value of the Connection row while the computer can't be reached."
computerConnectionRelay:
  message: "Through your storage · every minute or two"
  description: "Value of the Connection row while the phone follows the computer through the user's storage, away from its network."
computerContext:
  message: "Use Context When Translating"
  description: "Switch on a computer's page: whether its translation sends the lines before each batch to the AI service."
computerContextDetail:
  message: "Lets the model see the previous lines, for smoother translations."
  description: "Detail under the Use Context When Translating switch."
computerContextFailed:
  message: "Couldn't Change the Setting on {computer}"
  description: "Title of the alert when the computer could not be reached to change its context switch."
  placeholders:
    computer: { type: "String", example: "Studio" }
computerContextFailedMessage:
  message: "Make sure the computer is on and Phone Sync is on, then try again."
  description: "Message of the alert when the computer could not be reached to change a setting."
computerNote:
  message: "Downloading, transcription and translation all happen in Kando on your computer. The phone just sends links, plays and helps you learn — no models to download, no battery drain."
  description: "Note under the computer's card on the Processing Computer page."
computerOffline:
  message: "Offline"
  description: "Under a computer's name in the Send New Links To list, and on its card, while it can't be reached."
computerOnComputer:
  message: "Settings on the Computer"
  description: "Heading on the Processing Computer page over the settings the computer keeps."
computerOnline:
  message: "Online"
  description: "Under a computer's name in the Send New Links To list while it answers."
computerReadOnly:
  message: "This device can only view this computer's settings."
  description: "Note on a computer's page when the computer made this device read-only."
computerSendTo:
  message: "Send New Links To"
  description: "Heading on the Processing Computer page over the paired computers, to pick the one new links go to."
computerService:
  message: "Translation Service"
  description: "Row on a computer's page naming the AI service the computer translates and explains with."
computerServiceNone:
  message: "Not Set Up"
  description: "Value of the Translation Service row when the computer has no AI service set up."
computerServiceNote:
  message: "The computer keeps its AI service and key. Change them in Kando on the computer."
  description: "Note under a computer's translation settings: the AI service can only be changed on the computer."
computerStatusOnline:
  message: "{count, plural, =0 {Online} one {Online · processing # video} other {Online · processing # videos}}"
  description: "On the computer's card on the Processing Computer page while it answers: how many videos it is processing."
  placeholders:
    count: { type: "int", example: "6" }
computerStorage:
  message: "Storage Status"
  description: "Row on the Processing Computer page: whether the user's storage serves the phone."
computerStorageDenied:
  message: "No Access to Bucket"
  description: "Value of Storage Status: the storage refused the computer's key access to the bucket."
computerStorageFull:
  message: "Full"
  description: "Value of Storage Status: the storage takes nothing more."
computerStorageKeys:
  message: "Key No Longer Valid"
  description: "Value of Storage Status: the storage refused the phone's links, as its key changed or they lapsed."
computerStorageNoBucket:
  message: "Bucket Gone"
  description: "Value of Storage Status: the bucket the computer set up for phones no longer exists."
computerStorageNote:
  message: "Videos and subtitles processed on the computer are uploaded to your own storage, and the phone reads them from there when it's away from the computer's network."
  description: "Note under the Sync group on the Processing Computer page."
computerStorageOK:
  message: "OK"
  description: "Value of Storage Status: the storage serves the phone."
computerStorageUnreachable:
  message: "Can't Connect"
  description: "Value of Storage Status: the phone could not connect to the storage, or it failed."
computerSynced:
  message: "Synced"
  description: "Row on the Processing Computer page: how many films the computer lists."
computerSyncedCount:
  message: "{count, plural, one {# film} other {# films}}"
  description: "Value of the Synced row."
  placeholders:
    count: { type: "int", example: "7" }
computerTooOld:
  message: "Update Kando on this computer to see and change its translation settings here."
  description: "Note on a computer's page when the computer's Kando is too old to share its AI service and context switch."
computerUnknown:
  message: "Shown once this device reaches the computer."
  description: "Note on a computer's page before a sync reached it, so its settings are not known yet."
computersCertificate:
  message: "{name} answered with another certificate. Pair with it again."
  description: "In a computer's section: it answered with another certificate."
  placeholders:
    name: { type: "String", example: "Studio" }
computersPairAgain:
  message: "Pair Again"
  description: "Row under a computer that no longer takes this phone: opens pairing."
computersUnpair:
  message: "Unpair"
  description: "Action sheet button that confirms unpairing a computer."
computersUnpairMessage:
  message: "The films downloaded from it stay on this phone."
  description: "Message of the action sheet that confirms unpairing."
computersUnpairTitle:
  message: "Unpair {name}?"
  description: "Title of the alert that confirms unpairing a computer, by its name."
  placeholders:
    name: { type: "String", example: "Studio" }
computersUnpaired:
  message: "{name} no longer knows this phone"
  description: "In a computer's section and on a library's page: it revoked this phone."
  placeholders:
    name: { type: "String", example: "Studio" }
computersUnreachable:
  message: "Can't reach {name}"
  description: "In a computer's section and on a library's page: it does not answer."
  placeholders:
    name: { type: "String", example: "Studio" }
dictationCantPlay:
  message: "This line can't be played on this device."
  description: "Under the dictation card's heading when the film's sound could not be played."
dictationCheck:
  message: "Check"
  description: "Button of the review that checks what the learner typed in a dictation."
dictationHint:
  message: "Listen as many times as you like, then type what you hear"
  description: "Under the dictation card's heading."
dictationLabel:
  message: "What you heard"
  description: "Accessibility label of the dictation card's text box."
dictationNoFilm:
  message: "Save this film to this device to hear its lines."
  description: "Under a review card in dictation mode when the film is not kept on the phone, so the line cannot be played."
dictationPlaceholder:
  message: "Type what you heard here"
  description: "Placeholder of the dictation card's text box."
dictationPlay:
  message: "Play the line"
  description: "Accessibility label of the dictation card's play button."
dictationScore:
  message: "{total, plural, one {Heard {hit} / # word correctly} other {Heard {hit} / # words correctly}}"
  description: "Dictation card after the check: how many of the line's words the learner typed."
  placeholders:
    hit: { type: "int", example: 3 }
    total: { type: "int", example: 5 }
dictationStop:
  message: "Stop"
  description: "Accessibility label of the dictation card's play button while the line plays."
dictationTitle:
  message: "Dictate this line"
  description: "Heading of the dictation card in the review."
exportAnki:
  message: "Anki"
  description: "Export page: the format of notes Anki's File › Import reads."
exportAnkiDetail:
  message: "Notes for Anki's File › Import: the word on the front, the rest on the back"
  description: "Export page: what the Anki format writes."
exportCSV:
  message: "CSV spreadsheet"
  description: "Export page: a CSV table, which spreadsheets open."
exportCSVDetail:
  message: "One word per row; opens in spreadsheet apps and Notion"
  description: "Export page: what the CSV format writes."
exportCount:
  message: "{words, plural, one {# word} other {# words}} · {lines, plural, one {# saved line} other {# saved lines}} · from all devices"
  description: "Export page: what the export writes, counted."
  placeholders:
    words: { type: "int", example: 12 }
    lines: { type: "int", example: 3 }
exportFormat:
  message: "Format"
  description: "Export page: heading of the formats."
exportShareNote:
  message: "The share sheet opens once the file is ready: save it to your files, or open it in another app such as Anki."
  description: "Under the export's button."
exportTSV:
  message: "Plain text (tab-separated)"
  description: "Export page: plain text with a tab between the fields."
exportTSVDetail:
  message: "Imports into Quizlet and most flashcard apps"
  description: "Export page: what the plain text format is for."
exportTitle:
  message: "Export word list"
  description: "Spoken name of the sheet that exports the word list, and the saved lines when asked, through the share sheet."
exportWithLines:
  message: "Include saved lines"
  description: "Export page: switch that adds the saved lines after the words."
exportWithSentence:
  message: "Include original line"
  description: "Export page: switch that writes with each word the line it was looked up in."
exportWithTranslation:
  message: "Include translation"
  description: "Export page: switch that writes with each word the translation of the line it was looked up in."
filmCancel:
  message: "Cancel Download"
  description: "Row in the Offline group of a film's page that stops its download and deletes what was downloaded."
filmDelete:
  message: "Delete offline files from this device"
  description: "Label of the row in the Offline group of a downloaded film's page, and of the row in the Library's film options sheet: deletes the film's files from the phone after asking, keeping it in the computer's library; the page's row shows the space it frees at its end."
filmDeleteConfirm:
  message: "Delete"
  description: "The alert's button that confirms deleting a downloaded film."
filmDeleteTitle:
  message: "Delete “{title}” from this phone?"
  description: "Title of the alert that confirms deleting a downloaded film."
  placeholders:
    title: { type: "String", example: "Talk at the café" }
filmDownload:
  message: "Save for offline"
  description: "Button on a film's page that downloads it to the phone to watch offline, and the name of its progress bar."
filmDownloaded:
  message: "Saved on this device"
  description: "Where a film stands: it is on the phone and plays offline."
filmDownloading:
  message: "Downloading {percent}%"
  description: "Where a film stands while it downloads, with how much of its video is done."
  placeholders:
    percent: { type: "int", example: "42" }
filmGone:
  message: "This film is no longer on the computer."
  description: "Why a download stopped: the computer no longer serves the film."
filmInfo:
  message: "Info"
  description: "Header of the group of a film's facts on its page (source, languages, length, size, library), as the player's Info tab."
filmInfoLanguages:
  message: "Languages"
  description: "Film page, Info group: the row of the film's spoken language and the language it is translated into, as 日本語 → 简体中文."
filmInfoLength:
  message: "Length"
  description: "Film page, Info group: the row of how long the film plays."
filmInfoLibrary:
  message: "Library"
  description: "Film page, Info group: the row of the library on the computer the film is in."
filmInfoSize:
  message: "Size"
  description: "Film page, Info group: the row of how much space the film's video takes."
filmInfoSource:
  message: "Source"
  description: "Film page, Info group: the row of the site the film came from (YouTube, Bilibili, another site, a file on the computer)."
filmNoSpace:
  message: "There isn't enough space on this phone."
  description: "Why a download stopped: the phone's storage is full."
filmOffline:
  message: "Offline"
  description: "Header of the group on a film's page about what the phone keeps of it to watch offline: where its download stands, and the row that cancels it or deletes it from the phone."
filmPause:
  message: "Pause"
  description: "Button on a film's page that pauses its download."
filmPaused:
  message: "Paused at {percent}%"
  description: "Where a film stands while its download is paused, with how much of its video is done."
  placeholders:
    percent: { type: "int", example: "42" }
filmPlay:
  message: "Play"
  description: "Button on a downloaded film's page that plays it."
filmLines:
  message: "Read the Lines"
  description: "Button on the page of a film whose video is not in the user's storage, away from the computer: it opens the film's lines alone."
filmStorageFailed:
  message: "Couldn't read it from your storage. Try again in a moment."
  description: "Shown on a film's page when its lines could not be read from the user's storage, away from the computer."
filmStreamFailed:
  message: "Couldn't reach {computer}. Try again in a moment."
  description: "Shown on a film's page when streaming it from the computer failed to load its lines."
  placeholders:
    computer: { type: "String", example: "Studio" }
filmResume:
  message: "Resume"
  description: "Button on a film's page that goes on with a paused or stopped download."
filmStopped:
  message: "The download stopped. Resume it when the computer can be reached."
  description: "Why a download stopped: the computer could not be reached."
filmUnpaired:
  message: "Pair with the computer again to download."
  description: "Why a download stopped: the computer no longer takes this phone, or answers with another certificate."
filmsAboutSize:
  message: "About {size}"
  description: "Film options sheet: the value at the end of an option, about how much space the film takes, as About 120 MB."
  placeholders:
    size: { type: "String", example: "120 MB" }
filmsAll:
  message: "All films"
  description: "Heading of the Library's list of every film, from every computer and the phone."
filmsAllLibraries:
  message: "All libraries"
  description: "In the Library's switcher: the films of every library of every computer."
filmsContinue:
  message: "Continue watching"
  description: "Heading of the Library's row of films left partway, on this phone or another device."
filmsCount:
  message: "{count, plural, one {# film} other {# films}}"
  description: "Beside the Library's list heading: how many films it shows."
  placeholders:
    count: { type: "int", example: "12" }
filmsEmpty:
  message: "No films ready yet"
  description: "The Library's list when the computers have no film done processing."
filmsHit:
  message: "{time} · {line}"
  description: "Under a film a search found by its lines: where the line is in the film, and the line."
  placeholders:
    time: { type: "String", example: "1:40" }
    line: { type: "String", example: "The tide comes in twice a day." }
filmsJobsCardFailed:
  message: "{count, plural, one {# job needs attention} other {# jobs need attention}}"
  description: "Library jobs card title when no job is under way and some failed: how many need the user."
  placeholders:
    count: { type: "int", example: "1" }
filmsJobsCardNeedsYou:
  message: "{count, plural, one {# needs attention} other {# need attention}}"
  description: "Library jobs card: small orange pill, how many failed jobs need the user."
  placeholders:
    count: { type: "int", example: "1" }
filmsJobsCardOffline:
  message: "{computer} is offline · {count} waiting"
  description: "Library jobs card title while the computer is out of reach: its name and how many jobs wait for it."
  placeholders:
    computer: { type: "String", example: "MacBook Pro" }
    count: { type: "int", example: "6" }
filmsJobsCardTitle:
  message: "{computer} is processing {count, plural, one {# video} other {# videos}}"
  description: "Library jobs card title: the computer and how many videos it is downloading, transcribing or translating."
  placeholders:
    computer: { type: "String", example: "MacBook Pro" }
    count: { type: "int", example: "6" }
filmsJobsCardTitleAll:
  message: "Processing {count, plural, one {# video} other {# videos}}"
  description: "Library jobs card title when more than one computer has jobs: how many videos they process."
  placeholders:
    count: { type: "int", example: "6" }
filmsJobsTile:
  message: "Processing {count}"
  description: "Tablet Library: the fourth stats tile, how many jobs are under way."
  placeholders:
    count: { type: "int", example: "6" }
filmsJobsTileNeeds:
  message: "Processing {active} · {failed} need attention"
  description: "Tablet Library: the fourth stats tile, how many jobs are under way and how many failed and need the user."
  placeholders:
    active: { type: "int", example: "6" }
    failed: { type: "int", example: "1" }
filmsJobsTileOn:
  message: "On {computer}"
  description: "Tablet Library: under the fourth stats tile title, the computer processing the jobs."
  placeholders:
    computer: { type: "String", example: "MacBook Pro" }
filmsLeft:
  message: "{time} left"
  description: "Under a film to go on with, left on this phone: how long it still plays."
  placeholders:
    time: { type: "String", example: "8:20" }
filmsLeftHere:
  message: "{device} — stopped here"
  description: "Badge on the poster of a film to go on with, left on another device, by the device's name."
  placeholders:
    device: { type: "String", example: "MacBook Pro" }
filmsLeftOn:
  message: "Watched to {time} on {device}"
  description: "Under a film to go on with, left on another device: where, and on which device."
  placeholders:
    device: { type: "String", example: "MacBook Pro" }
    time: { type: "String", example: "1:40" }
filmsLibraries:
  message: "Library"
  description: "Title of the Library's switcher, which picks the library the list shows."
filmsLibrariesNote:
  message: "A library is just a .kando folder, so you can keep separate ones for different purposes."
  description: "Library switcher sheet: note under its title on what a library is."
filmsLibrary:
  message: "Library: {name}"
  description: "Spoken name of the Library's switcher, with the library it shows."
  placeholders:
    name: { type: "String", example: "Japanese Class" }
filmsLibraryLocked:
  message: "Locked"
  description: "Library switcher sheet: subtitle tag on a password-protected library that is currently locked."
filmsLibraryLockAction:
  message: "Lock {name}"
  description: "Spoken name of the lock button on an unlocked password-protected library row."
  placeholders:
    name: { type: "String", example: "Private" }
filmsUnlockTitle:
  message: "Unlock {name}"
  description: "Title of the password sheet that unlocks a password-protected library on the computer for this device."
  placeholders:
    name: { type: "String", example: "Private" }
filmsUnlockNote:
  message: "Enter the library password to view it on this device. {computer} stays locked."
