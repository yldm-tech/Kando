onboardingWayBody:
  message: "You can add either one later in Settings."
  description: "Line under 'Where are your films?' on the introduction's step that asks how the phone gets films."
onboardingWayBoth:
  message: "Both"
  description: "Title of the third choice on the introduction's 'Where are your films?' step: Kando on a computer and a NAS or cloud drive."
onboardingWayBothLine:
  message: "Subtitled films from your computer, everything else straight from your NAS."
  description: "Line under 'Both' on the introduction's 'Where are your films?' step."
onboardingWayComputer:
  message: "Kando on your computer"
  description: "Title of the first choice on the introduction's 'Where are your films?' step: the desktop app, which the phone pairs with."
onboardingWayComputerLine:
  message: "Makes the subtitles your phone plays and studies, away from home too once it syncs through your storage."
  description: "Line under 'Kando on your computer' on the introduction's 'Where are your films?' step. 'Syncs through your storage' is the desktop app's switch in Settings › Phone Sync (settingsPhoneRelay there); use its translation."
onboardingWayNAS:
  message: "NAS or cloud drive"
  description: "Title of the second choice on the introduction's 'Where are your films?' step: a NAS or a cloud drive the phone reaches itself."
onboardingWayNASLine:
  message: "SMB, SFTP or WebDAV, such as Nextcloud. Plays straight from it, without subtitles: those need Kando on a computer."
  description: "Line under 'NAS or cloud drive' on the introduction's 'Where are your films?' step. It must say plainly that films played this way have no subtitles. Name a WebDAV service common where the language is spoken."
onboardingWayTitle:
  message: "Where are your films?"
  description: "Title of the introduction's step that asks how the phone gets films: from Kando on a computer, a NAS or cloud drive, or both."
pairAddress:
  message: "Address"
  description: "Label of the field for the computer's address (IP and port), as its Phone Sync settings show it."
pairAddressExample:
  message: "192.168.1.20:47123"
  description: "Example in the empty address field: an IP address and a port. Keep the digits."
pairCode:
  message: "Code"
  description: "Label of the field for the 6-digit pairing code the computer shows."
pairCompareTitle:
  message: "Does your computer show these letters?"
  description: "Heading over the computer certificate's fingerprint in short, which the user compares with the computer's."
pairConfirm:
  message: "Pair"
  description: "Button that pairs once the user has compared the fingerprint."
pairConnecting:
  message: "Connecting…"
  description: "Spoken name of the pairing page's button while the phone reaches the computer, which shows a spinner meanwhile."
pairConnectingRelay:
  message: "Not on the computer's network. Pairing through your storage…"
  description: "Card on the pairing page while the phone, which could not reach the computer on its network, pairs through the storage the computer's Phone Sync relays through; it can take up to a minute."
pairContinue:
  message: "Continue"
  description: "Button under the address and code that reaches the computer."
pairErrAddress:
  message: "Enter the address as your computer shows it, such as 192.168.1.20:47123."
  description: "Error on the pairing page: the address is not an IP address with a port."
pairErrCamera:
  message: "Can't open the camera. Allow Kando to use it in Settings, or enter the address and code."
  description: "Error on the pairing page: the camera could not scan the QR code or take a photo of it, as when the user refused it."
pairErrCodeExpired:
  message: "That code has expired. Show a new one on your computer."
  description: "Error on the pairing page: the code is past its 5 minutes or was tried wrongly too often."
pairErrCodeUsed:
  message: "That code was used already. Show a new one on your computer."
  description: "Error on the pairing page: a phone paired with this code already."
pairErrFailed:
  message: "Pairing didn't finish. Try again."
  description: "Error on the pairing page for any other failure."
pairErrFingerprint:
  message: "This computer's certificate isn't the one in the pairing link."
  description: "Error on the pairing page: a pasted kando://pair link names another certificate than the computer's."
pairErrLocalNetwork:
  message: "Can't reach the computer at {address}. Turn on Local Network for Kando in Settings › Kando, and check that the phone is on the same Wi-Fi as the computer."
  description: "Error on the pairing page on iPhone: the system refused the connection, most likely because the app may not use the local network. 'Settings › Kando' is the iPhone's Settings app, the page of this app; 'Local Network' is the name of the switch there."
  placeholders:
    address: { type: "String", example: "192.168.1.20:47123" }
pairErrNoCode:
  message: "Open Settings › Phone Sync on your computer: it takes a code only while that page is open."
  description: "Error on the pairing page: the computer offers no code because its Phone Sync settings are not open."
pairErrNoQR:
  message: "Couldn't find a QR code in that photo. Take it closer, with the whole code in view."
  description: "Error on the pairing page: the photo taken to scan holds no QR code the app can read."
pairErrNotPairQR:
  message: "That QR code isn't a Kando pairing code."
  description: "Error on the pairing page: the QR code scanned is not the one the computer's Phone Sync settings show."
pairErrRelay:
  message: "Couldn't pair through your storage. Check that Kando is open on the computer and its storage works, then try again with a new code."
  description: "Error on the pairing page when pairing through the computer's storage relay got no answer."
pairErrTooMany:
  message: "Too many tries. Wait a minute, then try again."
  description: "Error on the pairing page: the computer refuses pairings for a while after many."
pairErrUnreachable:
  message: "Can't reach a computer at {address}. Check that both are on the same network and Phone Sync is on."
  description: "Error on the pairing page: nothing answered at the address."
  placeholders:
    address: { type: "String", example: "192.168.1.20:47123" }
pairErrWrongCode:
  message: "That isn't the code your computer shows."
  description: "Error on the pairing page: the code is not the one on offer."
pairOpenSettings:
  message: "Open Settings"
  description: "Button on the pairing page under the error that the phone may not use the local network: opens the app's page in the phone's Settings, where Local Network is turned on."
pairScan:
  message: "Scan QR Code"
  description: "Button on the pairing page that opens the camera to read the QR code the computer shows."
pairScanning:
  message: "Reading the QR code…"
  description: "Spoken name of the scan button while the app reads the photo, which shows a spinner meanwhile."
pairStepEnter:
  message: "Enter the address and code it shows"
  description: "Third of the numbered steps over the pairing form."
pairStepScan:
  message: "Scan the QR code it shows with this phone"
  description: "Third of the numbered steps over the pairing form, on a phone that can read the QR code the computer shows (the Scan QR Code button under the steps)."
pairStepOpen:
  message: "Open Kando on your computer"
  description: "First of the numbered steps over the pairing form."
pairStepSettings:
  message: "Settings › Phone Sync"
  description: "Second of the numbered steps over the pairing form: the page of the desktop app's settings to open."
pairSteps:
  message: "How to pair"
  description: "Spoken name of the numbered steps over the pairing form."
pairTitle:
  message: "Pair with a Computer"
  description: "Title of the pairing page."
playerAsking:
  message: "Asking {computer}…"
  description: "In the word card and the explanation sheet while the computer's AI service is asked."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerAudioOnly:
  message: "Audio Only"
  description: "Playback setting, and the words over the covered picture: the picture is hidden and only the sound plays."
playerAudioOnlyCover:
  message: "Video off; keeps playing when the phone is locked"
  description: "Under Audio Only on the covered picture: the picture is hidden and the sound plays on with the screen locked."
playerAudioOnlyNote:
  message: "Hides the picture, to listen as you would to a podcast."
  description: "Under the Audio Only switch in the playback settings."
playerCannotSave:
  message: "Open this film once while its computer is reachable to save its lines."
  description: "Toast when a line is saved from a film whose library the phone does not know yet, as one downloaded by an older version and opened away from the computer."
playerCantPlay:
  message: "This video can't play on this phone."
  description: "Over the player when the system's player cannot open the video, as one in a format the phone does not play."
playerSourceFailed:
  message: "Couldn't play this from {source}."
  description: "Over the player when a video streamed from a NAS or server could not be read from it, at its start or midway; why shows under it."
  placeholders:
    source: { type: "String", example: "Home NAS" }
playerSourceFileGone:
  message: "This video is no longer on {source}."
  description: "Over the player when the file of a video streamed from a NAS or server was moved or deleted there."
  placeholders:
    source: { type: "String", example: "Home NAS" }
playerCapsuleLoop:
  message: "Loop Line"
  description: "Button in the controls over the picture of a phone on its side that plays the line playing over and over."
playerCardPlace:
  message: "Line {index} / {count} · {time}"
  description: "At the top of the player's card: which line of the film it shows, and when it starts."
  placeholders:
    index: { type: "int", example: "3" }
    count: { type: "int", example: "18" }
    time: { type: "String", example: "0:20" }
playerClose:
  message: "Close"
  description: "Spoken name of the × that closes the word card over the picture of a phone on its side."
playerDelay:
  message: "Subtitle Timing"
  description: "Heading in the playback settings of the control that moves the film's lines against its sound."
playerDelayEarlier:
  message: "Earlier"
  description: "Spoken name of the − button that shows the lines earlier."
playerDelayLater:
  message: "Later"
  description: "Spoken name of the + button that shows the lines later."
playerDelayNote:
  message: "Lines ahead of the voice? Move them later; behind it, earlier. For this film only."
  description: "Under the subtitle timing control in the playback settings."
playerDelayPill:
  message: "Subtitles {seconds} s"
  description: "Pill over the picture while the film's lines are moved against its sound, as Subtitles +0.3 s."
  placeholders:
    seconds: { type: "String", example: "+0.3" }
playerDelayReset:
  message: "{seconds} seconds, tap to reset"
  description: "Spoken name of the value between − and +, which a tap sets back to 0."
  placeholders:
    seconds: { type: "String", example: "+0.3" }
playerDelaySeconds:
  message: "{seconds} s"
  description: "The value between − and +: how far the lines are moved, as +0.3 s."
  placeholders:
    seconds: { type: "String", example: "+0.3" }
playerExplain:
  message: "Explain"
  description: "Action under the player's card: has the computer's AI service explain the line."
playerExplainAnswering:
  message: "Answering…"
  description: "Under a follow-up question about the line explained while the computer's AI service answers it."
playerExplainAsk:
  message: "Ask"
  description: "Button beside the follow-up field of the explanation sheet: asks the question typed."
playerExplainAskLabel:
  message: "Ask About This Line"
  description: "Spoken name of the follow-up field of the explanation sheet."
playerExplainAskPlaceholder:
  message: "Ask about this line…"
  description: "Placeholder of the follow-up field of the explanation sheet."
playerExplainBreakdown:
  message: "Breakdown"
  description: "Heading of the explanation's section that takes the line's words and phrases one by one."
playerExplainBy:
  message: "{model} on {computer}"
  description: "Under the explanation's title when the model runs on the computer itself: which model, on which computer, wrote it."
  placeholders:
    model: { type: "String", example: "gpt-4o-mini" }
    computer: { type: "String", example: "Studio" }
playerExplainMeaning:
  message: "Meaning"
  description: "Heading of the explanation's section that says what the line means."
playerExplainMore:
  message: "More: Tone and Related Expressions"
  description: "Button under the explanation that shows its tone and related expressions too."
playerExplainOnlyBefore:
  message: "From this line and the ones before it only"
  description: "Footnote of the explanation: the computer's AI service is given no line after the one explained, so it gives nothing away."
playerExplainRelated:
  message: "Related Expressions"
  description: "Heading of the explanation's section of related expressions, shown after More."
playerExplainSave:
  message: "Save Line to Notes"
  description: "Button of the explanation sheet: saves the line, with what the explanation says it means as its note, so it comes up in review."
playerExplainSaved:
  message: "In Notes · it will come up in review"
  description: "The explanation sheet's save button once the line is saved."
playerExplainTitle:
  message: "Explain This Line"
  description: "Title of the sheet that explains a line."
playerExplainTone:
  message: "Tone"
  description: "Heading of the explanation's section on the line's tone, shown after More."
playerExplainTranslation:
  message: "About the Translation"
  description: "Heading of the explanation's section on what is worth knowing of the line's translation."
playerExplainVia:
  message: "{model}, asked through {computer}"
  description: "Under the explanation's title when the model is a cloud service the computer asked, not one running on it."
  placeholders:
    model: { type: "String", example: "gpt-4o-mini" }
    computer: { type: "String", example: "Studio" }
playerExportSubtitles:
  message: "Export Subtitles"
  description: "Button in the player's Info tab and row in its playback settings: shares the film's subtitles as a file."
playerFixedChip:
  message: "Edited"
  description: "Small chip after a line's translation in the player's card: the learner fixed this translation."
playerFollow:
  message: "Shadowing"
  description: "Playback setting, and the pill over the picture while it is on: the film holds after each line for the learner to say it."
playerFollowHeld:
  message: "Say it, then play"
  description: "Pill over the picture while shadowing has held the film after a line."
playerFollowNote:
  message: "Holds after each line so you can say it, then plays on when you play it."
  description: "Under the Shadowing switch in the playback settings."
playerHiddenLine:
  message: "Hidden line. Tap to show it."
  description: "Spoken name of a line of the player's card that the subtitle mode blurs."
playerHintReveal:
  message: "Tap the blurred line to show it"
  description: "Hint at the top of the player's card while the subtitle mode blurs a line."
playerHintWords:
  message: "Tap a yellow word for its meaning"
  description: "Hint at the top of the player's card: the words underlined in yellow are tapped to look them up."
playerInfoAudio:
  message: "Original Audio"
  description: "Row of the player's Info tab: the language spoken in the film."
playerInfoComputer:
  message: "Computer"
  description: "Row of the player's Info tab: the computer the film is from."
playerInfoLength:
  message: "Length"
  description: "Row of the player's Info tab: how long the film plays and how many lines it has."
playerInfoLengthValue:
  message: "{time} · {count, plural, one {# line} other {# lines}}"
  description: "Value of the Length row: how long the film plays and how many lines it has."
  placeholders:
    time: { type: "String", example: "3:00" }
    count: { type: "int", example: "18" }
playerInfoLibrary:
  message: "Library"
  description: "Row of the player's Info tab: the library on the computer the film is in."
playerInfoSource:
  message: "Source"
  description: "Row of the player's Info tab: where the film comes from, as YouTube."
playerInfoTranslation:
  message: "Translation"
  description: "Row of the player's Info tab: the language the subtitles are translated into."
playerKeepAwake:
  message: "Playing a film"
  description: "Why the app keeps the screen on while a film plays, where the system lists it."
playerLines:
  message: "Lines"
  description: "Spoken name of the player's list of the film's lines."
playerLoopLine:
  message: "Loop"
  description: "Spoken name of the player's button that plays the line playing over and over."
playerModeBilingual:
  message: "Bilingual"
  description: "Subtitle mode: the translation and the original."
playerModeHidden:
  message: "Hidden"
  description: "Subtitle mode: neither line shows; the card blurs both until a tap shows them."
playerModeOriginal:
  message: "Original Only"
  description: "Subtitle mode: the original line alone."
playerModePill:
  message: "Subtitles · {mode}"
  description: "Button over the picture of a phone on its side: the subtitle mode, which a tap changes to the next."
  placeholders:
    mode: { type: "String", example: "Both" }
playerModeShortBilingual:
  message: "Both"
  description: "Short name of the Bilingual subtitle mode, on the player's mode button: the translation and the original."
playerModeShortHidden:
  message: "Hidden"
  description: "Short name of the Hidden subtitle mode, on the player's mode button: neither line shows."
playerModeShortOriginal:
  message: "Original"
  description: "Short name of the Original Only subtitle mode, on the player's mode button: the original line alone."
playerModeShortTranslation:
  message: "Translation"
  description: "Short name of the Translation Only subtitle mode, on the player's mode button: the translation alone."
playerModeTranslation:
  message: "Translation Only"
  description: "Subtitle mode: the translation alone, the original where a line is not translated."
playerNextLine:
  message: "Next Line"
  description: "Spoken name of the player's button that plays from the next line, and on an iPad the name of its keyboard shortcut in the list shown while ⌘ is held."
playerNoLines:
  message: "This film has no subtitles."
  description: "In place of the line list for a film without subtitles."
playerNoteCleared:
  message: "Note removed"
  description: "Toast once the note of a saved line is cleared by saving it empty."
playerNoteEmpty:
  message: "Write something first"
  description: "Toast when an empty note is saved."
playerNoteFor:
  message: "Note on line {index}"
  description: "Heading and spoken name of the note field in the player's Notes tab."
  placeholders:
    index: { type: "int", example: "3" }
playerNoteHeading:
  message: "Note on this line · Line {index} / {count} · {time}"
  description: "Over the note field in the player's Notes tab: which line the note is for, and when it starts."
  placeholders:
    index: { type: "int", example: "3" }
    count: { type: "int", example: "18" }
    time: { type: "String", example: "0:20" }
playerNotePlaceholder:
  message: "Like: “picks up” here isn't “lifts”"
  description: "Placeholder of the note field in the player's Notes tab."
playerNoteSave:
  message: "Save"
  description: "Button beside the note field in the player's Notes tab."
playerNoteSaved:
  message: "Note saved"
  description: "Toast once a note is saved."
playerNotesEmpty:
  message: "Save a line from the card, or write a note above."
  description: "In the player's Notes tab when no line of the film is saved."
playerOnPicture:
  message: "Subtitles on the Picture"
  description: "Playback setting: the lines show over the picture while the phone is upright too."
playerOnPictureNote:
  message: "Upright, the lines show in the card under the picture."
  description: "Under the Subtitles on the Picture switch."
playerPanel:
  message: "Player Content"
  description: "Spoken name of the tabs under the player's card."
playerPart:
  message: "Part {index} · {from}–{to}"
  description: "A part of the film in the player's Parts tab, with when it starts and ends."
  placeholders:
    index: { type: "int", example: "1" }
    from: { type: "String", example: "0:00" }
    to: { type: "String", example: "0:45" }
playerPartsHint:
  message: "The film in equal parts. Tap one to play from it."
  description: "At the top of the player's Parts tab."
playerPause:
  message: "Pause"
  description: "Spoken name of the player's button while the film plays."
playerPictureInPicture:
  message: "Picture in Picture"
  description: "Row of the playback settings: plays the video in the system's small window over other apps."
playerPictureInPictureFailed:
  message: "Picture in Picture isn't available right now"
  description: "Toast in the player when the system cannot start Picture in Picture for the film; the film plays on in the player."
playerPlay:
  message: "Play"
  description: "Spoken name of the player's button while the film is held."
playerPosition:
  message: "Position"
  description: "Spoken name of the player's slider of where the film is."
playerPrevLine:
  message: "Previous Line"
  description: "Spoken name of the player's button that plays from the line before, and on an iPad the name of its keyboard shortcut in the list shown while ⌘ is held."
playerRecapBusy:
  message: "Summing up what you watched on {computer}…"
  description: "In the recap sheet while the computer's AI service sums up the part of the film watched."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerRecapContinue:
  message: "Continue from {at}"
  description: "Main button of the recap sheet: plays the film on from where it was left."
  placeholders:
    at: { type: "String", example: "1:40" }
playerRecapExcerptsFailed:
  message: "Lines you watched: the AI service on {computer} could not sum them up"
  description: "Footnote of the recap sheet when the computer's AI service failed and the sheet shows lines watched instead."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerRecapExcerptsNoAI:
  message: "Lines you watched, not summed up: {computer} has no AI service set up"
  description: "Footnote of the recap sheet when the computer has no AI service and the sheet shows lines watched instead."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerRecapExcerptsUnpaired:
  message: "Lines you watched, not summed up: this film's computer is no longer paired"
  description: "Footnote of the recap sheet when the film's computer is not paired any more and the sheet shows lines watched instead."
playerRecapExcerptsUnreachable:
  message: "Lines you watched, not summed up: can't reach {computer}"
  description: "Footnote of the recap sheet when the computer cannot be reached and the sheet shows lines watched instead."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerRecapJump:
  message: "Play from {at}: {text}"
  description: "Spoken name of a moment of the recap, which plays the film from there."
  placeholders:
    at: { type: "String", example: "1:40" }
    text: { type: "String", example: "They meet at the station." }
playerRecapNote:
  message: "Only what you watched · summed up by {model}"
  description: "Footnote of the recap sheet: the computer asked a cloud model, which was given only the lines watched."
  placeholders:
    model: { type: "String", example: "gpt-4o-mini" }
playerRecapNoteOn:
  message: "Only what you watched · summed up by {model} on {computer}"
  description: "Footnote of the recap sheet: a model running on the computer itself wrote it from the lines watched only."
  placeholders:
    model: { type: "String", example: "gpt-4o-mini" }
    computer: { type: "String", example: "Studio" }
playerRecapStartOver:
  message: "Start Over"
  description: "Button of the recap sheet: plays the film from its start."
playerRecapStoppedAt:
  message: "You stopped at {at}"
  description: "Under the recap sheet's title: where the film was left."
  placeholders:
    at: { type: "String", example: "1:40" }
playerRecapTitle:
  message: "Previously"
  description: "Title of the recap sheet a film left partway opens with: what happened in the part watched."
playerReplay:
  message: "Replay"
  description: "Action under the player's card: plays the line again from its start."
playerReplayLine:
  message: "Replay Line"
  description: "Button of the word card: plays the line the word was tapped in again."
playerSave:
  message: "Save"
  description: "Action under the player's card: saves the line to study."
playerSaved:
  message: "Saved"
  description: "The Save action once the line is saved; a tap takes it back."
playerSavedToast:
  message: "Line saved"
  description: "Toast once a line is saved."
playerSettings:
  message: "Playback Settings"
  description: "Title of the player's settings sheet, and spoken name of the … button that opens it."
playerSleep:
  message: "Sleep Timer"
  description: "Heading of the sleep timer's choices in the playback settings."
playerSleepFilm:
  message: "End of Film"
  description: "Sleep timer choice: holds the film at its end, rather than going on to the next film of its course, disc, season or playlist."
playerSleepLine:
  message: "End of Line"
  description: "Sleep timer choice: holds the film once the line playing ends."
playerSleepLineDone:
  message: "Sleep timer: paused after the line"
  description: "Toast once the sleep timer held the film at the end of a line."
playerSleepMinutes:
  message: "{minutes} min"
  description: "Sleep timer choice: holds the film after so many minutes."
  placeholders:
    minutes: { type: "int", example: "15" }
playerSleepOff:
  message: "Off"
  description: "Sleep timer choice: no timer."
playerSleepPaused:
  message: "Sleep timer: paused"
  description: "Toast once the sleep timer held the film after its minutes."
playerSleepPillFilm:
  message: "Stops after this film"
  description: "Pill over the picture while the sleep timer is set to the end of the film."
playerSleepPillIn:
  message: "Stops in {time}"
  description: "Pill over the picture while a timed sleep timer runs."
  placeholders:
    time: { type: "String", example: "12:00" }
playerSleepPillLine:
  message: "Stops after this line"
  description: "Pill over the picture while the sleep timer is set to the end of the line."
playerSpeed:
  message: "Playback Speed"
  description: "Spoken name of the player's menu of playback speeds, and heading of the speeds in the playback settings."
playerStudyFailed:
  message: "The AI service on {computer} didn't answer. Try again."
  description: "In the word card or the explanation when the computer's AI service failed."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerStudyNoAI:
  message: "Set up an AI service in Kando's settings on {computer} to look words up and explain lines."
  description: "In the word card or the explanation when the computer has no AI service."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerStudyNote:
  message: "Lookups, explanations and recaps send the lines they use to the AI service set up on {computer}."
  description: "Shown once, the first time the phone asks its computer to look a word up, explain a line or sum a film up: what is sent, and where."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerStudyUnpaired:
  message: "This film's computer is no longer paired with this phone."
  description: "In the word card or the explanation when the film's computer is not paired any more."
playerStudyUnreachable:
  message: "Can't reach {computer}. Words are looked up on it, so be on the same network."
  description: "In the word card or the explanation when the computer cannot be reached."
  placeholders:
    computer: { type: "String", example: "Studio" }
playerSubtitles:
  message: "Subtitles"
  description: "Spoken name of the player's menu of subtitle modes."
playerWordAIBadge:
  message: "AI"
  description: "Small badge before a word's meaning in the word card when an AI service wrote the meaning rather than a dictionary."
playerWordAppears:
  message: "{count, plural, one {Appears # time} other {Appears # times}}"
  description: "Beside a word in the Words tab: how many times the film's lines say it."
  placeholders:
    count: { type: "int", example: "3" }
playerWordSpeak:
  message: "Pronunciation"
  description: "Spoken name of the speaker button in the word card: says the word aloud."
playerWordsIntro:
  message: "Words looked up in this film. Tap + to add one to your vocabulary."
  description: "At the top of the player's Words tab."
reviewAgain:
  message: "Not yet · tomorrow"
  description: "Review button: the learner did not know it; it comes back in this review, then the next day."
reviewDoneSummary:
  message: "{total, plural, one {Reviewed # item} other {Reviewed # items}}; {again, plural, =0 {you knew them all.} one {missed 1. Missed ones come back tomorrow.} other {missed #. Missed ones come back tomorrow.}}"
  description: "At the review's end: how many items it went through and how many times one was not known."
