    count: { type: "int", example: "20" }
jobsCancel:
  message: "Cancel Job"
  description: "Spoken name of a job's × button, which cancels it on the computer."
jobsCancelConfirm:
  message: "Cancel Job"
  description: "Action sheet button that confirms canceling a job."
jobsCancelTitle:
  message: "Cancel “{title}” on {name}?"
