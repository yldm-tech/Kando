    count: { type: "int", example: 1 }
learnNewWords:
  message: "New words"
  description: "Learn's week: label under how many words were put in the vocabulary in the last seven days."
learnNoComputer:
  message: "Connect a computer to study the words and lines you save while you watch there."
  description: "Learn while no computer is paired."
learnOffline:
  message: "Can't reach your computer. Showing what this device kept; your reviews are sent later."
  description: "At the top of Learn when no paired computer answered."
learnReminderBody:
  message: "{count, plural, one {# word or line is waiting for review.} other {# words and lines are waiting for review.}}"
  description: "Body of the evening's review reminder."
  placeholders:
    count: { type: "int", example: "6" }
learnReminderCaption:
  message: "Daily review reminder at {time} · change in Settings"
  description: "Under the review mode while the review reminder is on; pressing it opens Settings."
  placeholders:
    time: { type: "String", example: "21:00" }
learnReminderTitle:
  message: "Time to review"
  description: "Title of the evening's review reminder."
learnRemove:
  message: "Remove"
  description: "Destructive button of the alert that removes a word or a line."
learnRemoveFromList:
  message: "In word list · remove"
  description: "Button of a word's sheet that removes the word from the word list."
learnReviewCards:
  message: "Cards"
  description: "Review mode: a card that shows its answer on a press."
learnReviewDictation:
