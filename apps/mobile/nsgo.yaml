# Kando's app for phones and tablets (yldm-tech/Kando#178), for the nsgo tool (go tool nsgo, the version go.mod pins). It plays the films Kando on a computer has made, downloaded over the local network from the computers it is paired with, and those it is still making, streamed from it as they are made; downloading from video sites, transcribing and translating stay on the computer. The Package (phone) workflow (.github/workflows/package-phone.yml) builds it for the stores, and listing/ holds its store listings and privacy answers; signing stays out of this file, as the desktop app's does.
name: Kando
id: ai.yldm.kando.mobile
version: 0.76.0
# The phone app's own icon: the desktop icon's speech bubble on a full-bleed square with no transparency, which the App Store requires of an iOS icon and iOS and Android's launchers round themselves; the desktop icon draws its own rounded square on a transparent margin, as macOS icons do.
icon:
  png: assets/Icon.png
i18n: { dir: locales, source: en }
# The app's own links (package widgets, widgets.Scheme): a tap on a widget opens the review or the film it shows with one, which iOS and Android hand to mobile.OnOpenLinks. Kando on a computer has kando://.
url_schemes: [kando-mobile]

build:
  output: build
  targets: [ios, android_arm64]

apple:
  info:
    # iOS asks before an app reaches devices on the local network, as the computers the app pairs with and downloads from are, and the NAS shares and servers it reaches itself (package sources, over SMB, SFTP or WebDAV with kando/packages/remotefs). Go's net/http on iOS goes through no URLSession, so App Transport Security does not apply to the computer's self-signed certificate, which the app pins by its fingerprint (kando/packages/sync), nor to a NAS's, which the user trusts by its fingerprint at the first connection. The catalogs' NSLocalNetworkUsageDescription message says it in each language (InfoPlist.strings); this English one is the Info.plist's.
    NSLocalNetworkUsageDescription: Kando connects to Kando on your computer, and to the NAS and servers you add, over your local network to list and download your films.
    # The pairing page reads the QR code the computer shows from the camera's live picture (package pair, NSGo's Scope.ScanCode), which iOS lets an app do only with a reason it shows as it asks; the catalogs' NSCameraUsageDescription message says it in each language (InfoPlist.strings).
    NSCameraUsageDescription: Kando uses the camera to read the QR code your computer shows, to pair with it.
    # App Store Connect asks every upload whether the app uses encryption that export rules restrict; until it is answered, TestFlight testers cannot install the build. The app encrypts only with standard protocols, HTTPS/TLS (Go's crypto/tls, to the computers it pairs with and to WebDAV servers), SSH (SFTP) and SMB's signing, which are exempt, so the answer is no, given here once for every build.
    ITSAppUsesNonExemptEncryption: false
    # A film the computer is still making plays as it is made, from a URL of the phone's own loopback server (package loopback), which forwards the system's player's requests to the computer over the pinned HTTPS the player cannot speak itself. AVFoundation keeps to App Transport Security, which refuses plain HTTP unless the app allows it; NSAllowsLocalNetworking allows it to loopback and the local network alone.
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true
  # Settings › Offline Films shows the films' share of the device and about how much of it is free (session/space.go, NSGo's Scope.DiskSpace), which Apple lets an app read only with a reason in its privacy manifest: 85F4.1, to show the user the space. The reading stays on the device.
  privacy:
    accessed_apis: { NSPrivacyAccessedAPICategoryDiskSpace: [85F4.1] }
  # Kando in the share sheet of YouTube, Safari, Bilibili and any app that shares a link or text: nsgo build puts a share extension (<id>.share, NSGoShare.appex) into the iOS package, which takes a share whose every attachment is one of these and keeps it in the app group (group.<id>, the widgets' too) until the app is next active, when mobile.OnShared hands it to the Add sheet (share.go). It is signed with its own provisioning profile (sign.share_profile, -share-profile), which grants that app group.
  share_types: [public.url, public.plain-text]
# Android: the runtime's manifest asks for INTERNET, which the app reaches the computer with; HTTPS to the computer needs no cleartext exception, plain HTTP to the phone's own loopback server does (loopback_cleartext). CAMERA lets the pairing page read the computer's QR code from the camera's live picture (Scope.ScanCode, which NSGo offers on Android only to an app whose manifest lists it); Android asks the user for it the first time the page scans. POST_NOTIFICATIONS lets the daily review reminder (session/learning.go) ask to show notifications from Android 13, where the system refuses an app whose manifest does not list it. No target_sdk: the runtime's own targetSdkVersion (API 36 since NSGo's bump in #441) is the level Google Play requires of new apps and updates, and nsgo build refuses a lower one for a store build.
android:
  permissions: [CAMERA, POST_NOTIFICATIONS]
  # The player plays a film the computer is still making from the phone's loopback server, over plain HTTP, which Android refuses from API 28 unless the app's network security policy allows it; this allows it to loopback alone, every other host staying HTTPS only.
  loopback_cleartext: true
  # Kando in the share sheet: the launcher takes Android's SEND of text, as YouTube and Chrome share a link, which mobile.OnShared hands to the Add sheet (share.go).
  share_types: [text/plain]

# Kando's own modules of go.work, which nsgo build checks as third-party dependencies when it collects the license notices; core passes only because it embeds a third-party license file (the segmenter's dictionary).
# TODO(nsgo#1814): nsgo build counts a go.work module (Module.Main) as a third-party dependency, so one with no recognized license file stops the build; drop this list once it counts them as the app's own https://github.com/nsgo-dev/nsgo/issues/1814
licenses:
  allow: [kando/packages/remotefs, kando/packages/study, kando/packages/sync]

# The widgets of iPhones and iPads (package widgets, yldm-tech/Kando#225): the streak with what is due for review, on the Home Screen and as a ring on the Lock Screen, and the film to go on with. Android has none of NSGo's yet (nsgo#1469).
# A kind's name and description name messages of the catalogs, which the system's gallery of widgets shows in the phone's language (the widget extension's Localizable.strings).
widgets:
  - kind: study
    name: widgetStudyName
    description: widgetStudyDescription
    families: [small, circular]
  - kind: continue
    name: widgetContinueName
    description: widgetContinueDescription
    families: [small, medium]
