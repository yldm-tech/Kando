# Kando's app for phones and tablets (yldm-tech/Kando#178), for the nsgo tool (go tool nsgo, the version go.mod pins). It plays the films Kando on a computer has made, downloaded over the local network from the computers it is paired with; downloading from video sites, transcribing and translating stay on the computer. Packaging and signing are phase 4 (#178).
name: Kando
id: ai.yldm.kando.mobile
version: 0.1.0
# The desktop app's icon, until phase 4 gives the phone app its own.
icon:
  png: ../kando/resources/icon.png
i18n: { dir: locales, source: en }

build:
  output: build
  targets: [ios, android_arm64]

apple:
  info:
    # iOS asks before an app reaches devices on the local network, as the computers the app pairs with and downloads from are. Go's net/http on iOS goes through no URLSession, so App Transport Security does not apply to the computer's self-signed certificate, which the app pins by its fingerprint (kando/packages/sync).
    NSLocalNetworkUsageDescription: Kando connects to Kando on your computer over your local network to list and download your films.
# Android: the runtime's manifest asks for INTERNET, the one permission the app needs; HTTPS to the computer needs no cleartext exception.

# The widgets of iPhones and iPads (package widgets, yldm-tech/Kando#225): the streak with what is due for review, on the Home Screen and as a ring on the Lock Screen, and the film to go on with. Android has none of NSGo's yet (nsgo#657).
# TODO(nsgo): a kind's name and description, which the system's gallery of widgets shows, are one string each (cmd/nsgo/widgets.go:108-118, Kinds.swift's Text(verbatim:)), so they are in English whatever the phone's language; say them in the catalog's languages once nsgo.yaml can take them from the app's locales
widgets:
  - kind: study
    name: Kando Streak
    description: Days in a row you watched, and what is waiting for review.
    families: [small, circular]
  - kind: continue
    name: Kando Continue Watching
    description: The film you left partway, and the line you left it on.
    families: [small, medium]
