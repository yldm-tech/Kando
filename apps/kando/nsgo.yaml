# Kando's app for the nsgo tool (go tool nsgo, the version go.mod pins). Release bumps the version (.github/scripts/set-version.sh).
name: Kando
id: ai.yldm.kando
version: 0.38.0
icon:
  png: resources/icon.png
i18n: { dir: locales, source: en }

build:
  output: build
  targets: [macos_arm64, macos_x64, windows_x64, windows_arm64, linux_x64, linux_arm64]
  # nodra_nomygo has nodra leave its MyGo helpers (nodra's api_mygo.go), and MyGo with them, out of the app, in every build, dev run and test nsgo makes of it; nsgo adds its own tags to these.
  tags: [nodra_nomygo]

# Kando views videos, so it ranks as an alternative app for the system's types of them rather than declaring types of its own.
file_types:
  - { name: MPEG-4 Video, extensions: [mp4], id: public.mpeg-4, role: viewer, conforms: [public.movie] }
  - { name: MPEG-4 Video, extensions: [m4v], id: com.apple.m4v-video, role: viewer, conforms: [public.movie] }
  - { name: QuickTime Movie, extensions: [mov], id: com.apple.quicktime-movie, role: viewer, conforms: [public.movie] }
  - { name: Matroska Video, extensions: [mkv], id: org.matroska.mkv, role: viewer, conforms: [public.movie] }
  - { name: WebM Video, extensions: [webm], id: org.webmproject.webm, role: viewer, conforms: [public.movie] }
  - { name: AVI Video, extensions: [avi], id: public.avi, role: viewer, conforms: [public.movie] }
  - { name: Flash Video, extensions: [flv], id: com.adobe.flash.video, role: viewer, conforms: [public.movie] }
  - { name: M4A Audio, extensions: [m4a], id: com.apple.m4a-audio, role: viewer, conforms: [public.audio] }
  - { name: Audiobook, extensions: [m4b], id: com.apple.protected-mpeg-4-audio-b, role: viewer, conforms: [public.audio], mime: [audio/mp4] }
  - { name: MP3 Audio, extensions: [mp3], id: public.mp3, role: viewer, conforms: [public.audio] }
  - { name: AAC Audio, extensions: [aac], id: public.aac-audio, role: viewer, conforms: [public.audio] }
  - { name: FLAC Audio, extensions: [flac], id: org.xiph.flac, role: viewer, conforms: [public.audio] }
  - { name: WAVE Audio, extensions: [wav], id: com.microsoft.waveform-audio, role: viewer, conforms: [public.audio] }
  - { name: Ogg Audio, extensions: [ogg, opus], id: org.xiph.ogg-audio, role: viewer, conforms: [public.audio] }
  - { name: Windows Media Audio, extensions: [wma], id: com.microsoft.windows-media-wma, role: viewer, conforms: [public.audio], mime: [audio/x-ms-wma] }
# The NSIS installer adds Kando to these types' Open With, and the Linux desktop entry lists their MIME types.

# Kando's own links: the bookmarklet of Settings › 通用 › 浏览器扩展 opens kando://add?url=… on a video's page (browserext.ReadLink), and the site's plugin directory kando://plugin/install?id=… (index.ReadInstallLink). Every package registers the scheme with the system: the macOS bundle's Info.plist, the Windows installer's HKCU\Software\Classes\kando (started as "<exe>" -- "%1", cli.OpensWindow), the Linux desktop entry's x-scheme-handler/kando with %U.
url_schemes: [kando]

release: { github: yldm-tech/Kando }

# The same Ed25519 key as Kando's MyGo builds verified their updates with: NSGO_UPDATES_KEY is the first 32 bytes, the seed, of the MYGO_UPDATER_PRIVATE_KEY secret's 64, which the Package workflow takes from it.
# The script plugins' revocation list is published beside the appcasts, as kando-plugin-revocations.json of the latest release (script.RevocationsURL in plugins/script/script.go).
# Each appcast carries the version's section of CHANGELOG.md as its release notes: the Package workflow writes it with .github/scripts/changelog.sh and passes it to nsgo build -release-notes, which renders the Markdown as the HTML that Sparkle's and WinSparkle's update dialogs show and NSGo's prompt on Linux shows as text.
updates:
  key: Ixbkzk6yM6p8gK3hgwK8IdnorQCJp9vpRlWUbsZs3LQ=

# The Linux packages also depend on GTK's GStreamer media backend and GStreamer's good, bad and libav plugins, so that Kando's videos play through GtkMediaFile.
linux:
  depends:
    deb: [libgtk-4-media-gstreamer, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav]
    arch: [gst-plugins-good, gst-plugins-bad, gst-libav]

# Signing stays out of this file: a signed build (the Package workflow) passes nsgo build -sign with the Developer ID identity and notarizes with NSGO_NOTARY_KEY, NSGO_NOTARY_KEY_ID and NSGO_NOTARY_ISSUER, an App Store Connect API key, so builds elsewhere are signed ad hoc and need no secrets.
