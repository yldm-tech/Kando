settingsGeneralCLIInstalledAt:
  message: "Type kando in a terminal. The command is at {path}."
  description: "Line under Command-Line Tool once a terminal finds the kando command: how to use it and where it is."
  placeholders:
    path: { type: "String", example: "/usr/local/bin/kando" }
settingsGeneralCLIMCP:
  message: "MCP"
  description: "Title of the row about Kando's MCP server (Model Context Protocol). An acronym; keep it as is."
settingsGeneralCLIMCPHint:
  message: "Lets AI assistants such as Claude Desktop and Cursor use Kando. Paste the config into their MCP settings."
  description: "Line under MCP: what the server is for and what to do with Copy Config."
settingsGeneralCLIMoveFirst:
  message: "Kando is running from a disk image or a temporary location. Move Kando to the Applications folder and open it from there first."
  description: "Shown on the Command Line & MCP card, and after \"Couldn't install: \", when Kando runs from its disk image or a temporary copy macOS made (App Translocation), whose path stops working: the command and the MCP configuration need Kando moved to the Applications folder first. Use the system's name for the Applications folder."
settingsGeneralCLINotOnPath:
  message: "Installed at {path}, but {dir} isn't on the terminal's PATH. Add it to PATH, then open a new terminal window."
  description: "Line under Command-Line Tool when the kando command was installed in a folder a terminal doesn't search: where it is, and the folder to add to PATH."
  placeholders:
    path: { type: "String", example: "~/.local/bin/kando" }
    dir: { type: "String", example: "~/.local/bin" }
settingsGeneralCLINote:
  message: "Both work through Kando itself and open it when it isn't running."
  description: "Footnote under the Command Line & MCP card."
settingsGeneralCLIOther:
  message: "The kando a terminal runs is {path}, not this Kando."
  description: "Line under Command-Line Tool when the kando a terminal finds is another program or another copy of Kando."
  placeholders:
    path: { type: "String", example: "/usr/local/bin/kando" }
settingsGeneralCLIReinstall:
  message: "Reinstall"
  description: "Button installing the kando command again, replacing one that runs another copy of Kando or one a terminal doesn't find."
settingsGeneralCLITool:
  message: "Command-Line Tool"
  description: "Title of the row about the kando terminal command."
settingsGeneralCLIToolHint:
  message: "Add videos and check jobs and subtitles from a terminal with the kando command."
  description: "Line under Command-Line Tool before it is installed: what the kando command does."
settingsGeneralComponents:
  message: "Components"
  description: "Heading of the card listing the programs Kando runs."
settingsGeneralCurrentLibrary:
  message: "Current library"
  description: "Row title and pop-up name on the General page: the library Kando has open."
settingsGeneralDownload:
  message: "Download"
  description: "Button on a program's row that downloads it, where the computer does not have it."
settingsGeneralDownloadFailed:
  message: "Download failed: {error}"
  description: "Where a program is, after Kando's download of it failed, with what went wrong."
  placeholders:
    error: { type: "String", example: "HTTP 404" }
settingsGeneralDownloading:
  message: "Downloading…"
  description: "Where a program is, while Kando downloads it; also the name of its progress bar."
settingsGeneralForget:
  message: "Remove from list"
  description: "Row title: take the current library off Kando's list of libraries."
settingsGeneralForgetButton:
  message: "Remove"
  description: "Button taking the current library off the list."
settingsGeneralForgetHint:
  message: "Takes it off Kando's list only; the files stay where they are."
  description: "Under Remove from list: the files are not deleted."
settingsGeneralInstalled:
  message: "Installed"
  description: "A program Kando runs that was found but did not tell its version."
settingsGeneralInterfaceLanguage:
  message: "Interface language"
  description: "Row title and pop-up name: the language of Kando's interface."
settingsGeneralLanguageName:
  message: "English"
  description: "This catalog's language named in itself, as the Interface language pop-up lists it, so the choice stays readable whatever language Kando shows."
settingsGeneralLastCheck:
  message: "Last checked {when}"
  description: "Under Version in Settings › General: when Kando last checked for updates; {when} is a date and time."
  placeholders:
    when: { type: "DateTime" }
settingsGeneralLibrary:
  message: "Library"
  description: "Heading of the General page's library card."
settingsGeneralLibraryNote:
  message: "Switching libraries stops the jobs in progress. Removing a library from the list doesn't delete the files in it."
  description: "Footnote under the General page's library card."
settingsGeneralLocation:
  message: "Location"
  description: "Row title: where the library is on disk."
settingsGeneralNewLibrary:
  message: "New Library…"
  description: "Button making a new library."
settingsGeneralNoLibrary:
  message: "No library yet"
  description: "Under Current library when there is no library yet."
settingsGeneralNotInstalled:
  message: "Not Installed"
  description: "A program Kando runs that was not found."
settingsGeneralNotify:
  message: "Notify when a video is done"
  description: "Switch in Settings › General: Kando posts a notification when a video's subtitles are ready or could not be made while it is in the background."
settingsGeneralNotifyHint:
  message: "While Kando is in the background, a notification says when a video's subtitles are ready or couldn't be made."
  description: "Line under the notification switch in Settings › General."
settingsGeneralOpenLibrary:
  message: "Open Library…"
  description: "Button opening an existing library."
settingsGeneralRedetect:
  message: "Detect Again"
  description: "Button looking for ffmpeg, yt-dlp and whisper-cli again."
settingsGeneralRetry:
  message: "Retry"
  description: "Button on a program's row that downloads it again after its download failed."
settingsGeneralShowInFinder:
  message: "{platform, select, macOS {Show in Finder} Windows {Show in File Explorer} other {Show in File Manager}}"
  description: "Button showing the library folder in the system's file manager. {platform} is the system the app runs on: macOS, Windows or another (Linux); each case names that system's file manager."
  placeholders:
    platform: { type: "String", example: "macOS" }
settingsGeneralToolDetail:
  message: "{use} · {where}"
  description: "Line under a program's name: what it is for, then where it was found or Not Installed."
