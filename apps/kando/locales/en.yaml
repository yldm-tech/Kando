  description: "Detail under the current film check box, which cannot be ticked, while no film is open in the player."
feedbackIntro:
  message: "Opens GitHub's new issue page in your browser with everything filled in, for you to check and submit. Issues are public."
  description: "Line under the feedback dialog's title: what the dialog does."
feedbackKindBug:
  message: "Problem"
  description: "Segment of the feedback dialog: the feedback reports a problem."
feedbackKindIdea:
  message: "Suggestion"
  description: "Segment of the feedback dialog: the feedback suggests a feature."
feedbackKindSubs:
  message: "Subtitle Quality"
  description: "Segment of the feedback dialog: the feedback is about the quality of a film's subtitles."
feedbackKindsLabel:
  message: "Feedback type"
  description: "Accessible name of the segmented control choosing what the feedback is about."
feedbackMenuFilmSubs:
  message: "Send Feedback on This Film's Subtitles…"
  description: "Help menu item that opens the feedback dialog on the subtitles of the film open in the player."
feedbackMenuReport:
  message: "Send Feedback…"
  description: "Help menu item that opens the feedback dialog, which opens a GitHub issue."
feedbackMenuSubs:
  message: "Send Subtitle Feedback…"
  description: "Help menu item that opens the feedback dialog on subtitle quality, while no film is open."
feedbackNoSpeechModel:
  message: "No model chosen"
  description: "Stands for the speech model in the components detail when none is chosen."
feedbackOpen:
  message: "Open in GitHub"
  description: "Button opening the prefilled new-issue page in the browser."
feedbackPreview:
  message: "Issue Preview"
  description: "Heading over the preview of the GitHub issue."
feedbackPreviewLabel:
  message: "Label: {label}"
  description: "Second line of the issue preview: the repository's label the link fills in, such as bug or enhancement."
  placeholders:
    label: { type: "String", example: "bug" }
feedbackPreviewTitle:
  message: "Title: {title}"
  description: "First line of the issue preview: the title the link fills in."
  placeholders:
    title: { type: "String", example: "Subtitles are a second late" }
feedbackPreviewUntitled:
  message: "(empty)"
  description: "What the issue preview shows for the title while the title field is empty."
feedbackSubsDetail:
  message: "Goes public on GitHub; only the line at the playhead ({time}) is attached"
  description: "Detail under the subtitle check box: the line goes to a public issue, and when it starts."
  placeholders:
    time: { type: "String", example: "0:12.5" }
feedbackSubsNone:
  message: "Open a film with subtitles to attach this"
  description: "Detail under the subtitle check box, which cannot be ticked, while no film with subtitles is open."
feedbackTitle:
  message: "Send Feedback"
  description: "Title of the feedback dialog."
feedbackTitleHint:
  message: "Describe the problem in one sentence"
  description: "Placeholder of the title field when reporting a problem or subtitle quality."
feedbackTitleHintIdea:
  message: "Say what you'd like in one sentence"
  description: "Placeholder of the title field when suggesting a feature."
feedbackToolBroken:
  message: "{name} doesn't run"
  description: "A program in the feedback dialog's list of components whose copy does not start."
  placeholders:
    name: { type: "String", example: "ffmpeg" }
feedbackToolMissing:
  message: "{name} not installed"
  description: "A tool in the components detail that is not installed."
  placeholders:
    name: { type: "String", example: "whisper-cli" }
feedbackToolNoVersion:
  message: "{name} version unknown"
  description: "A tool in the components detail that did not say its version."
  placeholders:
    name: { type: "String", example: "ffmpeg" }
feedbackToolsDetail:
  message: "{tools}; transcription {speech} · translation {translator} (no keys)"
  description: "Detail under the components and models check box: the tools' versions, the speech model and the translation service, never its key."
  placeholders:
    tools: { type: "String", example: "yt-dlp 2026.09.14 · ffmpeg 7.1 · whisper-cli not installed" }
    speech: { type: "String", example: "ggml-base.bin" }
    translator: { type: "String", example: "EveryAPI · claude-haiku-5-5" }
feedbackTruncated:
  message: "The text is too long, so the link leaves out its last {count, plural, one {# character} other {# characters}}. Use “Copy Text” to copy all of it and paste it over the text on the GitHub page."
