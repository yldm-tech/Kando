settingsSpeechBlurbBase:
  message: "Clear English talks and podcasts, almost instantly."
  description: "What the whisper model Base is good for."
settingsSpeechBlurbLargeV3:
  message: "The most accurate and the slowest. For noisy places, conversations among several people, or films in less common languages."
  description: "What the whisper model Large v3 is good for."
settingsSpeechBlurbLargeV3Turbo:
  message: "Almost the same results as the compressed version, at about 3 times the space."
  description: "What the whisper model Large v3 Turbo is good for, next to its compressed version."
settingsSpeechBlurbLargeV3TurboQ5:
  message: "The choice for most cases: close to the highest accuracy, small and fast."
  description: "What the recommended whisper model Large v3 Turbo (Compressed) is good for."
settingsSpeechBlurbMedium:
  message: "More accurate with strong accents and fast speech, but noticeably slower."
  description: "What the whisper model Medium is good for."
settingsSpeechBlurbSmall:
  message: "Good enough for everyday videos, and mostly reliable for Chinese and other languages too."
  description: "What the whisper model Small is good for."
settingsSpeechBlurbTiny:
  message: "For a quick try only. It makes many mistakes and suits only clearly spoken English."
  description: "What the whisper model Tiny is good for."
settingsSpeechCancel:
  message: "Cancel"
  description: "Button canceling a whisper model's download."
settingsSpeechDownload:
  message: "Download"
  description: "Button downloading a whisper model."
settingsSpeechDownloadDisconnected:
  message: "The connection dropped. Check your network and download again."
  description: "Error on the Speech Recognition page and in the guide: the connection to the server failed or broke off during a whisper model's download. It may fail before any data arrived, so it does not promise to resume."
