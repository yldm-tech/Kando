sidebarSettings:
  message: "Settings"
  description: "Accessible name of the gear on the status card, which opens the settings that fix what is missing."
sidebarSourceAll:
  message: "All Films"
  description: "Sidebar item showing every film of the library; also the library page's title then."
sidebarSourceBilibili:
  message: "Bilibili"
  description: "Sidebar item showing the films from Bilibili."
sidebarSourceLocal:
  message: "Local Files"
  description: "Sidebar item showing the films made from local video files."
sidebarSourceWeb:
  message: "Other Sites"
  description: "Sidebar item showing the films from websites other than YouTube and Bilibili."
sidebarStatus:
  message: "Status"
  description: "Accessible name of the status card at the foot of the sidebar."
sidebarSwitcherLabel:
  message: "Switch library, current: {name}"
  description: "Accessible name of the library switcher: what it does and the open library."
  placeholders:
    name: { type: "String", example: "My Films" }
sitesCaveat:
  message: "Videos that need a sign-in or membership, or that are DRM-encrypted, may not download even from a site on the list."
  description: "Second line under the sheet's title."
sitesDone:
  message: "Done"
  description: "Button closing the sheet."
sitesFound:
  message: "{count, plural, one {# found} other {# found}} · {source}"
  description: "Footer while searching: how many sites the search found, then the list's source."
  placeholders:
    count: { type: "int", example: "2" }
    source: { type: "String", example: "List from yt-dlp 2026.08.19" }
sitesGridLabel:
  message: "Websites"
  description: "Accessible name of the grid of websites."
sitesIntro:
  message: "Kando downloads videos with yt-dlp, which recognizes the {count, plural, one {# website} other {# websites}} below."
  description: "First line under the sheet's title: how many websites yt-dlp recognizes."
  placeholders:
    count: { type: "int", example: "929" }
sitesMenuItem:
  message: "Supported Websites…"
  description: "Help menu item that opens the sheet listing the websites Kando downloads from."
sitesNotFound:
  message: "“{query}” is not on the list"
  description: "Heading when the search finds no website."
  placeholders:
    query: { type: "String", example: "missav.ai" }
sitesNotFoundHint:
  message: "You can still try pasting a link from a site that isn't listed: yt-dlp finds standard videos on many web pages, and downloads links that point straight to a video file or an m3u8 playlist."
  description: "What may still work when the search finds no website."
sitesSearchClear:
  message: "Clear Search"
  description: "Accessible name of the button at the end of the Supported Websites sheet's search field that empties it."
sitesSearchLabel:
  message: "Search websites"
  description: "Accessible name of the sheet's search field."
sitesSearchPlaceholder:
  message: "Search by site name or domain, or paste a video link"
  description: "Placeholder of the sheet's search field."
sitesSource:
  message: "List from yt-dlp {version}"
  description: "Footer: the yt-dlp release the list was taken from."
  placeholders:
    version: { type: "String", example: "2026.08.19" }
sitesTileLabel:
  message: "{name}, {domain}"
  description: "Accessible name of a website's tile: its name and its domain."
  placeholders:
    name: { type: "String", example: "YouTube" }
    domain: { type: "String", example: "youtube.com" }
sitesTitle:
  message: "Supported Websites"
  description: "Title of the sheet listing the websites Kando downloads from through yt-dlp."
sourceAll:
  message: "All Films"
  description: "Sidebar source and library page title: every film of the library."
sourceApplePodcasts:
  message: "Apple Podcasts"
  description: "Name of Apple Podcasts (podcasts.apple.com), as Apple names it in each language."
sourceBilibili:
  message: "Bilibili"
  description: "Name of the video site bilibili, as a source of films and in a link's tag."
sourceDouyin:
  message: "Douyin"
  description: "Name of the Chinese video site Douyin (douyin.com)."
sourceDouyu:
  message: "Douyu"
  description: "Name of the Chinese streaming site Douyu (douyu.com)."
sourceHuya:
  message: "Huya"
  description: "Name of the Chinese streaming site Huya (huya.com)."
sourceIqiyi:
  message: "iQIYI"
  description: "Name of the Chinese video site iQIYI (iqiyi.com, iq.com)."
sourceLocal:
  message: "Local Files"
  description: "Where a film comes from when it is a video file on this computer: library page title and the source under a poster."
sourceMangoTV:
  message: "Mango TV"
  description: "Name of the Chinese video site Mango TV (mgtv.com)."
sourceNaverTV:
  message: "Naver TV"
  description: "Name of the Korean video site Naver TV (tv.naver.com)."
sourceNiconico:
  message: "Niconico"
  description: "Name of the Japanese video site niconico (nicovideo.jp)."
sourceTencentVideo:
  message: "Tencent Video"
  description: "Name of the Chinese video site Tencent Video (v.qq.com)."
sourceWeb:
  message: "Other Sites"
  description: "Library page title for films downloaded from sites other than YouTube and bilibili."
sourceWeibo:
  message: "Weibo"
  description: "Name of the Chinese site Weibo (weibo.com)."
sourceXigua:
  message: "Xigua Video"
  description: "Name of the Chinese video site Xigua Video (ixigua.com)."
sourceYouku:
  message: "Youku"
  description: "Name of the Chinese video site Youku (youku.com)."
updatesCheck:
  message: "Check for Updates…"
  description: "Item of the app menu (and the command palette) that checks for a newer version of Kando and shows the update window."
windowMenuMain:
  message: "Main Window"
  description: "Item of the Window menu (macOS) that shows Kando's main window again after its close button put it away while Kando keeps running."
