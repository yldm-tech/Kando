filmsSortAscending:
  message: "Ascending"
  description: "Item of the sort menu after the orders: lists the films from A to Z, the oldest or the shortest first. Checked while the films are in that direction."
filmsSortButton:
  message: "Sort: {order}"
  description: "Pull-down button beside the heading of the grid of finished films that opens the sort menu, naming the order the grid shows now."
  placeholders:
    order: { type: "String", example: "Recently Added" }
filmsSortDescending:
  message: "Descending"
  description: "Item of the sort menu after the orders: lists the films from Z to A, the newest or the longest first. Checked while the films are in that direction."
filmsSortDuration:
  message: "Length"
  description: "Sort order of the finished films, its item in the sort menu, and the heading of the list's column of how long each film plays: the longest first."
filmsSortSource:
  message: "Source"
  description: "Sort order of the grid of finished films, and its item in the sort menu: films grouped by where they come from (YouTube, Bilibili, other sites, local files), as the sidebar lists the sources."
filmsSortSpoken:
  message: "Spoken Language"
  description: "Sort order of the grid of finished films, and its item in the sort menu: films grouped by the language heard in them, those whose language is not known last."
filmsSortTitle:
  message: "Title"
  description: "Sort order of the grid of finished films, and its item in the sort menu: films in alphabetical order of their titles."
filmsSortWatched:
  message: "Recently Watched"
  description: "Sort order of the grid of finished films, and its item in the sort menu: the films played last come first, those never played after them."
filmsSpokenEmpty:
  message: "No films in {language} from this source yet."
  description: "Shown when none of the films of the source chosen in the sidebar was heard in the language chosen under Languages."
  placeholders:
    language: { type: "String", example: "Japanese" }
filmsStageComplete:
  message: "Done"
  description: "Stage of a job: finished."
filmsStageDownloading:
  message: "Downloading"
  description: "Stage of a job: downloading the video."
filmsStageExporting:
  message: "Exporting"
  description: "Stage of a job: writing the subtitle files."
filmsStageFailed:
  message: "Failed"
  description: "Stage of a job: failed."
filmsStageQueued:
  message: "Queued"
  description: "Stage of a job: waiting in the queue."
filmsStageTranscribing:
  message: "Transcribing"
  description: "Stage of a job: transcribing the speech into subtitles."
filmsStageTranslating:
  message: "Translating"
  description: "Stage of a job: translating the subtitles."
filmsStart:
  message: "Start Processing"
  description: "Toolbar button that adds the pasted link to the queue."
filmsSubtitlesOnly:
  message: "Subtitles only"
  description: "Part of the line under a poster: the film keeps no video (it was downloaded as Subtitles Only) and streams when watched."
filmsSupportedSites:
  message: "Supported Websites…"
  description: "Button on the empty library's page that opens the sheet listing the websites Kando downloads from."
filmsTranslate:
  message: "Translate"
  description: "Button under a finished film that has no translation, its subtitles being the original lines only, and the same item in its menu and the player's ⋯ menu: translates every line into the film's language."
filmsTranslateAgain:
  message: "Translate Again Into"
  description: "Submenu of a finished film's menu listing the target languages, the one set in the settings first and the film's own checked: translates its subtitles again into the language chosen, without downloading or transcribing it again."
filmsTranslateAll:
  message: "Translate {count, plural, one {# Film} other {# Films}}"
  description: "Button beside the heading of the finished films when two or more of those shown have no translation, their subtitles being the original lines only, and an AI service is set up: translates every line of each of them into the target language set in the settings."
  placeholders:
    count: { type: "int", example: "3" }
filmsTranslateMissing:
  message: "Translate Missing Lines"
  description: "Button under a finished film whose translation failed for some lines, and the same item in its menu: translates only those lines."
filmsUntranslated:
  message: "{count, plural, one {# line} other {# lines}} failed to translate, the rest are done"
  description: "Part of the line under a finished film: how many subtitle lines the translation failed on."
  placeholders:
    count: { type: "int", example: "3" }
filmsView:
  message: "View"
  description: "Accessible name of the switch beside the sort button that shows the finished films as icons or as a list."
filmsViewGrid:
  message: "Icons"
  description: "Accessible name of the segment of the view switch that shows the finished films as posters."
filmsViewList:
  message: "List"
  description: "Accessible name of the segment of the view switch that shows the finished films as a list, and of the list itself."
filmsWatchEmptyInProgress:
  message: "No films in progress here."
  description: "Shown in the library when In Progress is chosen under Progress in the sidebar and no film of the source and language chosen was started without being finished."
filmsWatchEmptyUnwatched:
  message: "No unwatched films here."
  description: "Shown in the library when Not Watched is chosen under Progress in the sidebar and every film of the source and language chosen has been started."
filmsWatchEmptyWatched:
  message: "No watched films here yet."
  description: "Shown in the library when Watched is chosen under Progress in the sidebar and no film of the source and language chosen was watched to its end."
filmsWatchShowAll:
  message: "Show All Films"
  description: "Button under the message that no film is in the watch state chosen in the sidebar: show the films however far they were watched."
filmsWatched:
  message: "Watched"
  description: "Accessible name of the check mark over a poster: the film was played to its end."
glossaryIntro:
  message: "Terms apply at once. A locked term is translated exactly as written here, and no machine pass changes it."
  description: "Note at the top of the Terms tab of the player's side panel."
glossaryEmpty:
  message: "This film has no terms yet."
  description: "Terms tab: shown instead of the list when the film's glossary is empty."
glossaryScopeFilm:
  message: "This Film"
  description: "Scope of a term (its pill in the Terms tab): it applies to this film only."
glossaryScopeSeries:
  message: "Series"
  description: "Scope of a term (its pill in the Terms tab): it applies to every film of this film's series."
glossaryScopeGlobal:
  message: "All Films"
  description: "Scope of a term (its pill in the Terms tab): it applies to every film."
glossaryMetaLocked:
  message: "{scope} · Locked"
  description: "Line under a locked term in the Terms tab: where it applies, and that it is locked."
  placeholders:
    scope: { type: "String", example: "This Film" }
glossaryScopeLabel:
  message: "Applies to: {scope}. Press to change it to {next}."
  description: "Accessible name and tooltip of a term's scope pill in the Terms tab."
  placeholders:
    scope: { type: "String", example: "This Film" }
    next: { type: "String", example: "Series" }
glossaryLock:
  message: "Lock “{term}”"
  description: "Accessible name of the button that locks a term in the Terms tab."
  placeholders:
    term: { type: "String", example: "河曲" }
glossaryUnlock:
  message: "Unlock “{term}”"
  description: "Accessible name of the button that unlocks a locked term in the Terms tab."
  placeholders:
    term: { type: "String", example: "河曲" }
glossaryRemove:
  message: "Remove “{term}”"
  description: "Accessible name of the button that removes a term from the glossary in the Terms tab."
  placeholders:
    term: { type: "String", example: "meander" }
glossarySeriesLine:
  message: "Series “{name}” · {count, plural, one {# film} other {# films}}"
  description: "Terms tab: the series the film is part of and how many films of the library are in it."
  placeholders:
    name: { type: "String", example: "Geography" }
    count: { type: "int", example: "3" }
glossaryLeaveSeries:
  message: "Not a Series"
  description: "Terms tab: button that takes the film out of its series, after which it no longer uses the series' terms."
glossaryAddGroup:
  message: "Add a Term"
  description: "Terms tab: heading over the fields a new term is typed in."
glossarySource:
  message: "Term"
  description: "Terms tab: accessible name of the field for the words as the film's lines write them."
glossarySourceHint:
  message: "As the lines say it"
  description: "Placeholder of the field for a new term's words, as the film's lines write them."
glossaryTarget:
  message: "Translation"
  description: "Terms tab: accessible name of the field for how the term is to be translated."
glossaryTargetHint:
  message: "Translate it as"
  description: "Placeholder of the field for a new term's translation."
glossaryAdd:
  message: "Add"
  description: "Terms tab: button that adds the term typed in the fields beside it."
glossaryUnreadable:
  message: "The glossary file could not be read, so it was not changed."
  description: "Message over the picture when glossary.json could not be read at startup, so a change of a series' or every film's term is not saved over it."
glossarySaveFailed:
  message: "Could not save the glossary."
  description: "Message over the picture when a change of the glossary could not be written to disk."
glossaryNewer:
  message: "This film's terms were written by a newer Kando and cannot be changed here."
  description: "Message over the picture when the film's terms file was written by a newer version of Kando."
kitsDownloadDisconnected:
  message: "the connection dropped"
  description: "Why Kando's download of a program failed, after 'Download failed:': the connection to the server broke off."
kitsDownloadFailedStatus:
  message: "the server answered HTTP {status}"
  description: "Why Kando's download of a program failed, after 'Download failed:': the server answered with an error status instead of the file."
  placeholders:
    status: { type: "int", example: "503" }
kitsDownloadStalled:
  message: "the server stopped sending data"
  description: "Why Kando's download of a program failed, after 'Download failed:': no data arrived for a long while."
libraryAddedOneStarting:
  message: "Added. Processing started."
  description: "Message bar when one video was added to the queue."
libraryAddedSome:
  message: "{count, plural, one {Added # video.} other {Added # videos.}} {error}"
  description: "Message bar when some of the links or files were added to the queue and the others could not be; the error says why."
  placeholders:
    count: { type: "int", example: "2" }
    error: { type: "String", example: "One link isn't a video." }
libraryAddedStarting:
  message: "Added {count, plural, one {# video} other {# videos}}. Processing started."
  description: "Message bar when several videos were added to the queue."
  placeholders:
    count: { type: "int", example: "3" }
libraryAddedUntranslated:
  message: "Added. Without an AI service, subtitles will be in the original language only."
  description: "Message bar when videos were added to the queue while no AI service is set up (no model, or EveryAPI without a key or its program): they are processed, and their subtitles are the original lines until they are translated. Comes with an Open Settings button to “AI Service”."
libraryDefaultName:
  message: "Film Library"
  description: "Name the new-library sheet suggests for a new library; it becomes the folder's name, followed by a number when taken."
libraryFileMissing:
  message: "The file is no longer there."
  description: "Error when the file to show in Finder is no longer there."
libraryFileTaken:
  message: "A file with this name already exists in this location."
  description: "Error in the new-library sheet: a file of that name is already in the chosen folder."
libraryImportButton:
  message: "Import"
  description: "Confirming button of the folder dialog that opens a library already on disk."
libraryImportTitle:
  message: "Import Library"
  description: "Title of the folder dialog that opens a library already on disk."
libraryMoveBusy:
  message: "Another film is being moved. Try again once it's done."
  description: "Message bar when a film is to be moved to another library while another one is still being copied to a library on another drive."
libraryMovedMany:
  message: "Moved {count, plural, one {# film} other {# films}} to {library}"
  description: "Message bar after several selected films were moved to another library."
  placeholders:
    count: { type: "int", example: "12" }
    library: { type: "String", example: "English Listening" }
libraryMovedManyLeft:
  message: "Moved {count, plural, one {# film} other {# films}} to {library}, but some of their files couldn't be removed from {from}."
  description: "Message bar after several films were copied to a library on another drive but some of their files could not be deleted from the library they came from."
  placeholders:
    count: { type: "int", example: "12" }
    library: { type: "String", example: "English Listening" }
    from: { type: "String", example: "My Films" }
libraryMovedSome:
  message: "Moved {done} of {total, plural, one {# film} other {# films}} to {library}. {reason}"
  description: "Message bar after several films were to be moved to another library and some could not be: how many were, then why the first that was not failed, a sentence of its own."
  placeholders:
    done: { type: "int", example: "10" }
    total: { type: "int", example: "12" }
    library: { type: "String", example: "English Listening" }
    reason: { type: "String", example: "“Learn Rust” is being processed. Move it once it's done." }
libraryMoveFailed:
  message: "Couldn't move “{name}” to {library}: {error}. Its files are where they were."
  description: "Message bar when a film could not be moved to another library; nothing moved. error is the system's reason."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
    library: { type: "String", example: "English Listening" }
    error: { type: "String", example: "no space left on device" }
libraryMoveGone:
  message: "The film is no longer there, so it can't be moved back."
  description: "Message bar when Undo after a move finds the film gone from the library it was moved to."
libraryMoveLinesUnread:
  message: "Couldn't read the saved lines of {library}, so nothing was moved."
  description: "Message bar when a film is to be moved between libraries but one library's saved lines file (study.json, or saved-lines.json before it) cannot be read; writing it would lose what is in it, so Kando moves nothing."
  placeholders:
    library: { type: "String", example: "English Listening" }
libraryMoveNoVideo:
  message: "“{name}” has no video to move yet."
  description: "Error when a film whose video has not been downloaded yet is to be moved to another library."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
libraryMoveOutFailed:
  message: "Couldn't move the library to its new folder: {error}"
  description: "Error when Kando could not move its videos out of an older version's library folder into a library of its own."
  placeholders:
    error: { type: "String", example: "permission denied" }
libraryMoveProcessing:
  message: "“{name}” is still being processed. Move it once it's done."
  description: "Message bar when a film that is waiting or being processed is to be moved to another library; Kando does not move it."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
libraryMoveSame:
  message: "“{name}” is already in {library}."
  description: "Error when a film is to be moved to the library it is in already."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
    library: { type: "String", example: "My Films" }
libraryMoveStopped:
  message: "Stopped moving “{name}”. Its files are where they were."
  description: "Message bar after the copy of a film to a library on another drive was cancelled; nothing moved."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
libraryMoveStoppedMany:
  message: "Stopped moving films to {library}. {done, plural, one {# film had moved} other {# films had moved}}; the rest are where they were."
  description: "Message bar after moving several films to a library on another drive was cancelled once some had moved; Undo moves those back."
  placeholders:
    done: { type: "int", example: "3" }
    library: { type: "String", example: "English Listening" }
libraryMoveUnknown:
  message: "Kando doesn't know a library at {path}."
  description: "Error when a film is to be moved to a folder that is not one of the libraries Kando knows. path is the folder."
  placeholders:
    path: { type: "String", example: "/Users/me/Movies/English.kando" }
libraryMoveUnreachable:
  message: "{library} isn't available. Connect the drive it's on, then try again."
  description: "Message bar when the folder of the library a film is to be moved to cannot be found, as on a drive that is not plugged in."
  placeholders:
    library: { type: "String", example: "English Listening" }
libraryMoved:
  message: "Moved “{name}” to {library}"
  description: "Message bar after a film was moved to another library."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
    library: { type: "String", example: "English Listening" }
libraryMovedLeft:
  message: "Moved “{name}” to {library}, but some of its files couldn't be removed from {from}."
  description: "Message bar after a film was copied to a library on another drive but some of its files could not be deleted from the library it came from."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
    library: { type: "String", example: "English Listening" }
    from: { type: "String", example: "My Films" }
libraryMoving:
  message: "Moving “{name}” to {library}… {percent}%"
  description: "Message bar while a film is being copied to a library on another drive, with how much is copied."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
    library: { type: "String", example: "English Listening" }
    percent: { type: "int", example: "42" }
libraryMovingMany:
  message: "Moving film {at} of {total} to {library}… {percent}%"
  description: "Message bar while several selected films are moved to a library on another drive, one after another: which one is being copied, of how many, and how much of it is copied."
  placeholders:
    at: { type: "int", example: "3" }
    total: { type: "int", example: "12" }
    library: { type: "String", example: "English Listening" }
    percent: { type: "int", example: "42" }
libraryNameEmpty:
  message: "Enter a name for the library."
  description: "Error in the new-library sheet: the name field is empty."
libraryNameHasPath:
  message: "A library name can't contain a path."
  description: "Error in the new-library sheet: the name holds a slash or is . or .."
libraryNameNotAllowed:
  message: "Windows doesn't allow this name. Leave out < > : \" | ? * and don't use a name Windows reserves, such as CON or NUL."
  description: "Error in the new-library sheet on Windows: the name holds a character Windows refuses in a file's name, or is a device name it reserves."
libraryNameTaken:
  message: "A library with this name already exists. Choose another name."
  description: "Error in the new-library sheet: a library of that name is already in the chosen folder."
libraryOpenVideosMenu:
  message: "Open Local Video…"
  description: "File menu item that opens a file dialog to add local videos."
libraryPickVideosButton:
  message: "Open"
  description: "Confirming button of the file dialog that chooses videos."
libraryPickVideosTitle:
  message: "Choose Videos"
  description: "Title of the file dialog that chooses videos to add."
libraryPlaceButton:
  message: "Choose"
  description: "Confirming button of the folder dialog that chooses where a new library goes."
libraryPlaceTitle:
  message: "Where to Keep the Library"
  description: "Title of the folder dialog that chooses where a new library goes."
libraryRemoved:
  message: "Removed “{name}” from the library"
  description: "Message bar after a film whose video is outside the library was taken off the library."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
libraryRemovedMany:
  message: "Removed {count, plural, one {# film} other {# films}} from the library"
  description: "Message bar after several selected films were taken off the library, some or all of them videos kept outside it, which stay where they are."
  placeholders:
    count: { type: "int", example: "12" }
libraryReprocessingMany:
  message: "Processing {count, plural, one {# film} other {# films}} again"
  description: "Message bar after several selected films were queued to be processed again."
  placeholders:
    count: { type: "int", example: "12" }
libraryReprocessingSome:
  message: "Processing {done} of {total, plural, one {# film} other {# films}} again. {reason}"
  description: "Message bar after several films were to be processed again and some could not be queued: how many were, then why the first that was not, a sentence of its own."
  placeholders:
    done: { type: "int", example: "10" }
    total: { type: "int", example: "12" }
    reason: { type: "String", example: "Choose a subtitle language first." }
libraryRetranslatingMany:
  message: "Translating {count, plural, one {# film} other {# films}} into {language} again"
  description: "Message bar after several selected films were queued to be translated again into a language."
  placeholders:
    count: { type: "int", example: "12" }
    language: { type: "String", example: "Japanese" }
libraryRetranslatingSome:
  message: "Translating {done} of {total, plural, one {# film} other {# films}} into {language} again. {reason}"
  description: "Message bar after several films were to be translated again and some could not be queued: how many were, then why the first that was not, a sentence of its own."
  placeholders:
    done: { type: "int", example: "10" }
    total: { type: "int", example: "12" }
    language: { type: "String", example: "Japanese" }
    reason: { type: "String", example: "Choose a subtitle language first." }
libraryRevealNotOpened:
  message: "Couldn't open the enclosing folder: no app opened it."
  description: "Error when the folder holding a file could not be opened because the system had no app open it."
librarySaveFailed:
  message: "Couldn't save the library: {error}"
  description: "Error when the list of libraries could not be saved to the settings file."
  placeholders:
    error: { type: "String", example: "permission denied" }
librarySearchMenu:
  message: "Search Films"
  description: "Edit menu item and shortcut (⌘F while the library page shows) that puts the keyboard in the sidebar’s search field."
libraryShelfDamaged:
  message: "The film list has content Kando can't read; the original was saved as library.json.bad: {error}"
  description: "Notice at startup when library.json, the list of films and jobs, has content Kando cannot read; the file was copied to library.json.bad and Kando goes on with what it could read. Keep the file name as it is."
  placeholders:
    error: { type: "String", example: "unexpected end of JSON input" }
libraryShelfDamagedUnsaved:
  message: "The film list has content Kando can't read, and a copy couldn't be saved, so Kando won't save the list until it restarts: {error}"
  description: "Error at startup when library.json has content Kando cannot read and the copy beside it could not be written; Kando then does not write library.json, so nothing in it is lost."
  placeholders:
    error: { type: "String", example: "permission denied" }
libraryShelfNotSaved:
  message: "Kando couldn't read the film list in full, so it won't save the list until it restarts."
  description: "Error when Kando was about to save library.json, the list of films and jobs, but does not, because at startup the file could not be read in full and no copy of it could be kept; writing it would lose what Kando could not read."
libraryShelfReadFailed:
  message: "Couldn't read the film list: {error}"
  description: "Error when the list of films and jobs (library.json) could not be read."
  placeholders:
    error: { type: "String", example: "unexpected end of JSON input" }
libraryShelfSaveFailed:
  message: "Couldn't save the film list: {error}"
  description: "Error when the list of films and jobs (library.json) could not be saved."
  placeholders:
    error: { type: "String", example: "permission denied" }
librarySkippedNotVideos:
  message: "{added} {count, plural, one {Skipped # file that isn't a video.} other {Skipped # files that aren't videos.}}"
  description: "Message bar after files or folders were dropped or opened and some of the files in them were not videos, which were left out. added is the message bar's sentence about the videos added, such as “Added 3 videos. Processing started.”; count is how many files were left out. A folder adds the videos directly in it and in its subfolders."
  placeholders:
    added: { type: "String", example: "Added 3 videos. Processing started." }
    count: { type: "int", example: "2" }
libraryTranslateOffer:
  message: "{count, plural, one {# film has} other {# films have}} subtitles in the original language only."
  description: "Message bar once an AI service is set up while finished films of the open library have no translation, their subtitles being the original lines only. Comes with a Translate button that translates all of them."
  placeholders:
    count: { type: "int", example: "3" }
libraryTrashedMany:
  message: "Moved {count, plural, one {# film} other {# films}} to the Trash"
  description: "Message bar after several selected films were moved to the Trash."
  placeholders:
    count: { type: "int", example: "12" }
libraryTrashedSome:
  message: "Removed {done} of {total, plural, one {# film} other {# films}} from the library. {reason}"
  description: "Message bar after several films were to be removed from the library and some could not be: how many were, then why the first that was not failed, a sentence of its own."
  placeholders:
    done: { type: "int", example: "10" }
    total: { type: "int", example: "12" }
    reason: { type: "String", example: "Couldn't move “Learn Rust” to the Trash. Its files are where they were." }
libraryTrashFailed:
  message: "Couldn't move “{name}” to the Trash. Its files are where they were."
  description: "Message bar when a film could not be moved to the Trash: its volume has no Trash, a file was gone, or the system refused; nothing was deleted. The system's reason is in Kando's log, not in the sentence."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
libraryTrashUnsupported:
  message: "Couldn't move “{name}” to the Trash: Kando can't use a Trash on this computer. Its files are where they were."
  description: "Message bar when a film could not be moved to the Trash because Kando cannot reach a Trash on this system (on Linux, without gio); nothing was deleted."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
libraryTrashed:
  message: "Moved “{name}” to the Trash"
  description: "Message bar after a film was moved to the Trash."
  placeholders:
    name: { type: "String", example: "Learn Rust" }
librarySortSaveFailed:
  message: "Couldn't save the sort order: {error}"
  description: "Message bar when the order chosen for the grid of finished films could not be written to the settings file."
  placeholders:
    error: { type: "String", example: "permission denied" }
libraryVideoFilter:
  message: "Videos"
  description: "Name of the file type filter of the file dialog that chooses videos."
libraryViewSaveFailed:
  message: "Couldn't save the view: {error}"
  description: "Message bar when the choice of icons or a list for the finished films could not be written to the settings file."
  placeholders:
    error: { type: "String", example: "permission denied" }
libraryWindowTitle:
  message: "Kando"
