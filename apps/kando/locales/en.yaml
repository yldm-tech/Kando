appName:
  message: "Kando"
  description: "The app's name in this language, which its packages show: the menu bar, the Dock, Finder and the Start menu."
accountCOSAccessHint:
  message: "Enter the SecretId."
  description: "Hint under the Tencent Cloud COS Access Key field: Tencent calls it SecretId."
accountCOSBucketHint:
  message: "Include the APPID, for example video-1250000000."
  description: "Hint under the Tencent Cloud COS Bucket field."
accountCOSRegionHint:
  message: "For example, ap-guangzhou."
  description: "Hint under the Tencent Cloud COS Region field."
accountCOSSecretHint:
  message: "Enter the SecretKey."
  description: "Hint under the Tencent Cloud COS Secret field: Tencent calls it SecretKey."
accountCompatEndpointHint:
  message: "The full https address."
  description: "Hint under the S3-compatible storage's Endpoint field."
accountCompatRegionHint:
  message: "The region name used for signing. For MinIO, usually us-east-1."
  description: "Hint under the S3-compatible storage's Region field."
accountFixSettings:
  message: "Open Settings"
  description: "Button in the player's upload capsule opening Settings › Account & Upload to fill in the storage, or to correct it after an upload failed because of it."
accountGoogleFailed:
  message: "Google sign-in didn't finish"
  description: "Error under the account card when the Google sign-in failed or was cancelled."
accountNeedsStore:
  message: "Fill in {store} in Settings › Account & Upload first"
  description: "Why the player cannot upload: the chosen storage is not filled in. Names the settings page."
  placeholders:
    store: { type: "String", example: "R2" }
accountOSSRegionHint:
  message: "For example, cn-hangzhou. For the internal network, enter cn-hangzhou-internal."
  description: "Hint under the Alibaba Cloud OSS Region field."
accountPathStyle:
  message: "Path Style"
  description: "Switch of the S3-compatible storage: address the bucket in the path instead of the host name."
accountPathStyleHint:
  message: "On for MinIO. Off for B2, Wasabi, Huawei Cloud and Qiniu."
  description: "Hint under the path style switch: which services need it."
accountR2EndpointHint:
  message: "Enter the Account ID, or the full https address."
  description: "Hint under the Cloudflare R2 Endpoint field."
accountS3RegionHint:
  message: "For example, ap-northeast-1."
  description: "Hint under the Amazon S3 Region field."
accountSaveFailed:
  message: "The account couldn't be saved"
  description: "Error under the account card when the settings file could not be written."
accountSectionAccount:
  message: "Account"
  description: "Heading of the Google account card on the Account & Upload settings page."
accountSectionStorage:
  message: "Object Storage"
  description: "Heading of the object storage card on the Account & Upload settings page."
accountSignIn:
  message: "Sign In with Google"
  description: "Button signing in with Google in the browser."
accountSignInNote:
  message: "Signing in only marks who uploaded. The refresh token is kept in the settings file on this computer."
  description: "Note under the account card: what signing in is for and where the token is kept."
accountSignOut:
  message: "Sign Out"
  description: "Button signing out of the Google account."
accountSignedInWith:
  message: "Signed in with Google"
  description: "The account row's subtitle under the signed-in email."
accountSignedOut:
  message: "Not Signed In"
  description: "The account row's title while no Google account is signed in."
accountSignedOutHint:
  message: "Sign in to file uploads under your email."
  description: "The account row's subtitle while no Google account is signed in: uploads work without one, and signing in files them in a folder named by the account's email."
accountSigningIn:
  message: "Signing In…"
  description: "The sign-in button's title while the browser sign-in runs."
accountStorageKind:
  message: "Type"
  description: "Row and drop-down choosing the kind of object storage."
accountStoreCOS:
  message: "Tencent Cloud COS"
  description: "Tencent Cloud's object storage in the storage drop-down."
accountStoreCompat:
  message: "S3 Compatible"
  description: "Any S3-compatible object storage, such as MinIO, in the storage drop-down, on the upload button and in the message asking to fill it in."
accountStoreOSS:
  message: "Alibaba Cloud OSS"
  description: "Alibaba Cloud's object storage in the storage drop-down."
accountUploadCanceled:
  message: "Upload canceled"
  description: "The player's upload capsule after the upload was canceled with its Cancel button."
accountUploadDenied:
  message: "These keys can't write to the bucket {bucket}. Give them write access, or use other keys."
  description: "Upload error: the storage refused the keys write access to the bucket (AccessDenied). The settings button follows it."
  placeholders:
    bucket: { type: "String", example: "clips" }
accountUploadFailed:
  message: "Upload failed"
  description: "Upload error whose cause is hidden because it would show a key."
accountUploadFailedBecause:
  message: "Upload failed: {error}"
  description: "Upload error with the storage's error message."
  placeholders:
    error: { type: "String", example: "status 403" }
accountUploadFailedSeeLog:
  message: "Upload failed. The details are in the log file."
  description: "Upload error that none of the others names; the storage's own error is in the log file (Help › Show Log File)."
accountUploadInsecure:
  message: "Couldn't connect securely to {host}. Check whether the Endpoint is http or https, and its certificate."
  description: "Upload error: the TLS connection to the storage failed, because the certificate is not trusted or the server speaks plain http. Endpoint is the field's name, not translated. The settings button follows it."
  placeholders:
    host: { type: "String", example: "minio.local:9000" }
accountUploadKeys:
  message: "The storage didn't accept the Access Key or Secret. Check them."
  description: "Upload error: the storage rejected the keys (SignatureDoesNotMatch, InvalidAccessKeyId). Access Key and Secret are the fields' names, not translated. The settings button follows it."
accountUploadNoBucket:
  message: "There's no bucket named {bucket}. Check the Bucket, or create it first."
  description: "Upload error: the bucket does not exist (NoSuchBucket). Bucket is the field's name, not translated. The settings button follows it."
  placeholders:
    bucket: { type: "String", example: "clips" }
accountUploadNote:
  message: "Videos aren't uploaded automatically when a download finishes: click Upload in the player. Each storage's keys are saved separately, only in the settings file on this computer."
  description: "Note under the object storage card: uploads are by hand, and where the keys are kept."
accountUploadOffline:
  message: "Couldn't connect to the storage. Check the network and try again."
  description: "Upload error: the connection to the storage could not be made or broke off."
accountUploadRegion:
  message: "The bucket {bucket} is in another region. Check the Region or Endpoint."
  description: "Upload error: the request was signed for another region than the bucket's (PermanentRedirect, AuthorizationHeaderMalformed). Region and Endpoint are the fields' names, not translated. The settings button follows it."
  placeholders:
    bucket: { type: "String", example: "clips" }
accountUploadStalled:
  message: "The storage stopped answering. Check the network and try again."
  description: "Upload error: the storage took no data and gave no answer for a minute."
accountUploadTo:
  message: "Upload to {store}"
  description: "The player's upload button, naming the storage (R2, S3, OSS, COS or S3 Compatible)."
  placeholders:
    store: { type: "String", example: "R2" }
accountUploadTooLarge:
  message: "The video is larger than 5 GB, the most one upload can send."
  description: "Upload error: the video is larger than one upload to object storage can take."
accountUploadUnreachable:
  message: "Couldn't find {host}. Check the Endpoint or Region."
  description: "Upload error: the storage's host name does not resolve. Endpoint and Region are the fields' names, not translated. The settings button follows it."
  placeholders:
    host: { type: "String", example: "clips.s3.ap-northeast-1.amazonaws.com" }
accountUploadUnsaved:
  message: "The film was uploaded, but couldn't be marked as uploaded: {error}"
  description: "Error in the sidebar when a film was uploaded but settings.json, which remembers uploaded films across restarts, could not be written."
  placeholders:
    error: { type: "String", example: "permission denied" }
accountUploaded:
  message: "Uploaded {key}"
  description: "The player's upload capsule once the film was uploaded, with the object's key in the bucket."
  placeholders:
    key: { type: "String", example: "a@b.c/Movies/Learn Rust/video.mp4" }
accountUploading:
  message: "Uploading"
  description: "The player's upload capsule while the upload starts, before its size is known."
accountUploadingOther:
  message: "Uploading another film"
  description: "The player's upload capsule while another film is uploading."
accountUploadingPercent:
  message: "Uploading {percent}%"
  description: "The player's upload capsule while uploading, with how much is done."
  placeholders:
    percent: { type: "int", example: "42" }
accountVideoMissing:
  message: "The video file isn't on this computer"
  description: "Upload error when the film's video file is not on disk."
appSettings:
  message: "Settings…"
  description: "App menu item and shortcut row (⌘,) that opens Settings."
browseAdded:
  message: "Added to the library. Processing started."
  description: "Message bar of the Browse page after Download Video added the page to the library's queue."
browseAddedTitled:
  message: "Added “{title}” to the library. Processing started."
  description: "Message bar of the Browse page after Download Video added the page's video to the library's queue, naming the video by the page's title."
  placeholders:
    title: { type: "String", example: "Learn French in 10 Minutes" }
browseAddressLabel:
  message: "Address"
  description: "Accessible name of the Browse page's address field."
browseAddressPlaceholder:
  message: "Enter a URL or search"
  description: "Placeholder of the Browse page's address field: a web address or words to search for."
browseBack:
  message: "Back"
  description: "Browse page toolbar button and menu item (⌘[) going back to the previous web page."
browseCancel:
  message: "Cancel"
  description: "Button of the Clear Sign-in Data confirmation that keeps the data."
browseClearConfirm:
  message: "Clear"
  description: "Destructive button of the Clear Sign-in Data confirmation."
browseClearData:
  message: "Clear Sign-in Data…"
  description: "Button at the foot of the Browse page's empty state, and menu item, that asks to sign out of every site signed in to in Browse."
browseClearFailed:
  message: "Couldn't clear sign-in data: {error}"
  description: "Message bar of the Browse page when clearing the pages' cookies and storage failed; error is the system's reason."
  placeholders:
    error: { type: "String", example: "The operation couldn't be completed." }
browseClearMessage:
  message: "You'll be signed out of every site you signed in to here, and what those pages stored, such as their settings and caches, is removed too."
  description: "Message of the Clear Sign-in Data confirmation."
browseClearTitle:
  message: "Clear sign-in data?"
  description: "Title of the confirmation before clearing the Browse page's cookies and storage."
browseCleared:
  message: "Sign-in data cleared."
  description: "Message bar of the Browse page once its cookies and storage were cleared."
browseDownload:
  message: "Download Video"
  description: "Button at the end of the Browse page's toolbar that adds the page shown to the library's queue."
browseDownloadList:
  message: "Download Videos"
  description: "Button at the end of the Browse page's toolbar while the page shown is a playlist or a channel: it lists the videos and asks before adding them to the library's queue."
browseDownloadListTooltip:
  message: "Add this page's videos to the library"
  description: "Tooltip of the Browse page's Download Videos button, on a playlist's or a channel's page."
browseDownloadNotVideo:
  message: "This page isn't a video. Open one of its videos first."
  description: "Tooltip of the Browse page's Download Video button while it is off, and its message bar, when the page shown lists videos without being one: a site's home page, search results, a feed or a hashtag. A playlist's or a channel's page has Download Videos instead."
browseDownloadTitled:
  message: "Add “{title}” to the library"
  description: "Tooltip of the Browse page's Download Video button, naming the page's video by its title."
  placeholders:
    title: { type: "String", example: "Learn French in 10 Minutes" }
browseDownloadTooltip:
  message: "Add this page's video to the library"
  description: "Tooltip of the Browse page's Download Video button."
browseEmptyDescription:
  message: "Open a site, find a video, then click Download Video."
  description: "Description of the Browse page before a web page is open."
browseEmptyTitle:
  message: "Open a page with a video"
  description: "Title of the Browse page before a web page is open."
browseForward:
  message: "Forward"
  description: "Browse page toolbar button and menu item (⌘]) going forward to the next web page."
browseHome:
  message: "Home"
  description: "Browse page toolbar button that closes the web page and shows the start of the Browse page."
browseInLibrary:
  message: "In Library"
  description: "Label of the Browse page's Download Video button while the page's video is already a film of the library; pressing it opens the film."
browseInLibraryTitled:
  message: "Open “{title}” in the library"
  description: "Tooltip of the Browse page's In Library button, naming the film it opens."
  placeholders:
    title: { type: "String", example: "Learn French in 10 Minutes" }
browseInLibraryTooltip:
  message: "Open this video in the library"
  description: "Tooltip of the Browse page's In Library button when the film's name is not known."
browseLoadFailed:
  message: "Couldn't open the page: {error}"
  description: "Message bar of the Browse page when a web page failed to load; error is the web engine's reason."
  placeholders:
    error: { type: "String", example: "A server with the specified hostname could not be found." }
browseNoticeClose:
  message: "Close Message"
  description: "Accessible name of the close button at the end of the Browse page's message bar."
browseOpenLocation:
  message: "Open Location…"
  description: "Menu item and shortcut row (⌘L) that puts the keyboard in the Browse page's address field."
browseOpenSettings:
  message: "Open Settings"
  description: "Button in the Browse page's message bar opening the settings that fix what it says."
browseQueued:
  message: "Queued"
  description: "Label of the Browse page's Download Video button while the page's video is waiting in the library's queue or being processed; pressing it shows its card in Processing."
browseQueuedTitled:
  message: "Show “{title}” in the queue"
  description: "Tooltip of the Browse page's Queued button, naming the video whose card it shows."
  placeholders:
    title: { type: "String", example: "Learn French in 10 Minutes" }
browseQueuedTooltip:
  message: "Show this video in the queue"
  description: "Tooltip of the Browse page's Queued button when the video's name is not known."
browseReload:
  message: "Reload Page"
  description: "Browse page toolbar button and menu item (⌘R) loading the web page again."
browseShowInLibrary:
  message: "Show in Library"
  description: "Button of the Browse page's message bar that goes to the library and shows the video the bar speaks of: the film, once processed, or its card in Processing."
browseSignInChange:
  message: "Change…"
  description: "Button after browseSignInRefresh on the Browse page's start: opens Settings › General, where the browser whose sign-in the pages and downloads use is chosen."
browseSignInChoose:
  message: "Choose Browser…"
  description: "Button after browseSignInOff on the Browse page's start: opens Settings › General, where a browser whose sign-in the pages and downloads use can be chosen."
browseSignInFailed:
  message: "Couldn't sign in the pages here: {error}"
  description: "Message bar of the Browse page when the web pages' cookie store refused the sign-in read from the user's own browser; error is the system's reason."
  placeholders:
    error: { type: "String", example: "The operation couldn't be completed." }
browseSignInOff:
  message: "Downloads aren't signed in."
  description: "Line on the Browse page's start while no browser's sign-in is chosen for downloads, before browseSignInChoose."
browseSignInOn:
  message: "Pages and downloads use {browser}'s sign-in."
  description: "Line on the Browse page's start, before browseSignInRefresh: the pages opened in Kando's own browser and the downloads sign in to sites as the user is in that browser."
  placeholders:
    browser: { type: "String", example: "Chrome" }
browseSignInRefresh:
  message: "Refresh Sign-In"
  description: "Button after browseSignInOn on the Browse page's start: reads the chosen browser's sign-in again and puts it into the pages here, for a site the user signed in to there since."
browseSignInRefreshed:
  message: "Pages here use {browser}'s sign-in."
  description: "Message bar of the Browse page once Refresh Sign-In read the chosen browser's sign-in again and put it into the pages."
  placeholders:
    browser: { type: "String", example: "Chrome" }
browseStop:
  message: "Stop Loading"
  description: "Browse page toolbar button, in place of Reload while a web page loads, that stops loading it."
cheatsheetClose:
  message: "Close"
  description: "Accessible name of the cheat sheet's close button."
cheatsheetHint:
  message: "Single keys work only while no text field has focus"
  description: "Note next to the cheat sheet's title: shortcuts without a modifier key do nothing while a text field is being typed in."
cheatsheetMenuItem:
  message: "Shortcut Cheat Sheet"
  description: "Help menu item and shortcut row (⌘/) that opens the list of keyboard shortcuts."
cheatsheetPalette:
  message: "Ask This Film / Commands"
  description: "Cheat sheet line, under Window, for ⌘K, the command palette that also answers questions about the film."
cheatsheetPlayPause:
  message: "Play / Pause"
  description: "Cheat sheet line for the Space key in the player."
cheatsheetPrevNextLine:
  message: "Previous / Next Line"
  description: "Cheat sheet line, under Playback, for the A and D keys that move to the previous or the next subtitle line."
cheatsheetSearchLines:
  message: "Search Lines"
  description: "Cheat sheet line, under Subtitles, for ⌘F, which searches the film's lines."
cheatsheetSettings:
  message: "Settings"
  description: "Cheat sheet line, under Window, for ⌘, which opens Settings."
cheatsheetSidebar:
  message: "Sidebar"
  description: "Cheat sheet line, under Subtitles, for the key that shows or hides the player's sidebar of lines."
cheatsheetSkip30:
  message: "Back / Forward 30 Seconds"
  description: "Cheat sheet line for ⌘← and ⌘→ in the player."
cheatsheetSkip5:
  message: "Back / Forward 5 Seconds"
  description: "Cheat sheet line for the ← and → keys in the player."
cheatsheetSpeed:
  message: "Slower / Faster"
  description: "Cheat sheet line for the ⇧, and ⇧. keys in the player, which play the film slower or faster."
cheatsheetSubtitlesDelay:
  message: "Subtitle Delay −/+ 0.1 s"
  description: "Cheat sheet line, under Subtitles, for the Z and X keys that move the subtitles 0.1 second earlier or later."
cheatsheetSubtitlesMode:
  message: "Switch Display Mode"
  description: "Cheat sheet line, under Subtitles, for the key that cycles bilingual, translation only and original only."
cheatsheetSubtitlesPosition:
  message: "Subtitles Up / Down"
  description: "Cheat sheet line, under Subtitles, for the Option-Up and Option-Down keys that move the subtitles up or down over the picture."
cheatsheetSubtitlesShowHide:
  message: "Show / Hide"
  description: "Cheat sheet line, under Subtitles, for the key that shows or hides the subtitles."
cheatsheetTitle:
  message: "Keyboard Shortcuts"
  description: "Title of the shortcut cheat sheet."
cheatsheetVolume:
  message: "Volume Up / Down"
  description: "Cheat sheet line for the ↑ and ↓ keys in the player."
chromeClose:
  message: "Close"
  description: "Accessible name of the round close button at the right end of the window's header bar on Linux, which closes the window."
chromeMaximize:
  message: "Maximize"
  description: "Accessible name of the round button in the window's header bar on Linux that maximizes the window, and the command palette's row that does so on Windows and Linux."
chromeMinimize:
  message: "Minimize"
  description: "Accessible name of the round button in the window's header bar on Linux that minimizes the window."
chromeRestore:
  message: "Restore"
  description: "Accessible name of the header bar's maximize button on Linux while the window is maximized, and the command palette's row that takes the window back to its size, as Windows names it."
chromeSearch:
  message: "Search commands and lines"
  description: "Button in the window's title bar on Windows and Linux that opens the command palette, which finds commands, films and subtitle lines already watched. Its shortcut (Ctrl+K) shows after it."
cloudSignedIn:
  message: "Signed in. You can close this page."
  description: "The browser page Google's sign-in returns to, once the app has the sign-in."
cloudSignedInTitle:
  message: "Kando"
  description: "Title of the browser page Google's sign-in returns to, the app's name."
correctBar:
  message: "Correct Line"
  description: "Accessible name of the bar over the picture that holds the buttons for correcting the selected subtitle line."
correctCancel:
  message: "Cancel"
  description: "Button under the fields that edit a subtitle line: puts them away without changing the line."
correctDone:
  message: "Done"
  description: "Button of the bar of the selected subtitle line: lets go of the line."
correctEdit:
  message: "Edit"
  description: "Button of the bar of the selected subtitle line: shows the fields that edit its translation and its original."
correctEnd:
  message: "End"
  description: "Label before the two buttons of the bar of the selected subtitle line that move its end a tenth of a second earlier or later."
correctEndAt:
  message: "End {time}"
  description: "Message on the picture after the end of the selected subtitle line was moved: where it ends now, as 0:12.4."
  placeholders:
    time: { type: "String", example: "0:12.4" }
correctKeyDone:
  message: "Finish Correcting the Line"
  description: "Shortcut row of Escape while a subtitle line is selected for correcting: lets go of it, before Escape would leave the film."
correctKeyEdit:
  message: "Edit the Selected Line"
  description: "Shortcut row of Return while a subtitle line is selected: shows the fields that edit its translation and its original; also the accessible name of those fields' group."
correctKeyEndEarlier:
  message: "End 0.1 Second Earlier"
  description: "Shortcut row and button: moves the end of the selected subtitle line a tenth of a second earlier."
correctKeyEndLater:
  message: "End 0.1 Second Later"
  description: "Shortcut row and button: moves the end of the selected subtitle line a tenth of a second later."
correctKeyNext:
  message: "Select the Next Line"
  description: "Shortcut row and button while a subtitle line is selected for correcting: selects the line after it."
correctKeyNoSpeech:
  message: "Mark as No Speech"
  description: "Shortcut row and button: leaves the selected subtitle line out of the film, as one the speech recognition heard in music or noise."
correctKeyPrev:
  message: "Select the Previous Line"
  description: "Shortcut row and button while a subtitle line is selected for correcting: selects the line before it."
correctKeyRestore:
  message: "Restore Lines Marked as No Speech"
  description: "Subtitles menu item: brings back every line of the open film the user marked as no speech."
correctKeySelect:
  message: "Select the Current Line"
  description: "Shortcut row of E on the player: selects the subtitle line playing, to correct it."
correctKeyStartEarlier:
  message: "Start 0.1 Second Earlier"
  description: "Shortcut row and button: moves the start of the selected subtitle line a tenth of a second earlier."
correctKeyStartLater:
  message: "Start 0.1 Second Later"
  description: "Shortcut row and button: moves the start of the selected subtitle line a tenth of a second later."
correctMarkedNoSpeech:
  message: "Marked as no speech"
  description: "Message on the picture after a subtitle line was marked as no speech."
correctNewer:
  message: "These corrections were made by a newer version of Kando and can’t be changed here"
  description: "Message on the picture when the film's corrections file was written by a newer Kando, which this version does not write over."
correctOriginal:
  message: "Original"
  description: "Label of the field that edits the original line of the selected subtitle line."
correctOriginalEmpty:
  message: "The original can’t be empty. To leave the line out, mark it as no speech"
  description: "Message on the picture when the user submits a subtitle line with its original field empty, which is not kept."
correctRedo:
  message: "Redo “{step}”"
  description: "Edit menu item and shortcut row: makes again the change of the film's lines that Undo took back, named."
  placeholders:
    step: { type: "String", example: "Edit Line 12" }
correctRedone:
  message: "Redone: {step}"
  description: "Message on the picture after Redo made a change of the film's lines again."
  placeholders:
    step: { type: "String", example: "Edit Line 12" }
correctRestored:
  message: "Restored {count, plural, one {# line} other {# lines}}"
  description: "Message on the picture after the lines marked as no speech were brought back."
  placeholders:
    count: { type: "int", example: "3" }
correctSaveFailed:
  message: "Couldn’t save the correction"
  description: "Message on the picture when the film's corrections file could not be written."
correctSaved:
  message: "Saved your correction"
  description: "Message on the picture after an edit of a subtitle line was kept."
correctStart:
  message: "Start"
  description: "Label before the two buttons of the bar of the selected subtitle line that move its start a tenth of a second earlier or later."
correctStartAt:
  message: "Start {time}"
  description: "Message on the picture after the start of the selected subtitle line was moved: where it starts now, as 0:10.4."
  placeholders:
    time: { type: "String", example: "0:10.4" }
correctStepEdit:
  message: "Edit Line {line}"
  description: "What a change of the film's lines was, for Undo and Redo to name it: an edit of the line numbered line, counting from 1."
  placeholders:
    line: { type: "int", example: "12" }
correctStepEnd:
  message: "Move the End of Line {line}"
  description: "What a change of the film's lines was, for Undo and Redo to name it: the end of the line numbered line moved."
  placeholders:
    line: { type: "int", example: "12" }
correctStepNoSpeech:
  message: "Mark Line {line} as No Speech"
  description: "What a change of the film's lines was, for Undo and Redo to name it: the line numbered line marked as no speech."
  placeholders:
    line: { type: "int", example: "12" }
correctStepRestore:
  message: "Restore {line, plural, one {# Line} other {# Lines}} Marked as No Speech"
  description: "What a change of the film's lines was, for Undo and Redo to name it: the lines marked as no speech brought back, how many."
  placeholders:
    line: { type: "int", example: "3" }
correctStepStart:
  message: "Move the Start of Line {line}"
  description: "What a change of the film's lines was, for Undo and Redo to name it: the start of the line numbered line moved."
  placeholders:
    line: { type: "int", example: "12" }
correctSubmit:
  message: "Save"
  description: "Button under the fields that edit a subtitle line: keeps what they hold and plays on."
correctTranslation:
