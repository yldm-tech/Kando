    where: { type: "String", example: "/opt/homebrew/bin/yt-dlp" }
settingsGeneralToolsNote:
  message: "Kando downloads the programs it is missing. Those already installed on this computer are used as they are."
  description: "Footnote under the programs Kando runs: Kando downloads the missing ones itself."
settingsGeneralToolsNoteManual:
  message: "These programs come from this computer; Kando doesn't install or update them."
  description: "Footnote under the programs Kando runs, on a system where it does not download them (Windows): they are the user's to install."
settingsGeneralUpdateAvailable:
