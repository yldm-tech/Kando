settingsSpeechNote:
  message: "Breaks sentences smartly. Larger models are more accurate but slower and take more space; if unsure, use the recommended one. Models download from HuggingFace, and a canceled download leaves no partial file behind; models other apps have already downloaded (Vimpo, hyperframes) are used as they are, without copying."
  description: "Footnote under the whisper models."
settingsSpeechRecommended:
