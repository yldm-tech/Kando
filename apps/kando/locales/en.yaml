onboardingTranslationService:
  message: "Translation · AI Service"
  description: "Name of the second step's row about the translation service."
onboardingUse:
  message: "Use"
  description: "Button making a downloaded speech model the one in use."
onboardingWatchLanguages:
  message: "Languages of the videos you watch · Choose any"
  description: "Heading over the first step's language tiles."
onboardingWatchLanguagesLabel:
  message: "Languages of the videos you watch"
  description: "Accessible name of the group of the first step's language tiles."
onboardingWelcome:
  message: "Welcome to Kando"
  description: "Title of the first-run guide's first step, and the accessible name of the guide's sheet."
onboardingWelcomeDescription:
  message: "Paste a YouTube or Bilibili link, or drag in a local video, and learn as you watch. First, choose your languages."
  description: "Line under the first step's title."
paletteAnswerNote:
  message: "Based only on what has played (up to {at}) · Answered by {model}"
  description: "Footnote under an answer: it rests only on the part of the film played so far, up to a moment, and which model answered."
  placeholders:
    at: { type: "String", example: "12:31" }
    model: { type: "String", example: "gpt-4o-mini" }
paletteAskFailed:
  message: "No answer came back: {error}"
  description: "Answer card when the AI service returned no answer; error is the service's error message."
  placeholders:
    error: { type: "String", example: "401 Unauthorized" }
paletteAskRow:
  message: "Ask this film: “{question}”"
  description: "First row of the command palette in the player once something is typed: Return or a click asks the AI service the typed question about the open film."
  placeholders:
    question: { type: "String", example: "Who is the man in the hat?" }
paletteAsking:
  message: "Asking {model}…"
  description: "Answer card while the question is on its way to the AI model."
  placeholders:
    model: { type: "String", example: "gpt-4o-mini" }
paletteExplainLine:
  message: "Explain Line"
  description: "Subtitles menu item and shortcut row (I): the AI service explains the subtitle line selected for correcting, or with none the one playing, its meaning, key words and grammar, in the player's side panel."
paletteFieldLabel:
  message: "Films, commands or watched lines"
  description: "Accessible name of the command palette's field over the library, where it finds films, commands and lines but takes no question."
paletteFieldLabelFilm:
  message: "Commands, lines or questions"
  description: "Accessible name of the command palette's field in the player, where a question can also be asked about the open film."
paletteFooter:
  message: "Type to search films, commands and watched lines · ↑↓ to select · {platform, select, macOS {Return} other {Enter}} to run"
  description: "Footer of the command palette over the library: what typing, the arrow keys and Return (Enter on Windows and Linux) do. platform is the system the app runs on; each case names the key as that system's keyboards do."
  placeholders:
    platform: { type: "String", example: "macOS" }
paletteFooterFilm:
  message: "Type to search films, commands and watched lines, or to ask this film · ↑↓ to select · {platform, select, macOS {Return} other {Enter}} to ask or run"
  description: "Footer of the command palette in the player: what typing, the arrow keys and Return (Enter on Windows and Linux) do. Return asks the open film the typed question while its row is highlighted, and runs the highlighted command otherwise. platform is the system the app runs on; each case names the key as that system's keyboards do."
  placeholders:
    platform: { type: "String", example: "macOS" }
paletteHeadingAnswer:
  message: "Answer"
  description: "Heading of the card with the answer to a question about the film."
paletteHeadingCommands:
  message: "Commands"
  description: "Heading of the commands the command palette found."
paletteHeadingFilms:
  message: "Films"
  description: "Heading of the films of the library whose names hold what was typed in the command palette; choosing one plays it."
paletteHeadingLines:
  message: "Lines"
  description: "Heading of the subtitle lines the command palette found."
paletteJumpTo:
  message: "Jump to {time}"
  description: "Accessible name of a chip under an answer that plays the film from the moment the answer rests on."
  placeholders:
    time: { type: "String", example: "0:30" }
paletteLibrarySaveFailed:
  message: "Couldn't save the film list: {error}"
  description: "Error shown when library.json could not be written after noting how far a video has played."
  placeholders:
    error: { type: "String", example: "permission denied" }
paletteMenuItem:
  message: "Ask This Film / Commands…"
  description: "Study menu item and shortcut row (⌘K) that opens the command palette, which also answers questions about the open film."
paletteNoAI:
  message: "Answering questions needs an AI service. Choose a model in “AI Service” first."
  description: "Answer card when no AI service is set to answer questions about the film."
paletteNoAIAction:
  message: "Open AI Service Settings"
  description: "Button on the answer card that opens the AI Service section of Settings."
paletteNoSubtitles:
  message: "This film has no subtitles yet, so it can't be answered."
  description: "Answer card when the open film has no subtitles to answer from."
paletteNotWatched:
  message: "You haven't started watching this film. Play some of it first, then ask."
  description: "Answer card when nothing of the open film has been played yet, so there is nothing to answer from."
paletteNothingFound:
  message: "No films, commands or watched lines found."
  description: "Note when the palette's query found nothing over the library."
palettePlaceholder:
  message: "Films, commands or watched lines…"
  description: "Placeholder of the command palette's field over the library."
palettePlaceholderFilm:
  message: "Commands, lines, or ask this film…"
  description: "Placeholder of the command palette's field in the player, where a question can be asked about the open film."
paletteSettingsSection:
  message: "Settings › {section}"
  description: "Command palette command that opens a section of Settings."
  placeholders:
    section: { type: "String", example: "AI Service" }
paletteSubmenuItem:
  message: "{menu} › {item}"
  description: "Command palette command, where the app has no menu bar, for an item of a menu bar submenu such as Sort By › Name or Switch Library › a library's name."
  placeholders:
    menu: { type: "String", example: "Sort By" }
    item: { type: "String", example: "Name" }
paletteSubtitleMode:
  message: "Subtitles: {mode}"
  description: "Brief notice over the player after the palette switched the subtitles' display mode."
  placeholders:
    mode: { type: "String", example: "Bilingual" }
paletteSwitchTo:
  message: "Switch to {mode}"
  description: "Command palette command, in the player, that switches the subtitles to another display mode."
  placeholders:
    mode: { type: "String", example: "Translation Only" }
phoneSyncLinkAsk:
  message: "{device} sent a link. It's in the link field above: click Start Processing to add it."
  description: "Library message bar when a paired phone sent a link while Settings › Phone Sync › When One Arrives is Ask Me First: the link was put in the link field, and the user starts it with the Start Processing button."
  placeholders:
    device: { type: "String", example: "Evan's iPhone" }
phoneSyncLinkQueued:
  message: "Added the link {device} sent to the queue."
  description: "Library message bar when a paired phone sent a link and it was queued at once."
  placeholders:
    device: { type: "String", example: "Evan's iPhone" }
playerKeepAwake:
  message: "Playing a video"
  description: "Why Kando keeps the display awake while a film plays; the system lists it with what keeps the computer awake (on macOS, pmset -g assertions)."
playerKeyCopyLine:
  message: "Copy Current Line"
  description: "Shortcut row and menu item: copy the subtitle line playing now, the translation over the original."
playerKeyCycleSubtitles:
  message: "Cycle Original/Translation/Bilingual"
  description: "Shortcut row and menu item: step through the subtitle modes."
playerKeyDelayEarlier:
  message: "Subtitles 0.1 Second Earlier"
  description: "Shortcut row and menu item: subtitles a tenth of a second earlier."
playerKeyDelayLater:
  message: "Subtitles 0.1 Second Later"
  description: "Shortcut row and menu item: subtitles a tenth of a second later."
playerKeyExtendLoop:
  message: "Extend Loop to Next Line"
  description: "Shortcut row and menu item (Shift+L): the loop takes in the subtitle line after it, so several lines play over and over; without a loop it loops the line playing."
playerKeyFaster:
  message: "Faster"
  description: "Shortcut row and menu item: play the film at the next faster speed."
playerKeyLarger:
  message: "Larger Subtitles"
  description: "Shortcut row and menu item: larger subtitles."
playerKeyLoopGap:
  message: "Pause Between Repeats"
  description: "Menu item of the Playback menu, checked while on: a looped line waits, after each pass, for as long as it played, so the learner can say it after it, and then plays again by itself."
playerKeyLoopLine:
  message: "Loop"
  description: "Shortcut row and menu item, checked while a loop plays: play the subtitle line playing over and over, or stop the loop, of one line or of several (Shift+L)."
playerKeyMute:
  message: "Mute/Unmute"
  description: "Shortcut row and menu item: mute or unmute."
playerKeyNextLine:
  message: "Next Line"
  description: "Shortcut row and menu item: play from the start of the next subtitle line."
playerKeyPauseLines:
  message: "Pause After Each Line"
  description: "Shortcut row and menu item (P), checked while on: the film pauses as each subtitle line ends, for shadowing or dictation, and Space plays on."
playerKeyPeekLine:
  message: "Show This Line in Both Languages"
  description: "Shortcut row and menu item (T): the line playing shows on the picture with its translation and its original, whatever the subtitle mode, until the line changes or T is pressed again."
playerKeyPlayPause:
  message: "Play/Pause"
  description: "Shortcut row and menu item: play or pause."
playerKeyPrevLine:
  message: "Previous Line"
  description: "Shortcut row and menu item: play from the start of the subtitle line before the one playing, or of the one playing when it has played for more than a second."
playerKeyReplayLine:
  message: "Replay Line"
  description: "Shortcut row and menu item: play the subtitle line playing again from its start."
playerKeySearch:
  message: "Search Subtitles"
  description: "Shortcut row and menu item: search the subtitle list."
playerKeySlower:
  message: "Slower"
  description: "Shortcut row and menu item: play the film at the next slower speed."
playerKeySmaller:
  message: "Smaller Subtitles"
  description: "Shortcut row and menu item: smaller subtitles."
playerKeySubtitlesDown:
  message: "Move Subtitles Down"
  description: "Shortcut row and menu item: move the open film's subtitles a little lower over the picture."
playerKeySubtitlesReset:
  message: "Reset Subtitle Position"
  description: "Shortcut row and menu item: put the open film's subtitles back where the subtitle style places them."
playerKeySubtitlesUp:
  message: "Move Subtitles Up"
  description: "Shortcut row and menu item: move the open film's subtitles a little higher over the picture."
playerKeyToggleSidebar:
  message: "Show/Hide Sidebar"
  description: "Shortcut row and menu item: show or hide the player's side panel."
playerKeyToggleSubtitles:
  message: "Show/Hide Subtitles"
  description: "Shortcut row and menu item: hide the subtitles, or show them again."
playerKeyVolumeDown:
  message: "Volume Down"
  description: "Shortcut row and menu item: quieter."
playerKeyVolumeUp:
  message: "Volume Up"
  description: "Shortcut row and menu item: louder."
playerMissingPlugins:
  message: "This video needs GStreamer plug-ins that aren't installed. On Debian or Ubuntu, run the command below in a terminal; on other systems, install GTK 4's GStreamer media backend and GStreamer's good, bad and libav plug-ins. Then reopen Kando."
  description: "Shown in place of the picture on Linux when the system's player has no GStreamer plug-in for the video; the command to copy, for Debian and Ubuntu, is under it."
playerOsdCopied:
  message: "Copied"
  description: "Message on the picture after the playing subtitle line was copied."
playerOsdDelay:
  message: "Subtitles {delay}"
  description: "Message on the picture after the subtitle delay changed."
  placeholders:
    delay: { type: "String", example: "+0.3 s" }
playerOsdMuted:
  message: "Muted"
  description: "Message on the picture after the film was muted."
playerOsdSpeed:
  message: "Speed {rate}"
  description: "Message on the picture after the playback speed changed."
  placeholders:
    rate: { type: "String", example: "1.5×" }
playerOsdSubtitleSize:
  message: "Subtitle Size {size}"
  description: "Message on the picture after the subtitles were made larger or smaller: the translation's font size."
  placeholders:
    size: { type: "int", example: "32" }
playerOsdVolume:
  message: "Volume {percent}%"
  description: "Message on the picture after the volume changed."
  placeholders:
    percent: { type: "int", example: "70" }
playerSaveSpeedFailed:
  message: "Couldn't save the speed"
  description: "Message on the picture when the playback speed could not be saved in the settings."
playerSaveSubtitlesFailed:
  message: "Couldn't save subtitle settings"
  description: "Message on the picture when the subtitle settings could not be saved."
playerSaveVolumeFailed:
  message: "Couldn't save the volume"
  description: "Message on the picture when the volume could not be saved."
playerStreamDownload:
  message: "Download Video"
  description: "Button that downloads the video of a Subtitles Only film to this computer, beside its subtitles, so it plays offline."
playerStreamDownloadLater:
  message: "Download Video When Online"
  description: "Button on the card of a Subtitles Only film opened offline: schedules the download of its video, which starts once offline mode is off."
playerStreamFailed:
  message: "Couldn't stream this film"
  description: "Title of the card over the player when streaming a Subtitles Only film failed."
playerStreamFailedDetail:
  message: "{site} didn't give a stream Kando can play. Check your network and try again, or download the video to watch it."
  description: "Text of the card over the player when streaming a Subtitles Only film failed. site is the film's site, such as YouTube."
  placeholders:
    site: { type: "String", example: "YouTube" }
playerStreamGoOnline:
  message: "Turn Off Offline Mode"
  description: "Button on the card of a Subtitles Only film opened offline: turns offline mode off and streams the film."
playerStreamNone:
  message: "This film is subtitles only and can't stream here"
  description: "Title of the card over the player when a Subtitles Only film is opened where Kando cannot stream its site's video (any site but YouTube, and any system but macOS for now)."
playerStreamNoneDetail:
  message: "Kando can't stream videos from {site} on this computer yet. Download the video to watch it; subtitles, explanations, notes and export still work."
  description: "Text of the card over the player when Kando cannot stream a Subtitles Only film's video here. site is the film's site, such as Bilibili."
  placeholders:
    site: { type: "String", example: "Bilibili" }
playerStreamOffline:
  message: "This film is subtitles only, so it can't play offline"
  description: "Title of the card over the player when a Subtitles Only film (its video was never kept) is opened while offline mode is on."
playerStreamOfflineDetail:
  message: "Its video isn't on this computer: it streams from {site} when you watch it. Subtitles, explanations, notes and export still work."
  description: "Text of the card over the player when a Subtitles Only film is opened while offline mode is on. site is where the video streams from, such as YouTube."
  placeholders:
    site: { type: "String", example: "YouTube" }
playerStreamQueued:
  message: "Download Scheduled"
  description: "Disabled button of a Subtitles Only film whose video download is waiting or running."
playerStreamRetry:
  message: "Try Again"
  description: "Button on the card of a Subtitles Only film whose stream failed: looks the stream up again."
playerSubsMissing:
  message: "The subtitle file is gone"
  description: "Shown in the subtitle list when the subtitle file has been deleted or moved."
playerSubsUnreadable:
  message: "Couldn't read the subtitles"
  description: "Shown in the subtitle list when the subtitle file cannot be read or parsed."
playerUnplayable:
  message: "This video can't be played"
  description: "Shown in place of the picture when the system's player cannot play the video, nor the copies ffmpeg makes of it for the player."
playlistAdd:
  message: "{count, plural, one {Add # Video} other {Add # Videos}}"
  description: "Button of the playlist dialog that adds the videos found to the library's queue, those the library does not have yet."
  placeholders:
    count: { type: "int", example: "24" }
playlistAddWhole:
  message: "Add Whole Playlist"
  description: "Button of the message bar after a video of a YouTube playlist was added on its own: it lists the playlist's videos and asks before adding them."
playlistCancel:
  message: "Cancel"
  description: "Button of the playlist dialog that closes it without adding anything, and stops looking for the videos."
playlistChannelLimit:
  message: "Kando adds a channel's {limit} most recent videos."
  description: "Line of the playlist dialog when a channel was read: only its most recent videos are listed, as a channel may hold thousands."
  placeholders:
    limit: { type: "int", example: "50" }
playlistEmpty:
  message: "No videos found."
  description: "Line of the playlist dialog when the playlist or channel holds no video Kando can add."
playlistFailed:
  message: "Couldn't read the videos: {error}"
  description: "Line of the playlist dialog when yt-dlp could not list the videos of the playlist or channel; the error is what yt-dlp said, in English."
  placeholders:
    error: { type: "String", example: "The playlist does not exist." }
playlistHave:
  message: "{count, plural, one {# is already in the library and won't be added again.} other {# are already in the library and won't be added again.}}"
  description: "Line of the playlist dialog: how many of the videos found the library already has, waiting, being processed or done."
  placeholders:
    count: { type: "int", example: "3" }
playlistReading:
  message: "Finding Videos…"
  description: "Title of the playlist dialog, and the name of its spinner, while Kando reads which videos a playlist or a channel holds."
playlistSeveral:
  message: "{count, plural, one {# Playlist or Channel} other {# Playlists and Channels}}"
  description: "Title of the playlist dialog when several playlist or channel links were added at once."
  placeholders:
    count: { type: "int", example: "2" }
playlistTimedOut:
  message: "Reading the videos took too long. Try again later."
  description: "Line of the playlist dialog when yt-dlp did not finish listing the videos in time."
playlistUntitled:
  message: "Playlist"
  description: "Title of the playlist dialog for a playlist the site gives no name."
playlistUntitledChannel:
  message: "Channel"
  description: "Title of the playlist dialog for a channel the site gives no name."
playlistVideos:
  message: "{count, plural, one {# video.} other {# videos.}}"
  description: "Line of the playlist dialog: how many videos the playlist or channel holds, each counted once."
  placeholders:
    count: { type: "int", example: "54" }
precheckChannel:
  message: "This is a link to a {site} channel, not to one video. List its videos first, then add them."
  description: "Message bar when the link added is a channel's on a named site: a job downloads one video, and yt-dlp would download the whole channel."
  placeholders:
    site: { type: "String", example: "YouTube" }
precheckChannelUnnamed:
  message: "This is a link to a channel, not to one video. List its videos first, then add them."
  description: "Message bar when the link added is a channel's on a site without a known name."
precheckEmpty:
  message: "Paste a video link first, or choose a local file."
  description: "Message bar when the link field is empty."
precheckEveryAPIFailed:
  message: "Couldn't get the sign-in from the everyapi command-line program; see “AI Service”"
  description: "Message bar, the sidebar's status line, the first-run guide and the command palette when the AI service is EveryAPI with no API Key and asking the everyapi command-line program for its sign-in failed for a reason other than it being missing or signed out (it timed out, crashed or answered in a form Kando does not understand). The AI Service page says why. everyapi is the program's name and stays as it is."
precheckEveryAPIMissing:
  message: "Translation needs the everyapi command-line program, or an API Key in “AI Service”"
  description: "Message bar, the sidebar's status line, the first-run guide and the command palette when the AI service is EveryAPI with no API Key and the everyapi command-line program, whose sign-in it would use, is not on this computer. everyapi is the program's name and stays as it is."
precheckEveryAPISignedOut:
  message: "Run everyapi auth login in a terminal, or enter an API Key in “AI Service”"
  description: "Message bar, the sidebar's status line, the first-run guide and the command palette when the AI service is EveryAPI with no API Key and nobody is signed in to the everyapi command-line program. everyapi auth login is the command to type and stays as it is; a terminal is the program it is typed in (Terminal on macOS, Windows Terminal or PowerShell on Windows)."
precheckFailedDownload:
  message: "Download failed: {detail}"
  description: "Card of a job whose download failed for an unknown reason, with what yt-dlp said (often English)."
  placeholders:
    detail: { type: "String", example: "Something nobody has seen" }
precheckFailedExport:
  message: "Exporting subtitles failed: {detail}"
  description: "Card of a job whose subtitle export failed for an unknown reason, with the error (often English)."
  placeholders:
    detail: { type: "String", example: "open /v/a.srt: permission denied" }
precheckFailedProcess:
  message: "Processing failed: {detail}"
  description: "Card of a failed job whose failure has no known reason, with what the program said (often English)."
  placeholders:
    detail: { type: "String", example: "boom" }
precheckFailedTranscribe:
  message: "Generating subtitles failed: {detail}"
  description: "Card of a job whose transcription failed for an unknown reason, with what whisper-cli said (often English)."
  placeholders:
    detail: { type: "String", example: "failed to read audio" }
precheckFailedTranslate:
  message: "Translation failed: {detail}"
  description: "Card of a job whose translation failed for an unknown reason, with what the AI service said (often English)."
  placeholders:
    detail: { type: "String", example: "something nobody has seen" }
precheckList:
  message: "This is a link to a {site} playlist, not to one video. List its videos first, then add them."
  description: "Message bar when the link added is a playlist on a named site that names no single video: yt-dlp would download the whole list."
  placeholders:
    site: { type: "String", example: "YouTube" }
precheckListUnnamed:
  message: "This is a link to a playlist, not to one video. List its videos first, then add them."
  description: "Message bar when the link added is a playlist on a site without a known name that names no single video."
precheckNoAudio:
  message: "The video has no sound, so there is no speech to transcribe"
  description: "Card of a failed job whose video has no sound track, as a silent screen recording: there is nothing to transcribe, and retrying cannot help."
precheckNoLLMModel:
  message: "Choose a model in “AI Service” first"
  description: "Message bar and the sidebar's status line when no translation model is chosen; “AI Service” is the settings page."
precheckNoLibrary:
  message: "Create or open a library first"
  description: "Message bar and the sidebar's status line when no library is open."
precheckNoSpeech:
  message: "No speech was recognized in the video"
  description: "Card of a failed job when whisper heard no speech."
precheckNoSpeechModel:
  message: "Choose a model in “Speech Recognition” first"
  description: "Message bar and the sidebar's status line when no speech recognition model is chosen; “Speech Recognition” is the settings page."
precheckNoTools:
  message: "The programs that process videos aren't installed yet"
  description: "Card of a failed job when a program it needs (yt-dlp, ffmpeg, whisper-cli) is not installed."
precheckNoTranscript:
  message: "This film's original subtitles are gone, so its translation can't be redone on its own. Process the entire film again instead."
  description: "Why translating a finished film again failed, the reason in queueRedoFailed: the transcript beside its video was deleted, so only Process Again (which downloads and transcribes the film again) can make new subtitles."
precheckNoVideo:
  message: "Only video files can be added (mp4, mov, mkv, webm and others)."
  description: "Message bar when none of the files dropped or picked is a video."
precheckNotLink:
  message: "This doesn't look like a video link. Kando supports YouTube, Bilibili and the thousands of websites yt-dlp can read."
  description: "Message bar when what was pasted is not a link."
precheckPage:
  message: "This page isn't a video. Paste the link of one of its videos."
  description: "Message bar when the link added is a page that lists videos without being one, such as a site's home page, search results, a feed or a hashtag: yt-dlp would download whichever video it finds there first."
precheckSubtitlesChanged:
  message: "This film's subtitles were changed since Kando made them, so the lines that failed can't be found. Translate it again to redo every line."
  description: "Why translating only a film's missing lines failed: its bilingual subtitle file was edited by hand and no longer matches the transcript line for line, so Kando cannot tell which lines are untranslated. Translate Again redoes every line."
precheckToolSeparator:
  message: ", "
  description: "What goes between the names of missing programs in a list, such as yt-dlp and ffmpeg."
precheckToolsBroken:
  message: "Programs that process videos don't run: {tools}. Fix them in Settings › General."
  description: "Message bar when the copies of programs a job needs do not start, with their names joined by precheckToolSeparator."
  placeholders:
    tools: { type: "String", example: "ffmpeg" }
precheckToolsDownloading:
  message: "Still downloading the programs that process videos: {tools}. Try again once they're in."
  description: "Message bar when programs a job needs are still downloading, with their names joined by precheckToolSeparator."
  placeholders:
    tools: { type: "String", example: "yt-dlp、ffmpeg" }
precheckToolsMissing:
  message: "The programs that process videos aren't installed yet: {tools}"
  description: "Message bar when programs a job needs are not installed, with their names joined by precheckToolSeparator."
  placeholders:
    tools: { type: "String", example: "yt-dlp、ffmpeg" }
precheckTranslateAuth:
  message: "The AI service doesn't accept this key. Check it in “AI Service”."
  description: "Card of a job whose translation failed because the AI service refused the key."
precheckTranslateBusy:
  message: "The AI service stayed busy, even after automatic retries. Retry in a few minutes."
  description: "Card of a job whose translation failed because the AI service kept answering that it is busy."
precheckTranslateMalformed:
  message: "The AI returned the translation in the wrong format, even after a few retries. Retry, or choose another model in “AI Service”."
  description: "Card of a job whose translation failed because the model's answer was not in the expected format."
precheckTranslateNetwork:
  message: "Can't connect to the AI service. Check your network, then retry."
  description: "Card of a job whose translation failed because the AI service could not be reached."
precheckTranslateQuota:
  message: "Your AI service account is out of credit. Top it up, then retry."
  description: "Card of a job whose translation failed because the AI service said the account is out of credit or over its quota."
precheckTranslateRejected:
