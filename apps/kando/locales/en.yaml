settingsSpeechModels:
  message: "whisper Models"
  description: "Heading of the Speech Recognition page's card, and the name of its radio group. whisper is a program name, kept lowercase."
settingsSpeechNameLargeV3TurboQ5:
  message: "Large v3 Turbo (Compressed)"
  description: "Name of the whisper model large-v3-turbo-q5, the quantized (smaller) Large v3 Turbo. Large v3 Turbo is the model's name; translate only the qualifier."
settingsSpeechNoModelsDir:
  message: "There is no models folder yet"
